<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#081624">
<title>LDA Spil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful table-duel, like printed pen-and-paper game sheets — chunky outlines, bold colour, clear at arm's length
   IDEA: a little stage between two players: every game gets its own illustrated world that reacts to each roll
   PICTURE: castle tower of stone, treasure island with a growing coin pile, dice on felt, a card table, an open treasure chest
   COLOUR and TYPE: navy band, red #ff5240 vs blue #3d8bff, scene colours from each world; Poppins 500/800
   LAYOUT: home screen with one tile per game; in a game: slim navy bar, player cards, the big scene, and the input dock (keys, risk, stop) always on screen */
:root{color-scheme:light dark;
--bg:light-dark(#eaf2fc,#06101b);--paper:light-dark(#fff,#0f1e2f);--ink:light-dark(#081624,#e9f0f8);
--soft:light-dark(#5b6b7d,#9fb0c4);--line:light-dark(#081624,#2a3d52);--navy:#081624;
--red:#ff5240;--blue:#3d8bff;--green:#1fb36b;--yellow:#f2a900;--gold:#ffc23a;--tint:light-dark(#f3f7fc,#132538);--k:#081624}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Poppins,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* ---------- scenes ---------- */
.scene{position:relative;height:clamp(270px,40cqw,350px);border-radius:20px;overflow:hidden;border:3px solid var(--k);isolation:isolate}
.scene.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.banner{position:absolute;left:50%;top:18%;transform:translateX(-50%) rotate(-4deg);z-index:9;background:var(--red);color:#fff;font-weight:800;font-size:clamp(20px,4cqw,32px);padding:6px 22px;border:3px solid var(--k);border-radius:14px;box-shadow:0 5px 0 var(--k);white-space:nowrap;animation:stamp .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{transform:translateX(-50%) rotate(-4deg) scale(2.2);opacity:0}}
.big{position:absolute;z-index:5;right:clamp(12px,3cqw,26px);top:14px;text-align:right;font-weight:800;font-size:clamp(40px,7cqw,62px);line-height:.95;color:var(--k);text-shadow:0 3px 0 rgba(255,255,255,.7)}
.big small{display:block;font-size:14px;font-weight:600;text-shadow:none;opacity:.8}
.hint{position:absolute;z-index:5;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(255,255,255,.92);color:var(--k);border:3px solid var(--k);border-radius:14px;padding:8px 16px;font-weight:700;text-align:center;max-width:80%}

/* tower */
.sky{background:linear-gradient(#9fd5ff,#e4f4ff 70%)}
.sun{position:absolute;left:8%;top:12%;width:58px;height:58px;border-radius:50%;background:#ffd34d;box-shadow:0 0 0 10px rgba(255,211,77,.3)}
.cloud{position:absolute;height:26px;width:90px;background:#fff;border-radius:20px;opacity:.9;animation:drift 18s linear infinite}
.cloud::before{content:"";position:absolute;width:44px;height:40px;border-radius:50%;background:#fff;left:18px;top:-18px}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(900px)}}
.hill{position:absolute;bottom:-60px;border-radius:50%;background:#7ccf6a;border-top:3px solid var(--k)}
.ground{position:absolute;left:0;right:0;bottom:0;height:30px;background:#5cb455;border-top:3px solid var(--k)}
.castle{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;z-index:2}
.stone{height:clamp(26px,4cqw,32px);border:3px solid var(--k);border-bottom-width:0;border-radius:3px 3px 0 0;background-color:#e2b56f;
 background-image:linear-gradient(rgba(255,240,200,.6) 0 3px,transparent 3px),linear-gradient(transparent 65%,rgba(120,70,20,.28)),repeating-linear-gradient(90deg,transparent 0 26px,rgba(90,50,10,.45) 26px 28px);
 display:grid;place-items:center;position:relative;animation:drop .45s cubic-bezier(.3,1.5,.5,1) both}
.stone:first-child{border-bottom-width:3px}
.stone b{background:var(--c);color:var(--on,#fff);border:2px solid var(--k);border-radius:999px;min-width:34px;height:22px;padding:0 6px;display:grid;place-items:center;font-size:15px;line-height:1;box-shadow:0 0 0 2px #ffd34d}
.stone.ghost{background:rgba(255,248,230,.3);background-image:none;border:2px dashed rgba(90,50,10,.45);animation:none;margin-top:3px}
@keyframes drop{from{transform:translateY(-120px);opacity:0}}
.apex{display:block;height:24px;margin-bottom:-2px;overflow:visible}
.apex.done{filter:drop-shadow(0 0 10px #ffd34d)}
@keyframes wave{to{transform:scaleX(.8) skewY(6deg)}}
.busting .stone{animation:fall 1.1s ease-in forwards;animation-delay:calc(var(--i)*.06s)}
@keyframes fall{to{transform:translate(var(--dx),300px) rotate(var(--r));opacity:.2}}
.desert{background:linear-gradient(#f6a65e,#fbd49a 45%,#fde6bf 75%)}
.desert .sun{left:auto;right:14%;top:10%;background:#fff3c4;box-shadow:0 0 0 10px rgba(255,243,196,.35),0 0 50px 18px rgba(255,190,90,.6)}
.dbg{position:absolute;left:0;right:0;bottom:24px;width:100%;height:62%;z-index:0}
.sandfloor{position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(#ebb46a,#d69a52);border-top:3px solid var(--k);z-index:1}
.dust i{position:absolute;bottom:20px;left:50%;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:rgba(226,186,128,.9);z-index:3;animation:dust 1.3s ease-out both}
@keyframes dust{from{transform:scale(.2);opacity:0}30%{opacity:1}to{transform:translate(var(--x),-40px) scale(2.6);opacity:0}}

/* pirate */
.sea{background:linear-gradient(#ffb88a,#ffe2b8 45%)}
.gull{position:absolute;left:0;width:24px;z-index:1;animation:drift 22s linear infinite}
.gull path{transform-box:fill-box;transform-origin:center;animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.4)}}
.waves{position:absolute;left:-60px;right:-60px;bottom:0;height:34%;z-index:3}
.waves svg{position:absolute;width:calc(100% + 120px);height:100%;animation:sway 4s ease-in-out infinite alternate;animation-delay:var(--wd,0s)}
.waves svg+svg{animation-duration:5.5s;animation-direction:alternate-reverse;opacity:.85;top:14px}
@keyframes sway{to{transform:translateX(50px)}}
.island{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);width:min(70%,420px);height:70px;z-index:2}
.island .sand{position:absolute;inset:auto 0 0;height:56px;background:radial-gradient(ellipse at 50% 0,#fbe3a6,#e9b866 70%);box-shadow:inset 0 -8px 0 #cf9a4e;border:3px solid var(--k);border-radius:50% 50% 12px 12px/100% 100% 12px 12px}
.palm{position:absolute;left:2%;bottom:28px;width:150px;z-index:1;overflow:visible}
.coins{position:absolute;left:50%;bottom:44px;width:0;height:0;z-index:3}
.coin{position:absolute;width:26px;height:14px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3b0,#ffc23a 45%,#e19a00);border:2px solid var(--k);box-shadow:inset 0 -2px 0 rgba(150,90,0,.6);animation:clink .35s ease-out both}
@keyframes clink{from{transform:translateY(-60px);opacity:0}}
.busting .coin{animation:steal 1.2s ease-in forwards;animation-delay:calc(var(--i)*.015s)}
@keyframes steal{to{transform:translate(260px,-40px) scale(.4);opacity:0}}
.ship{position:absolute;right:-200px;bottom:14%;width:min(40%,200px);z-index:4;animation:sail 1.6s ease-in-out forwards}
@keyframes sail{60%{right:4%}to{right:2%}}
.rolls{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:5px;max-width:55%;z-index:5}
.rolls i{font-style:normal;width:28px;height:28px;border:2px solid var(--k);border-radius:7px;background:#fff;color:var(--k);display:grid;place-items:center;font-weight:800;font-size:14px}
.rolls i.six{background:var(--gold)}

/* cards */
.table{background:radial-gradient(ellipse at 50% 40%,#2f8f5b,#155a38 78%);box-shadow:inset 0 0 0 12px #7a4520,inset 0 0 0 14px #081624,inset 0 0 50px 14px rgba(0,0,0,.45)}
.spot{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 15%,rgba(255,255,220,.2),transparent 60%);pointer-events:none}
.feltlbl{position:absolute;left:50%;top:20px;transform:translateX(-50%);font:700 13px Georgia,serif;letter-spacing:.3em;color:rgba(255,220,140,.5);white-space:nowrap}
.table.red{background:radial-gradient(ellipse at 50% 30%,#3a9a62,#145a37 80%)}
.pc{position:absolute;width:clamp(78px,14cqw,112px);aspect-ratio:5/7;background:#fff;border:3px solid var(--k);border-radius:12px;box-shadow:0 6px 0 rgba(0,0,0,.35);color:var(--k);font-weight:800;font-family:Georgia,'Times New Roman',serif;background-image:linear-gradient(160deg,#fff,#f3efe6)}
.pc::before{content:"";position:absolute;inset:6px;border:2px solid var(--c);border-radius:7px;opacity:.5}
.pc .ci{position:absolute;left:8px;top:4px;font-size:clamp(14px,2.4cqw,18px)}
.pc .ci.b{left:auto;top:auto;right:8px;bottom:4px;transform:rotate(180deg)}
.pc .cc{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(34px,6cqw,50px)}
.pc .cc svg{width:58%}
.pc.gold{background:#fff4d2;background-image:linear-gradient(160deg,#fff8e0,#f6e3b0)}
.back{position:absolute;width:clamp(78px,14cqw,112px);aspect-ratio:5/7;border:3px solid var(--k);border-radius:12px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.back::before{content:"";position:absolute;inset:6px;border-radius:6px;background:radial-gradient(circle,rgba(255,255,255,.28) 0 16%,transparent 17%),repeating-linear-gradient(45deg,#0d2340 0 5px,color-mix(in srgb,var(--c) 75%,#0d2340) 5px 10px);box-shadow:inset 0 0 0 2px #d9a33a}
.flip{animation:flip .5s ease-out both}
@keyframes flip{from{transform:translateY(-30px) rotateY(90deg)}}
.lbl{position:absolute;color:#fff;font-weight:700;font-size:13px;text-align:center;transform:translateX(-50%);white-space:nowrap}
.arrow{position:absolute;width:clamp(44px,7cqw,60px);z-index:6;animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.busting .pile .back{animation:scatter 1s ease-in forwards}
@keyframes scatter{to{transform:translate(var(--dx),220px) rotate(var(--r));opacity:0}}
.pc.wrong{animation:flip .5s ease-out both,glow .6s .5s 2}
@keyframes glow{50%{box-shadow:0 0 0 8px var(--red)}}

/* chest */
.cave{background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(0,0,0,.28) 22px 24px),repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.22) 46px 48px),linear-gradient(#4a3a5c,#251a33)}
.torch{position:absolute;top:20%;width:clamp(22px,4cqw,30px);z-index:2;filter:drop-shadow(0 0 14px rgba(255,160,60,.9))}
.loot i{position:absolute;bottom:9%;width:22px;height:11px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3b0,#ffc23a 45%,#c98400);border:2px solid var(--k);z-index:3}
.cave .glow{position:absolute;left:50%;bottom:10%;width:80%;height:80%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 80%,rgba(255,200,80,.55),transparent 60%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(0,0,0,.25) 60px 63px),linear-gradient(#5f4230,#3d2a1d);border-top:3px solid var(--k)}
.chestbox{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:clamp(150px,26cqw,210px);z-index:4}
.chestbox.lid{z-index:2;bottom:calc(6% + clamp(40px,7cqw,56px))}
.fan{position:absolute;left:50%;bottom:calc(6% + clamp(54px,9cqw,74px));width:0;height:0;z-index:3}
.fan .pc{left:calc(clamp(78px,14cqw,112px)/-2);bottom:0;transform-origin:50% 120%;animation:rise .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes rise{from{translate:0 80px;opacity:0}}
.busting .fan .pc{animation:burst 1.1s ease-in forwards}
@keyframes burst{to{transform:translate(var(--dx),-40px) rotate(var(--r));opacity:0}}
.sparkle{position:absolute;width:10px;height:10px;background:#fff6c9;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 1.6s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.3);opacity:.3}}

.field{background:linear-gradient(#ffd3a8,#fff0dc 65%)}
.mnt{position:absolute;bottom:17%;height:66%;background:#a79fcf;clip-path:polygon(0 100%,30% 30%,45% 50%,65% 10%,100% 100%);opacity:.8}
.ct{position:absolute;bottom:8%;transform:translateX(-50%);width:calc(min(150px,88% / var(--n)));background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:3;color:#081624}
.ct svg{width:100%;transition:transform .2s;overflow:visible}
.ct:disabled{cursor:default}
.ct:not(:disabled) svg{animation:target 1s ease-in-out infinite alternate}
@keyframes target{to{transform:translateY(-5px);filter:drop-shadow(0 0 6px #ff5240)}}
.ct.on svg{filter:drop-shadow(0 0 8px var(--c)) drop-shadow(0 0 2px var(--c))}
.ct.on .cn{background:var(--c);color:var(--on,#fff)}
.ct .fl{transform-origin:61px 13px;animation:wave 1.1s ease-in-out infinite alternate}
.ct.hit{animation:shake2 .5s .8s}
@keyframes shake2{20%{transform:translateX(calc(-50% - 8px))}40%{transform:translateX(calc(-50% + 7px))}60%{transform:translateX(calc(-50% - 5px))}80%{transform:translateX(calc(-50% + 3px))}}
.hpb{width:86%;height:16px;border:2px solid #081624;border-radius:99px;background:#fff;position:relative;overflow:hidden}
.hpb i{position:absolute;inset:0 auto 0 0;background:var(--c);transition:width .4s .8s}
.hpb span{position:relative;font-size:10px;font-weight:800;line-height:12px;display:block;text-align:center;text-shadow:0 0 3px #fff}
.cn{font-weight:800;font-size:12px;background:rgba(255,255,255,.9);border:2px solid #081624;border-radius:8px;padding:0 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct.dead .hpb,.ct.dead .wall{opacity:.4}
.smoke{fill:rgba(90,90,100,.45);animation:smoke 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes smoke{from{transform:translateY(0);opacity:.8}to{transform:translateY(-40px) scale(1.6);opacity:0}}
.bx{position:absolute;bottom:calc(8% + 60px);left:var(--x0);z-index:8;animation:bx .8s linear forwards}
@keyframes bx{to{left:var(--x1)}}
.bx{animation-fill-mode:both}
.by{width:20px;height:20px;margin-left:-10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7d8a9a,#081624 60%);border:2px solid #081624;animation:arc .8s forwards}
.trp{width:12px;height:12px;margin-left:-6px;border-radius:50%;background:rgba(175,175,185,.8);animation:arct .8s both}
@keyframes arct{0%{transform:translateY(0);opacity:.75;animation-timing-function:ease-out}50%{transform:translateY(-140px);opacity:.5;animation-timing-function:ease-in}100%{transform:translateY(0) scale(1.8);opacity:0}}
.muzzle{position:absolute;bottom:calc(8% + 62px);width:0;height:0;z-index:8}
.muzzle i{position:absolute;border-radius:50%}
.muzzle .mf{width:56px;height:56px;margin:-28px;background:radial-gradient(circle,#fff6c9 0 22%,#ffc23a 23% 48%,#ff7a2a 49% 68%,transparent 69%);animation:mflash .35s ease-out both}
@keyframes mflash{from{transform:scale(.2)}50%{transform:scale(1.25)}to{transform:scale(1.5);opacity:0}}
.muzzle .ms{width:28px;height:28px;margin:-14px;background:rgba(205,205,212,.9);animation:mpuff 1.3s .05s ease-out both}
@keyframes mpuff{from{transform:scale(.4);opacity:.95}to{transform:translate(var(--sx),-60px) scale(2.4);opacity:0}}
.ct.recoil{animation:recoil .4s ease-out}
@keyframes recoil{30%{transform:translateX(-50%) translateY(4px) scale(.96)}}
.scene.quake{animation:shake .5s .8s}
.flashov{position:absolute;inset:0;background:#fff;z-index:9;pointer-events:none;opacity:0;animation:flashov .45s .8s}
@keyframes flashov{15%{opacity:.6}to{opacity:0}}
.debris{position:absolute;inset:0;pointer-events:none;z-index:6}
.debris i{position:absolute;top:32%;left:50%;width:11px;height:9px;background:#c9c3b8;border:2px solid #081624;border-radius:2px;opacity:0;animation:debris .7s .8s ease-out both}
@keyframes debris{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes arc{0%{transform:translateY(0);animation-timing-function:ease-out}50%{transform:translateY(-140px);animation-timing-function:ease-in}99%{opacity:1}100%{transform:translateY(0);opacity:0}}
.boomfx{position:absolute;top:14%;left:50%;width:140px;height:140px;margin-left:-70px;background:radial-gradient(circle,#fff6c9 0 18%,#ffc23a 19% 42%,#ff5240 43% 62%,transparent 63%);clip-path:polygon(50% 0,61% 32%,95% 20%,72% 48%,100% 70%,64% 68%,55% 100%,42% 70%,6% 84%,30% 55%,0 26%,38% 34%);animation:boom .6s .8s both;z-index:5}
@keyframes boom{from{transform:scale(0)}70%{transform:scale(1.15);opacity:1}to{transform:scale(1.35);opacity:0}}
.dmg{position:absolute;top:-6px;font-weight:800;font-size:clamp(20px,4cqw,30px);color:#fff;-webkit-text-stroke:2px #081624;paint-order:stroke;white-space:nowrap;animation:up 1.4s .85s both;z-index:6}
.rollshow{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;z-index:6;background:rgba(255,255,255,.85);border:2px solid #081624;border-radius:12px;padding:4px 10px 4px 4px;color:#081624}
.rollshow svg{width:44px;height:44px;animation:pop .35s ease-out}
.pl.out{opacity:.5;filter:grayscale(.6)}
.key span{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.key small{font-size:10.5px;font-weight:600;color:var(--soft);margin-top:3px;white-space:nowrap}
.key:disabled{opacity:.3;cursor:default;box-shadow:none;transform:translateY(3px)}
.last{background:var(--gold);color:#081624;border:2px solid var(--k);border-radius:999px;padding:0 12px;font-weight:800;font-size:14px;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pop{from{transform:scale(.4)}}
/* urgency */
.key.bad{background:light-dark(#ffe1dc,#4a1b17);border-color:var(--red);box-shadow:0 4px 0 var(--red)}
.key.bad:active{box-shadow:0 1px 0 var(--red)}
.warn{color:var(--red);font-weight:700}
.risk.hot b{color:var(--red);animation:pulse .5s ease-in-out infinite alternate}
.castle.wob{transform-origin:50% 100%;animation:wob var(--ws,1.2s) ease-in-out infinite alternate}
@keyframes wob{from{transform:translateX(-50%) rotate(calc(var(--w)*-1))}to{transform:translateX(-50%) rotate(var(--w))}}
.stone.ghost em{font-style:normal;font-weight:800;font-size:13px;color:#081624;background:var(--gold);border:2px solid var(--k);border-radius:8px;padding:0 6px;line-height:1.3}
.stone.bon{background-color:#f3d98a}
.bonus{display:block;width:max-content;margin-left:auto;background:var(--gold);color:#081624;border:2px solid var(--k);border-radius:999px;padding:0 10px;font-size:14px;line-height:1.5;font-weight:800;text-shadow:none;margin-top:4px;animation:pop .35s ease-out}
.sea.d2{background:linear-gradient(#f0936b,#ffd0a0 45%)}
.sea.d3{background:linear-gradient(#4d3f70,#d0826e 45%)}
.far{position:absolute;right:var(--sr);bottom:21%;width:var(--sw);z-index:1;animation:bobs 1.6s ease-in-out infinite alternate}
@keyframes bobs{to{transform:translateY(-4px) rotate(-3deg)}}
.danger{position:absolute;left:10px;bottom:8px;z-index:6;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);color:#081624;border:3px solid var(--k);border-radius:12px;padding:3px 8px;font-weight:800;font-size:13px}
.danger svg{width:26px;height:26px}
.danger.d2,.danger.d3{background:var(--red);color:#fff;animation:pop .4s ease-out}
.danger.d3{animation:pop .4s ease-out,shk .35s .4s infinite}
@keyframes shk{25%{transform:translateX(-2px) rotate(-1deg)}75%{transform:translateX(2px) rotate(1deg)}}
.wbk{fill:#c9c3b8;stroke:#081624;stroke-width:3;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.wbk.alt{fill:#b3ac9f}
.wbk.new{animation:drop .45s cubic-bezier(.3,1.5,.5,1) both}
.wbk.brk{animation:brk .7s .8s ease-in both}
@keyframes brk{to{transform:translate(var(--dx),-70px) rotate(140deg);opacity:0}}
.flame{fill:#ff8a1f;stroke:#081624;stroke-width:2;transform-box:fill-box;transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}

.ct.crit .hpb i{background:var(--red)}

@keyframes alarm{to{box-shadow:0 0 0 4px var(--red)}}

.cave.r3 .glow{background:radial-gradient(ellipse at 50% 80%,rgba(255,82,64,.8),transparent 65%);animation:pulse .5s ease-in-out infinite alternate}
.streak{position:absolute;left:20px;top:20px;z-index:6;background:var(--gold);color:#081624;border:3px solid var(--k);border-radius:999px;padding:2px 12px;font-weight:800;font-size:14px;animation:pop .35s ease-out}
.odds{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;align-items:end;padding:8px 8px 4px;background:var(--tint);border:2px solid var(--line);border-radius:12px}

.odds .hi i{background:#1fb36b}.odds .lo i{background:#f2a900}.odds .eq i{background:#9fb0c4}.odds .eq span{color:var(--ink);text-decoration:underline 2px}
.pad .oddtxt{font-size:14px}.oddtxt .hi{color:#13a35c}.oddtxt .lo{color:light-dark(#b07800,#f2a900)}.oddtxt .eq{color:var(--soft);font-weight:600}
.pad .sub{color:var(--soft);font-weight:500}
.btn.guess.gh{background:#1fb36b;color:#fff}.btn.guess.gl{background:#f2a900;color:#081624}
.btn.guess .mg{display:flex;align-items:center;gap:6px;margin-top:8px;background:rgba(255,255,255,.94);color:#081624;border:2px solid #081624;border-radius:12px;padding:2px 12px 2px 4px;text-align:left}
.mg svg{width:62px;height:36px}.mg b{display:block;font-size:20px;line-height:1}.btn.guess .mg small{font-size:12px;font-weight:700;opacity:1}
.bonus.next{background:rgba(255,255,255,.85);border-style:dashed}
.kist{position:absolute;right:10px;bottom:8px;z-index:6;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);color:#081624;border:3px solid var(--k);border-radius:12px;padding:3px 8px;font-weight:800;font-size:13px}
.kist svg{width:26px;height:20px}.kist svg.nw{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both,glowc 1s .5s 2}
@keyframes glowc{50%{filter:drop-shadow(0 0 6px #ffc23a)}}
.banner.gold{background:var(--gold);color:#081624;top:8%;font-size:clamp(18px,4cqw,28px)}
.c3{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,220,100,.75),rgba(255,200,80,.2) 45%,transparent 70%);animation:c3in .4s ease-out both}
.c3 svg{width:clamp(110px,26cqw,160px);margin-top:30px;animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 0 18px #ffd34d)}
.c3 i{position:absolute;left:50%;top:58%;width:22px;height:12px;margin:-6px -11px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3b0,#ffc23a 45%,#c98400);border:2px solid #081624;animation:burstc 1.2s ease-out both}
@keyframes burstc{from{transform:translate(0,0) scale(.3);opacity:1}80%{opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes c3in{from{opacity:0}}
.double-six{position:absolute;inset:0;z-index:8;pointer-events:none;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,226,127,.75),transparent 62%);animation:sixfade 2.2s ease-out both}
.double-six .six-card{display:flex;align-items:center;gap:6px;padding:8px 15px;background:#ffc23a;border:3px solid var(--k);border-radius:18px;box-shadow:0 5px 0 var(--k);color:#081624;font-weight:800;animation:sixpop .65s cubic-bezier(.2,1.5,.4,1) both}
.double-six .six-card svg{width:48px;height:48px}.double-six .six-card span{font-size:clamp(16px,3cqw,25px)}
.double-six .spark{position:absolute;left:50%;top:50%;width:12px;height:12px;background:#fff5b0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:sixspark 1.3s ease-out both}
@keyframes sixfade{0%,65%{opacity:1}100%{opacity:0}}@keyframes sixpop{from{transform:scale(.25) rotate(-12deg);opacity:0}to{transform:scale(1);opacity:1}}@keyframes sixspark{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--sx),var(--sy)) scale(1.6);opacity:0}}

/* ---------- skal: én fast skærm uden rul, bygget til iPad 11" i begge retninger ---------- */
html,body{height:100%}
body{overflow:hidden;overscroll-behavior:none;line-height:1.4}
body.home #game,body:not(.home) #home{display:none}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-6px) rotate(-4deg)}}
@keyframes up{from{transform:translateY(20px) scale(.6);opacity:0}25%{transform:translateY(0) scale(1.15);opacity:1}to{transform:translateY(-50px);opacity:0}}
@keyframes pulse{to{opacity:.35}}
@keyframes stamp2{from{transform:scale(.5);opacity:0}}
#game{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));border-radius:0 0 18px 18px}
.topbar h1{flex:1;margin:0;font-size:22px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-height:44px;border:2px solid #2c4058;background:transparent;color:#fff;border-radius:12px;padding:0 14px;font-weight:700;font-size:15px;white-space:nowrap}
.ib:active{background:#16293d}.ib:disabled{opacity:.35}
.players{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:10px;padding:4px max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
.pl{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:7px 14px;position:relative;box-shadow:0 4px 0 var(--line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"m n s" "m b s" "c c c";gap:0 10px;align-items:center;transition:transform .2s}
.pl.on{transform:translateY(-2px);border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.pl.on::after{content:"Din tur";position:absolute;top:-12px;right:12px;background:var(--c);color:var(--on,#fff);border:2px solid var(--k);font-size:12px;font-weight:700;padding:0 10px;border-radius:999px}
.pl .meep{grid-area:m;width:36px}
.pl.on .meep{animation:hop 1.4s ease-in-out infinite}
.pname{grid-area:n;font-weight:700;font-size:16px;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{grid-area:s;font-size:30px;font-weight:800;line-height:1;text-align:right}
.score span{display:block;font-size:11px;font-weight:600;color:var(--soft);margin-top:2px;white-space:nowrap}
.bar{grid-area:b;display:flex;height:10px;border-radius:99px;background:var(--tint);border:2px solid var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--c);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.bar u{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--c) 0 4px,transparent 4px 8px);animation:pulse 1s ease-in-out infinite alternate}
.chests{grid-area:c;font-size:12px;color:var(--soft);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.chests svg{width:20px;height:16px}
.plus{position:absolute;left:40%;top:-6px;z-index:3;font-size:36px;font-weight:800;color:var(--c);-webkit-text-stroke:2px var(--k);paint-order:stroke;animation:up 1.2s ease-out forwards;pointer-events:none}

.board{margin:0 max(12px,env(safe-area-inset-right)) 5px max(12px,env(safe-area-inset-left));background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);padding:12px;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;min-height:0}
.board.noart{grid-template-rows:auto;grid-template-columns:minmax(0,600px);justify-content:center;align-content:center}
.board.noart .sw{display:none}
/* Scenen tegnes i telefonmål og forstørres, så den fylder hele feltet: --z, --lw og --lh sættes af fit() */
.sw{position:relative;min-height:200px}
.scene{position:absolute;left:0;top:0;width:calc(var(--lw,380)*1px);height:calc(var(--lh,340)*1px);scale:var(--z,1);transform-origin:0 0;container-type:inline-size}
.big small{max-width:170px;margin-left:auto;line-height:1.2}
@container (max-width:430px){.palm{width:115px}}
@container (max-width:340px){.big small{display:none}}
.dock{display:flex;flex-direction:column;gap:10px;min-height:0}
.dhead{display:flex;align-items:center;gap:4px 14px}
.dhead h2{margin:0;font-size:24px;line-height:1.1;font-weight:800;white-space:nowrap}.dhead h2 b{color:var(--c)}
.msg{flex:1;font-weight:600;font-size:15px;line-height:1.3;color:var(--soft);min-height:2.6em;display:flex;align-items:center}
.msg.bust{color:var(--red)}.msg.good{color:#13a35c}
.turnview{display:flex;align-items:center;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;background:var(--tint);border:3px solid var(--line);border-radius:16px;padding:7px 14px}
.turnview .turn-label{font-size:12px;font-weight:700;color:var(--soft);line-height:1.2}
.turnview .turn-value{font-size:20px;font-weight:800;line-height:1.15;color:var(--c)}.turnview .turn-detail{font-size:13px;font-weight:600;color:var(--soft)}
.pirate-score{background:var(--tint);border:2px solid var(--line);border-radius:12px;padding:7px 14px;font-size:14px}.pirate-score .bar{margin-top:5px}
.pad{display:grid;gap:8px}
.pad p{margin:0;font-weight:600;font-size:15px}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.keys.cards{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.key{position:relative;min-height:76px;border:3px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:20px;display:grid;place-items:center;padding:6px}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key svg{width:54px;height:54px}
.keys.cards .key{min-height:60px}
.key.sm{font-size:15px;padding:4px 2px}
/* Farlige knapper får også et kryds, så det ikke kun er farven, der advarer */
.key.bad::after{content:"✕";position:absolute;top:-9px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--k);font:800 12px/20px system-ui,sans-serif;text-align:center}
.acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{min-height:48px;border-radius:14px;border:3px solid var(--line);padding:8px 18px;font-weight:700;background:var(--paper);box-shadow:0 4px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.main{background:var(--c);color:var(--on,#fff)}
.btn:disabled{opacity:.4;cursor:default}
.btn.guess{flex:1;min-width:130px;font-size:18px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.btn.guess small{font-weight:500;font-size:13px;opacity:.9}
.ma{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.ma.solo{grid-template-columns:minmax(0,1fr)}
#stop{min-height:64px;font-size:19px;font-weight:800;line-height:1.15}
.risk{display:flex;align-items:center;gap:8px;min-width:190px}
.risk svg{width:92px;height:54px;flex:none}
.risk b{display:block;font-size:24px;line-height:1}
.risk small{display:block;color:var(--soft);font-size:12px;line-height:1.2}
.needle{transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-origin:60px 60px}

/* Liggende iPad: scenen til venstre, tur og knapper i en fast kolonne til højre */
@media (orientation:landscape) and (min-width:900px){
 .board{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) clamp(330px,31vw,400px);gap:16px}
 .board.noart{grid-template-columns:minmax(0,600px)}
 .dhead{flex-wrap:wrap}.dhead h2{font-size:26px}
 .msg{flex:1 1 100%;min-height:3.9em;align-items:flex-start}
 .pad{margin-top:auto}
 .keys:not(.cards){grid-template-columns:repeat(3,minmax(0,1fr))}
 .keys:not(.cards) .key{min-height:84px}.keys:not(.cards) .key svg{width:60px;height:60px}
 .keys.cards{grid-template-columns:repeat(5,minmax(0,1fr))}.keys.cards .key{min-height:56px}
 .ma{grid-template-columns:minmax(0,1fr);gap:10px}.risk{min-width:0}
}
/* Telefon og meget lave vinduer: siden må rulle, så intet bliver klemt */
@media (max-width:600px),(max-height:560px){
 body{overflow:auto}#game{height:auto;min-height:100dvh}.sw{min-height:270px}
 .players{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}.pl{padding:6px 10px}.pl .meep{display:none}.score{font-size:24px}
 .ib{padding:0 10px;font-size:14px}.topbar h1{font-size:18px}
 .key{min-height:56px}.key svg{width:38px;height:38px}.key.bad::after{width:18px;height:18px;top:-7px;right:-5px;font-size:9px;line-height:14px}.keys.cards{grid-template-columns:repeat(5,minmax(0,1fr))}.key.sm{font-size:12.5px}
 .ma{grid-template-columns:minmax(0,1fr)}.dhead{flex-wrap:wrap}.msg{flex:1 1 100%}
}

/* ---------- Monsterhulen og Dykkerklokken ---------- */
.dart{position:absolute;inset:0;width:100%;height:100%}
.dungeon{background:#120c0a}.deep{background:#041523}
.tglow{animation:tgl 1.1s ease-in-out infinite alternate}
.fog{animation:fog 14s ease-in-out infinite alternate}@keyframes fog{from{transform:translateX(-26px)}to{transform:translateX(26px)}}

.btn.oops{min-height:52px;font-size:17px;font-weight:800;background:light-dark(#fff4d6,#3a2c08);border-color:#c98a12;box-shadow:0 4px 0 #c98a12;color:light-dark(#5a3a00,#ffd36a);animation:pop .35s ease-out}
.btn.guess svg.die{width:44px;height:44px}

/* ---------- forside ---------- */
#home{height:100dvh;overflow:auto;display:grid;align-content:safe center;justify-items:center;gap:18px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.hero{width:100%;max-width:1180px;background:var(--navy);color:#fff;border-radius:26px;padding:20px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 28px}

.rtoast.show{animation:rtoast 3.5s cubic-bezier(.3,1.4,.5,1) both}.rtoast svg{width:36px;height:36px}.rtoast b{font-weight:800}

.dmg.puff{color:#dff2ff;-webkit-text-stroke:2px #2c4a66}
.hero{background:radial-gradient(ellipse at 88% 0,#1f3f63,transparent 62%),linear-gradient(135deg,#0d2238,#081624)}

.guess-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn.guess.direction{min-width:0;min-height:86px;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;text-align:left;gap:12px;padding:10px 14px;border:2px solid #17382c;border-radius:14px;box-shadow:0 4px 0 #17382c;font-size:15px}.btn.guess.direction.gh{background:#218653;color:#fff}.btn.guess.direction.gl{background:#f5bf38;color:#302514;border-color:#805800;box-shadow:0 4px 0 #805800}.direction-arrow{flex:none;width:54px;height:54px;display:grid;place-items:center;border:3px solid currentColor;border-radius:14px;font-family:system-ui,sans-serif;font-size:43px;font-weight:900;line-height:1;background:#ffffff26}.direction-copy{display:flex;flex-direction:column;align-items:flex-start;gap:2px}.direction-copy strong{font-size:clamp(18px,2.1vw,24px);line-height:1.05}.direction-copy small{font-size:12px;font-weight:700;opacity:1}.direction-copy .guess-odds{font-size:11px;font-weight:600;opacity:.9}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}

/* ---------- Måneraketten ---------- */
/* En tur er en rumrejse gennem seks stationer. Ved hver station vender man et kort (hvad venter der?) og slår én terning:
   lavt slag = motoren eksploderer (flere tal jo længere ude), ellers får man stationens skat. Flyv hjem når som helst. */
const ST=[{n:'Satellitten',x:120,y:252,m:1,d:1},{n:'Månen',x:166,y:190,m:1,d:1},{n:'Mars',x:236,y:236,m:2,d:2},{n:'Asteroidebæltet',x:278,y:166,m:2,d:2},{n:'Saturn',x:340,y:228,m:3,d:3},{n:'Det sorte hul',x:350,y:122,m:3,d:3}];

const rkKind=v=>v===1?'worm':v>10?'alien':'mine';
const rkPos=st=>st?ST[st-1]:EARTH;
const rkGain=(v,d,m)=>{const k=rkKind(v);return k==='mine'?v*m:k==='alien'?(d>=RNEED[v]?10*m:0):5*m};
const dzTxt=d=>d>1?`1–${d}`:'1';
function rkCard(v){
  const t=S.turn;if(t.card!==null&&t.card!==undefined)return;
  if(S.deck<=0){S.used=Array(14).fill(0);S.deck=52}
  t.from=t.st;t.st=Math.min(6,t.st+(v===1?2:1));t.card=v;t.last=null;const s=ST[t.st-1],k=rkKind(v);
  tone(180,.5,'sawtooth',.05,0,520);noise(.5,.18,0,1200);
  say(k==='mine'?`${s.n}: en krystalmine med ${v} krystaller${s.m>1?` (×${s.m} = ${v*s.m})`:''}. Slå terningen: motoren eksploderer på ${dzTxt(s.d)}.`
    :k==='alien'?`${s.n}: ${RANAME[v]} vogter ${10*s.m} krystaller. Slå mindst ${RNEED[v]} for at snuppe dem. Motoren eksploderer på ${dzTxt(s.d)}.`
    :`Ormehul! Raketten skyder frem til ${s.n} og finder ${5*s.m} krystaller. Slå terningen: motoren eksploderer på ${dzTxt(s.d)}.`);
}

const ghostCastle=i=>`<g class="ghostc"><path d="M14 66V24h10v-8h7v8h8v-8h7v8h5V30h6v-8h7v8h6v-8h7v8h4v-8h7v8h7v-8h7v8h10v42q-6 6-12 0t-12 0-12 0-12 0-12 0-12 0-12 0-12 0z" fill="rgba(214,238,255,.42)" stroke="#e8f6ff" stroke-width="2" stroke-linejoin="round"/>

function scene(game,t,p,busting,v){
  if(game==='monster')return monScene(t,p,busting,v);
  if(game==='rocket')return rkScene(t,p,busting);
  const cls=busting?'busting shake':'';
  if(game==='tower'){
    const n=t.fl.length,W=i=>`calc(clamp(140px,26cqw,200px) - ${i*16}px)`;
    const top=t.fl[n-1]||0;
    const fl=t.fl.map((f,i)=>`<div class="stone ${i>=2?'bon':''}" style="width:${W(i)};--i:${n-i};--dx:${(rnd(i,1)-.5)*360}px;--r:${(rnd(i,2)-.5)*260}deg;animation-delay:${busting?'':(i===n-1?'0s':'-1s')}"><b>${f}</b></div>`).join('');
    const gh=busting?'':Array.from({length:6-n},(_,k)=>`<div class="stone ghost" style="width:${W(n+k)}">${TB(n+k+1)?`<em>+${TB(n+k+1)}</em>`:''}</div>`).join('');
    const apex=busting?'':`<svg class="apex ${n>=6?'done':''}" style="width:${W(5)}" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M50 3 97 39H3z" fill="#ffd34d"/><path d="M50 3 97 39H54z" fill="#dc9b1c"/><path d="M50 3 97 39H3z" fill="none" stroke="#081624" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
    const dust=busting?`<div class="dust">${[-90,-40,0,45,95].map((x,i)=>`<i style="--x:${x}px;animation-delay:${.25+i*.06}s"></i>`).join('')}</div>`:'';
    return `<div class="scene desert ${cls}">${desertBg('s')}
      <div class="castle ${!busting&&top>=3?'wob':''}" style="--w:${(top-2)*.5}deg;--ws:${1.5-top*.15}s">${n?fl+gh+apex:gh}</div>
      ${dust}
      ${!busting&&FX&&(FX.kind==='doubleSix'||FX.doubleSix)?`<div class="double-six" aria-label="To seksere! Kravet er nulstillet"><div class="six-card">${pips(6)}${pips(6)}<span>Dobbelt 6!<br><small>Kravet nulstilles</small></span></div>${Array.from({length:12},(_,i)=>`<i class="spark" style="--sx:${Math.cos(i*Math.PI/6)*140}px;--sy:${Math.sin(i*Math.PI/6)*95}px;animation-delay:${i*.025}s"></i>`).join('')}</div>`:''}
      ${busting?banner('BOM! Tårnet styrtede'):`<div class="big">${n}<small>${n?(towerTop(t)===6?'etager · kun en 6’er redder tårnet':towerTop(t)===0?'etager · kravet er nulstillet':`etager · næste skal over ${towerTop(t)}`):'etager i turen'}</small>${TB(n)?`<span class="bonus">+${TB(n)} bonus</span>`:''}</div>`}
      ${!n&&!busting&&!(t.dice&&t.dice.length)?'<div class="hint">Slå for at lægge grundstenen</div>':''}</div>`;
  }
  if(game==='pirate'){
    const c=t.sum,prev=busting?c:Math.min(seenCoins,c);if(!busting)seenCoins=c;let coins='',k=0;
    const base=Math.max(1,Math.ceil((Math.sqrt(8*c+1)-1)/2)),w=Math.min(24,250/base),cw=w+2,ch=cw*.54;
    for(let r=0;k<c;r++){const len=Math.max(1,base-r);for(let i=0;i<len&&k<c;i++,k++)coins+=`<div class="coin" style="width:${cw}px;height:${ch}px;margin-left:-${cw/2}px;left:${(i-(len-1)/2)*w}px;bottom:${r*w*.46}px;--i:${Math.min(k,80)};animation-delay:${busting?'':(k<prev?'-1s':`${Math.min(k-prev,12)*.05}s`)}"></div>`}
    const dl=PD(t),c3=!busting&&FX&&FX.chest3&&FX.p===p;
    return `<div class="scene sea ${busting?'':'d'+dl} ${cls}">${seaBg('s',busting?1:dl)}
      ${[0,1].map(k=>`<svg class="gull" style="top:${18+k*9}%;animation-delay:-${(Date.now()/1000+k*9)%22}s" viewBox="0 0 30 12" aria-hidden="true"><path d="M1 9Q8 1 15 8Q22 1 29 9" stroke="#081624" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`).join('')}
      <div class="island"><div class="sand"></div>${palm}<div class="coins">${coins}</div></div>
      <div class="waves" style="--wd:-${(Date.now()/1000)%8}s">${wave('rgba(42,128,172,.9)',8)}${wave('#0e4068',52)}</div>
      ${busting?shipSvg('ship')+banner('Piraterne kom!'):shipSvg('far',`--sw:min(${90+Math.min(t.rolls.length,8)*13}px,36%);--sr:${Math.max(2,10-t.rolls.length)}%`)+`<div class="danger d${dl}">Pirat på ${Array.from({length:dl},(_,k)=>pips(k+1)).join('')}</div>`}
      <div class="rolls">${t.rolls.map(r=>`<i class="${r===6?'six':''}">${r}</i>`).join('')}</div>
      ${busting?'':`<div class="big">${t.sum}<small>mønter i turen</small></div>`}
      ${busting?'':`<div class="kist">Kister ${[0,1,2].map(k=>miniChest(c3||k<S.chests[p],!c3&&t.rolls[t.rolls.length-1]===6&&k===S.chests[p]-1)).join('')}</div>`}
      ${c3?`<div class="c3">${chestOpen('c3')}${Array.from({length:14},(_,k)=>`<i style="--dx:${Math.cos(k/14*6.28)*(90+rnd(k,21)*60)}px;--dy:${Math.sin(k/14*6.28)*(60+rnd(k,22)*50)-40}px;--r:${(rnd(k,23)-.5)*500}deg;animation-delay:${.25+rnd(k,24)*.25}s"></i>`).join('')}</div>${banner('+10 mønter!').replace('class="banner"','class="banner gold"')}`:''}</div>`;
  }
  if(game==='hilo'){
    const pile=Math.min(t.pile,14),E='clamp(24px,7cqw,64px)';
    const backs=Array.from({length:pile},(_,i)=>`<div class="back" style="right:${E};bottom:${26+i*3}px;rotate:${(rnd(i,8)-.5)*12}deg;--dx:${(rnd(i,3)-.5)*400}px;--r:${(rnd(i,4)-.5)*400}deg;animation-delay:${i*.03}s"></div>`).join('');
    const deck=Array.from({length:Math.min(5,Math.ceil(S.deck/10))},(_,i)=>`<div class="back" style="left:${E};bottom:${26+i*3}px;--c:#d9a33a"></div>`).join('');
    const cur=t.cur===null?'':face(t.cur,busting?'':'flip','left:50%;bottom:30px;margin-left:calc(clamp(78px,14cqw,112px)/-2)'+(busting?';transform:translateX(-62%) rotate(-8deg)':''));
    const wrong=busting?face(v,'wrong','left:50%;bottom:38px;margin-left:calc(clamp(78px,14cqw,112px)/-2);transform:translateX(22%) rotate(9deg);z-index:4'):'';
    const arrow=t.guess&&!busting?`<svg class="arrow" style="left:calc(50% + clamp(46px,8cqw,66px));top:22%" viewBox="0 0 60 70" aria-hidden="true"><path d="${t.guess==='hi'?'M30 4 56 34H40v32H20V34H4z':'M30 66 56 36H40V4H20v32H4z'}" fill="${t.guess==='hi'?'#1fb36b':'#f2a900'}" stroke="#081624" stroke-width="4" stroke-linejoin="round"/></svg>`:'';
    return `<div class="scene table ${cls}">${tableBg('s')}<div class="feltlbl">HØJERE · LAVERE</div>${deck}<div class="lbl" style="left:calc(${E} + clamp(39px,7cqw,56px));bottom:0">${S.deck} tilbage</div>
      ${cur}${wrong}${arrow}<div class="pile">${backs}</div><div class="lbl" style="right:${E};transform:none;bottom:0">Din bunke: ${t.pile}</div>
      ${t.cur===null&&!busting?'<div class="hint">Vend et startkort og tryk på det herunder</div>':''}
      ${t.pile>=2&&!busting?`<div class="streak">${t.pile} rigtige i træk!${HB(t.pile)?` +${HB(t.pile)} bonus`:''}${HB(t.pile+1)>HB(t.pile)?` · næste: +${HB(t.pile+1)}`:''}</div>`:''}
      ${busting?banner('Forkert gæt!'):''}</div>`;
  }
  const n=t.row.length,step=Math.min(14,110/Math.max(n,1)),bo=CB(n),nb=CB(n+1);
  const fan=t.row.map((c,i)=>face(c,'',`rotate:${(i-(n-1)/2)*step}deg;--dx:${(rnd(i,5)-.5)*500}px;--r:${(rnd(i,6)-.5)*500}deg;animation-delay:${busting?'0s':(i===n-1?'0s':'-1s')};${busting&&i===n-1?'box-shadow:0 0 0 6px var(--red)':i>=4?'box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 12px 3px #ffd34d':''}`)).join('');
  const sp=[[12,20],[85,30],[25,60],[70,14],[92,62],[6,48]].map(([x,y],i)=>`<i class="sparkle" style="left:${x}%;top:${y}%;animation-delay:${i*.3}s"></i>`).join('');
  const loot=`<div class="loot">${[[8,0],[12,5],[10,10],[84,2],[88,8]].map(([x,b])=>`<i style="left:${x}%;margin-bottom:${b}px"></i>`).join('')}</div>`;
  const rk=busting?0:risk(),rl=rk>=60?'r3':rk>=35?'r2':rk>=15?'r1':'';
  return `<div class="scene cave ${rl} ${cls}">${vaultBg('s')}<div class="glow"></div>${sp}${loot}${busting?'':`<svg class="chestbox lid" viewBox="0 0 200 150" aria-hidden="true"><path d="M18 150 V40 Q100 -20 182 40 V150Z" fill="url(#sWood)" stroke="#1a0f08" stroke-width="3" stroke-linejoin="round"/><path d="M32 150 V48 Q100 0 168 48 V150Z" fill="#2a160b"/><rect x="92" y="14" width="16" height="136" fill="url(#sSteel)" stroke="#1a0f08" stroke-width="2.4"/></svg>`}<div class="fan">${fan}</div>${chestSvg(busting)}

  const ct=showArt?null:compactTurn();
  dock.innerHTML=`<div class="dhead"><h2 style="${cv(shownP)}"><b>${nm(shownP)}</b>s tur</h2>${S.final&&S.win===null?'<span class="last">Sidste runde</span>':''}<span class="msg ${S.mt}" role="status">${S.msg||'Slå eller vend et kort for at starte.'}</span></div>
    ${ct?`<div class="turnview"><div><div class="turn-label">${ct.label}</div><div class="turn-value">${ct.value}</div></div><span class="turn-detail">${ct.detail}</span></div>`:''}
    ${S.game==='pirate'?`<div class="pirate-score" role="status"><b>Piraternes skat: ${S.pirateScore||0} af ${pirateGoal()} mønter</b><span> · ${['Tomt skib','Skat om bord','Gyldne sejl','Piratkongens skib'][pirateLevel()]}</span><div class="bar"><i style="width:${Math.min(100,(S.pirateScore||0)/pirateGoal()*100)}%;background:#ff5240"></i></div></div>`:''}
    ${S.oops&&hist.length&&S.win===null?`<button class="btn oops" id="oops">↶ ${GAMES[S.game].kind==='cards'?'Forkert kort? Gå et skridt tilbage':'Forkert tryk? Gå et skridt tilbage'}</button>`:''}
    <div class="pad">${pad()}</div>
    ${bt?'':`<div class="ma ${guessing?'solo':''}">${guessing?'':riskMeter()}<button class="btn main" id="stop" ${canStop?'':'disabled'}>${S.game==='monster'?`Gå hjem med ${pts} guld`:S.game==='rocket'?`Flyv hjem med ${pts} krystaller`:`Stop og gem ${pts} ${un(pts)}${curBonus()?' med bonus':''}`}</button></div>`}`;
  rules.innerHTML=`<h3>Regler: ${g.name}</h3><ul>${g.rules.map(r=>`<li>${r}</li>`).join('')}</ul>
   ${g.kind==='dice'?`<label class="set">Spil til <input type="number" min="5" max="200" value="${tg}" id="tgt"> ${g.unit}</label>`:''}`;
  logEl.innerHTML=S.log.length?S.log.map(l=>`<li>${l}</li>`).join(''):'<li>Ingen træk endnu.</li>';
  undo.disabled=$('wundo').disabled=!hist.length;
  if(S.win!==null){
    eveUpsert(S.rid,g.name,rankNow());
    if(shownWin===null){shownWin=S.win;S.win<-1?sfx.bad():sfx.win();
      win.style.setProperty('--c',S.win<0?'var(--ink)':COL[S.win]);win.style.setProperty('--on',S.win<0?'var(--paper)':ON[S.win]);
      const trophy=`<svg class="trophy" viewBox="0 0 100 100" aria-hidden="true"><path d="M28 10h44v26a22 22 0 0 1-44 0z" fill="#ffc23a" stroke="#081624" stroke-width="5" stroke-linejoin="round"/><path d="M28 18H12q0 20 18 22M72 18h16q0 20-18 22" fill="none" stroke="#081624" stroke-width="5"/><path d="M44 58h12v14H44z" fill="#e19a00" stroke="#081624" stroke-width="5"/><rect x="30" y="72" width="40" height="16" rx="4" fill="${S.win<0?'#888':HEX[S.win]}" stroke="#081624" stroke-width="5"/></svg>`;
      wtxt.innerHTML=trophy+(S.win===-2?`<h2>Piraterne vinder!</h2><p>Piraterne stjal ${S.pirateScore} mønter og nåede målet på ${pirateGoal()}.</p><p>${S.scores.map((v,i)=>`${nm(i)} ${v}`).join(' · ')} mønter</p>`:S.win<0?`<h2>Uafgjort!</h2><p>${S.scores.map((v,i)=>`${nm(i)} ${v}`).join(' · ')} ${g.unit}</p>`:`<p style="margin:0;font-weight:600">${g.name}</p><h2>${nm(S.win)} vinder!</h2>${g.kind==='battle'?`<p>${nm(S.win)}s borg står tilbage med ${S.scores[S.win]} liv.</p>`:''}<p>${S.scores.map((v,i)=>`${nm(i)} ${v}`).join(' · ')} ${g.unit}</p>`);
      wtxt.innerHTML+=eveWin();win.classList.add('show');confetti(S.win<0?['#ffc23a','#ff5240','#3d8bff']:[HEX[S.win],'#ffc23a','#ffffff']);
    }
  }else{shownWin=null;win.classList.remove('show')}
  save();
}
function confetti(cols){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const ctx=conf.getContext('2d'),W=conf.width=innerWidth,H=conf.height=innerHeight;
  const P=Array.from({length:170},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,s:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],w:Math.random()*.2}));
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.w;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(t-t0<4500&&win.classList.contains('show'))requestAnimationFrame(f);else ctx.clearRect(0,0,W,H)})(t0);
}
function go(v){view=v;try{localStorage.setItem('lda-view',v);if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}render()}
/* Hvert spil gemmes for sig, så man kan skifte spil uden at miste det, der er i gang */
function openGame(g){
  if(g!==S.game||S.win!==null){const o=g!==S.game&&started(SAVES[g])?SAVES[g]:fresh(g,S.names,S.targets,S.n);o.names=S.names;o.targets=S.targets;S=o;if(!S.rid)S.rid=newRid();if(!S.out)S.out=[];hist=[];FX=null;clearTimeout(fxT)}
  go('game');
}
$('seg').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b||+b.dataset.n===S.n)return;S=fresh(S.game,S.names,S.targets,+b.dataset.n);SAVES={};hist=[];FX=null;render()});
$('eve').addEventListener('click',e=>{if(!e.target.closest('#evnew'))return;clearTimeout(eveT);if(eveConfirm){eveSave({log:[],last:0});eveConfirm=false}else{eveConfirm=true;eveT=setTimeout(()=>{eveConfirm=false;if(view==='home')renderHome()},4000)}renderHome()});
$('tiles').addEventListener('click',e=>{const b=e.target.closest('[data-game]');if(b){sfx.tap();openGame(b.dataset.game)}});
$('names').addEventListener('input',e=>{const i=e.target.dataset.name;if(i!==undefined){S.names[+i]=e.target.value;save()}});
$('names').addEventListener('focusin',e=>{if(e.target.dataset.name!==undefined)e.target.select()});
$('names').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.name!==undefined){e.preventDefault();const n=$('names').querySelector(`[data-name="${+e.target.dataset.name+1}"]`);n?(n.focus(),n.select()):e.target.blur()}});
$('tohome').addEventListener('click',()=>go('home'));
$('menu').addEventListener('click',()=>sheet.classList.add('show'));
$('sclose').addEventListener('click',()=>sheet.classList.remove('show'));
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.classList.remove('show')});
board.addEventListener('click',e=>{
  if(e.target.closest('#oops')){doUndo();return}
  if(S.win!==null||(FX&&(FX.kind==='bust'||FX.kind==='shot')))return;
  const sh=e.target.closest('[data-shoot]');if(sh){shoot(+sh.dataset.shoot);return}
  if(e.target.closest('[data-build]')){build();return}
  const dv=e.target.closest('[data-div]');if(dv){divMove(+dv.dataset.div);return}
  const tb=e.target.closest('[data-tb]');if(tb){snap();towerPlace(+tb.dataset.tb);render();return}
  const d=e.target.closest('[data-die]'),c=e.target.closest('[data-card]'),g=e.target.closest('[data-g]');
  if(d)die(+d.dataset.die);
  else if(c)card(+c.dataset.card);
  else if(g){snap();sfx.tap();S.turn.guess=g.dataset.g;say(`Du gætter ${g.dataset.g==='hi'?'højere':'lavere'}. Vend kortet!`);render()}
  else if(e.target.closest('#stop'))stop();
});
rules.addEventListener('change',e=>{if(e.target.id==='tgt'){snap();S.targets[S.game]=Math.max(5,Math.min(200,+e.target.value||15));const was=S.final;S.final=S.scores.some(v=>v>=target());if(S.game==='pirate'&&(S.pirateScore||0)>=pirateGoal())S.win=-2;if(S.final&&!was)log(`Målet er nået med det nye mål. Runden spilles færdig.`);render()}});
const doUndo=()=>{if(!hist.length)return;FX=null;clearTimeout(fxT);const o=JSON.parse(hist.pop());S=o.S;REC=o.R||REC;saveRec();if(S.win===null)eveRemove(S.rid);render()};
undo.addEventListener('click',doUndo);$('wundo').addEventListener('click',doUndo);
$('reset').addEventListener('click',()=>{snap();FX=null;S=fresh(S.game,S.names,S.targets,S.n);say('Nyt spil. Held og lykke!');sheet.classList.remove('show');render()});
$('wmenu').addEventListener('click',()=>{snap();FX=null;S=fresh(S.game,S.names,S.targets,S.n);win.classList.remove('show');go('home')});
$('again').addEventListener('click',()=>{snap();FX=null;const w=S.win;S=fresh(S.game,S.names,S.targets,S.n);if(w>=0)S.p=S.start=nx(w);say(`${nm(S.p)} starter.`);render()});
render();
}
</script>
