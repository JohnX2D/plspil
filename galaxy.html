<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101214">
<title>Galaxy Raceway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#101214;--panel:rgba(22,25,29,.95);--line:#30353d;--ink:#f2f3f5;--soft:#a0a8b4;--gold:#f5b829;--bad:#e5484d;--good:#30a46c;--pw:#8b5cf6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,#1c1f24,#0b0c0e 75%);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.disp{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.02em}
#app{position:fixed;inset:0;display:grid;grid-template:"top top" auto "pl board" minmax(0,1fr) "pl pad" auto / minmax(190px,240px) minmax(0,1fr);gap:10px;
 padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#top{grid-area:top;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-size:clamp(22px,3vw,30px);line-height:1;margin-right:auto;white-space:nowrap}
.logo span,.title span{color:var(--gold)}
.pill{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 14px;min-height:42px;font-weight:700;font-size:14px;text-decoration:none;color:#fff;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed=true]{background:#fff;color:#121417;border-color:#fff}
.pill:disabled{opacity:.4}
#pl{grid-area:pl;display:flex;flex-direction:column;gap:10px;overflow:auto;align-self:start;max-height:100%;padding-top:8px}
.pc{background:var(--panel);border:2px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 8px;align-items:center;position:relative}
.pc.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 0 18px color-mix(in srgb,var(--c) 55%,transparent)}
.pc.on::after{content:"Din tur";position:absolute;top:-10px;right:10px;background:var(--c);color:#fff;font-size:12px;font-weight:700;padding:0 8px;border-radius:6px}
.pc img{width:44px;height:44px;grid-row:span 2}
.pc b{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc small{color:var(--soft);font-weight:600;font-size:12px;grid-column:2/-1}
.plc{font:800 italic 22px/1 "Barlow Condensed",sans-serif;color:var(--soft)}
.plc.p1{color:var(--gold)}
.pbar{grid-column:1/-1;height:6px;border-radius:6px;background:#0b0c0e;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--c);transition:width .5s}
.mods{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mods:empty{display:none}
.mod{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:#0b0c0e;border:1px solid var(--good)}
.mod.b{border-color:var(--bad)}.mod.p{border-color:var(--pw);background:#21163a}
#bw{grid-area:board;position:relative;min-height:0;min-width:0}
#bw svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#cars{pointer-events:none;overflow:visible}
#pad{grid-area:pad;justify-self:center;width:min(100%,640px);background:var(--panel);border:2px solid var(--line);border-top:4px solid var(--c,var(--line));border-radius:16px;padding:8px 12px 12px;display:grid;gap:6px}
#pad[hidden],#pl[hidden]{display:none}
#last{font-size:13px;font-weight:600;color:var(--soft);text-align:center;min-height:18px}
#msg{font-size:clamp(16px,2.4vw,20px);font-weight:700;text-align:center;line-height:1.2}
#msg b{color:var(--c);filter:brightness(1.3)}
#hint{font-size:13px;font-weight:700;text-align:center;color:var(--gold);min-height:18px}
#hint:empty{display:none}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.keys[hidden],#acts:empty{display:none}
.key{border:0;background:transparent;padding:0;border-radius:12px;transition:transform .1s}
.key svg{display:block;width:100%;height:auto;max-height:68px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.55))}
.key:active{transform:translateY(3px) scale(.96)}
.key:disabled{opacity:.35}
#acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{border:0;border-radius:12px;padding:8px 10px;min-height:64px;font-weight:800;font-size:19px;color:#fff;text-align:center;display:grid;gap:1px;place-content:center;line-height:1.1}
.act small{font-weight:600;font-size:12.5px;opacity:.92;line-height:1.25}
.act:active{transform:translateY(3px)}
.act.go{background:linear-gradient(#2f9a62,#1f7448);box-shadow:0 4px 0 #13502f}
.act.gv{background:linear-gradient(#c9461e,#8e2a10);box-shadow:0 4px 0 #5a1a08}
.act.om{background:linear-gradient(#2f6fd0,#1d4a96);box-shadow:0 4px 0 #11305f}
.act.pw{grid-column:1/-1;background:linear-gradient(#7a3cc8,#4f2391);box-shadow:0 4px 0 #2e1459;min-height:50px}
.act.one{grid-column:1/-1}
#bcatch{position:fixed;inset:0;z-index:5;display:none;background:rgba(5,6,8,.35)}#bcatch.show{display:block}
#banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:6;text-align:center;display:none;width:min(92vw,540px);background:rgba(14,16,19,.95);border:2px solid var(--line);border-top:6px solid var(--good);border-radius:16px;padding:14px 18px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
#banner.b{border-top-color:var(--bad)}#banner.p{border-top-color:var(--pw)}
#banner.show{display:block;animation:pop .3s cubic-bezier(.3,1.5,.5,1) both}
#banner.big .bt{font-size:clamp(40px,8vw,64px)}
#banner .bi{font-size:clamp(40px,7vw,60px);line-height:1}
#banner .bt{font-size:clamp(28px,5vw,42px);line-height:1.05;margin-top:4px}
#banner.g .bt{color:var(--gold)}#banner.b .bt{color:#ff7a70}#banner.p .bt{color:#c4a8ff}
#banner .bd{margin-top:6px;font-weight:600;font-size:clamp(15px,2.3vw,18px);color:#dfe3e8}
#banner .bok{margin-top:12px;border:0;border-radius:12px;background:#fff;color:#121417;font-weight:800;font-size:20px;min-width:140px;min-height:52px;box-shadow:0 4px 0 #8a9099}
#banner .bok:active{transform:translateY(3px);box-shadow:0 1px 0 #8a9099}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:#fff;opacity:0}
.ov{position:fixed;inset:0;z-index:10;background:rgba(8,9,11,.72);backdrop-filter:blur(4px);display:none;overflow:auto;padding:16px}
.ov.show{display:grid;place-items:center}
.box{background:#16191e;border:2px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px);width:min(100%,760px);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.title{font-size:clamp(36px,8vw,64px);line-height:.95;text-align:center;margin:0 0 6px}
.sub{text-align:center;color:var(--soft);font-weight:600;margin:0 0 16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-width:52px;min-height:44px;border:0;background:#0d0f12;font-weight:700;font-size:18px}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed=true]{background:#fff;color:#121417}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:#0d0f12;border:2px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:8px 10px;margin:8px 0}
.srow input{font:700 18px Barlow,sans-serif;color:#fff;background:transparent;border:0;border-bottom:2px solid var(--line);padding:6px 4px;width:100%}
.srow input:focus{border-bottom-color:var(--c);outline:none}
.pick{display:flex;gap:6px}
.pick button{width:58px;height:58px;border-radius:10px;border:2px solid var(--line);background:#1d2026;padding:2px}
.pick button img{width:100%;height:100%;display:block}
.pick button[aria-pressed=true]{border-color:#fff;background:color-mix(in srgb,var(--k) 35%,#1d2026)}
.cta{border:0;border-radius:12px;background:var(--gold);color:#121417;font-weight:800;font-size:19px;padding:12px 26px;min-height:54px;box-shadow:0 4px 0 #9c720f}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 #9c720f}
.btn2{border:2px solid var(--line);border-radius:12px;background:#0d0f12;font-weight:700;font-size:16px;padding:10px 18px;min-height:54px;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.rules h3{margin:14px 0 6px;font-size:16px;color:var(--gold)}
.rules ul{margin:0;padding-left:20px}.rules li{margin:3px 0}
.rules .ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px;list-style:none;padding:0}
.rules .ev li{background:#0d0f12;border-left:5px solid var(--good);border-radius:8px;padding:6px 10px}
.rules .ev li.b{border-color:var(--bad)}.rules .ev li.p{border-color:var(--pw)}.rules .ev li.n{border-color:#8a929b}
#log{list-style:none;padding:0;margin:0;color:var(--soft);font-size:14px}
.stand{list-style:none;padding:0;margin:14px auto 0;max-width:340px}
.stand li{display:flex;align-items:center;gap:10px;font-weight:700;padding:4px 0}
.stand img{width:44px;height:44px}
.conf{position:fixed;top:-40px;z-index:11;font-size:26px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.ver{position:fixed;right:10px;bottom:2px;font-size:11px;color:var(--soft);opacity:.7;pointer-events:none}
#meas{position:absolute;width:0;height:0;overflow:hidden}
.flm{animation:flm .12s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 50%}
@keyframes flm{to{transform:scaleX(.65)}}
.smk circle{animation:smk 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.smk circle:nth-child(2){animation-delay:.45s}.smk circle:nth-child(3){animation-delay:.9s}
@keyframes smk{from{transform:translate(0,0) scale(.5);opacity:.85}to{transform:translate(-26px,-10px) scale(2.2);opacity:0}}
.shl{animation:shl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes shl{50%{opacity:.45;transform:scale(1.06)}}
.hla{animation:hla .9s ease-in-out infinite alternate}
@keyframes hla{to{opacity:.35}}
@media (max-width:760px),(orientation:portrait){
 #app{grid-template:"top" auto "pl" auto "board" minmax(0,1fr) "pad" auto / minmax(0,1fr)}
 #pl{flex-direction:row;max-width:100%;padding-top:10px}
 .pc{flex:1 0 118px;grid-template-columns:28px minmax(0,1fr) auto;padding:5px 8px;gap:0 6px}.pc img{width:28px;height:28px}.pc b{font-size:14px}.pc small{font-size:11px;white-space:nowrap}.pc .ar{display:none}.plc{font-size:18px}.pbar{margin-top:2px}
 .pill{padding:4px 10px;font-size:13px;min-height:38px}
 .act{min-height:58px;font-size:17px}
}
@media (max-height:560px){.key svg{max-height:48px}#pad{padding:6px 10px 8px;gap:4px}#last{display:none}.act{min-height:50px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<svg id="meas" aria-hidden="true"></svg>
<div id="app">
  <div id="top">
    <div class="logo disp">Galaxy <span>Raceway</span></div>
    <a class="pill" href="index.html">← LDA Spil</a>
    <button class="pill" id="bSnd" aria-pressed="true">Lyd</button>
    <button class="pill" id="bRules">Regler</button>
    <button class="pill" id="bUndo">Fortryd</button>
    <button class="pill" id="bNew">Nyt løb</button>
  </div>
  <div id="pl"></div>
  <div id="bw"><svg id="bstatic" role="img" aria-label="Spillebrættet set oppefra"></svg><svg id="cars" aria-hidden="true"></svg></div>
  <div id="pad"><div id="last"></div><div id="msg"></div><div id="hint"></div><div class="keys" id="keys"></div><div id="acts"></div></div>
</div>
<div id="flash"></div>
<div id="bcatch"></div>
<div id="banner" role="alertdialog" aria-live="assertive"><div class="bi"></div><div class="bt disp"></div><div class="bd"></div><button class="bok" id="bok">OK</button></div>
<div class="ov" id="setup"><div class="box">
  <h1 class="title disp">Galaxy <span>Raceway</span></h1>
  <p class="sub">Én omgang rundt om banen. Slå med en rigtig terning, og tast slaget ind. Pas på vulkaner, meteorer og kløfter!</p>
  <div class="row"><b>Antal spillere</b><div class="seg" id="seg"><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button></div></div>
  <div id="srows"></div>
  <div class="acts"><a class="btn2" href="index.html">← LDA Spil</a><button class="cta" id="go">Start løbet!</button></div>
</div></div>
<div class="ov" id="rules"><div class="box rules">
  <h2 class="disp" style="margin:0;font-size:30px">Regler</h2>
  <div id="rtxt"></div>
  <h3>Seneste træk</h3><ul id="log"></ul>
  <div class="acts"><button class="cta" id="rclose">Luk</button></div>
</div></div>
<div class="ov" id="win"><div class="box" style="text-align:center">
  <div style="font-size:64px;line-height:1">🏆</div>
  <h2 class="title disp" id="wtxt"></h2>
  <ul class="stand" id="stand"></ul>
  <div class="acts"><button class="btn2" id="wundo">Fortryd</button><button class="btn2" id="wsetup">Skift biler</button><button class="cta" id="again">Nyt løb</button></div>
</div></div>
<div class="ver">Galaxy Raceway · version 7.0</div>
<script>
{
/* ================= data ================= */
const KEY='lda-galaxy',VER=7;
const CARS=[{n:'Hajen',def:'Rød',col:'#d0312d',c2:'#f4f4f4',num:7},{n:'Svæveren',def:'Blå',col:'#1d5fd0',c2:'#8fd0ff',num:21},{n:'Jungletrucken',def:'Grøn',col:'#2e7a3c',c2:'#e8c34a',num:4},{n:'Diskobilen',def:'Disko',col:'#7a3cc8',c2:'#f5b829',num:99}];
/* Feltkoder: S start, G mål, . asfalt, b power-kasse, > fartbånd, J hopperampe, L toppen af loopet, a luft over kløften,
   s sand, m mudder, i is, z tordensky, f brændende bro, h sort hul */
const PATHS=[
 {id:'p0',nm:'Neonbyen',spec:'S..b..>....LLL..>..bss',to:['pa1','pa2'],up:[11.6,18.5],
  pts:[[300,880],[470,882],[620,878],[740,862],[835,812],[870,735],[835,668],[765,652],[712,698],[712,780],[770,858],[880,888],[990,890],[1075,888]]},
 {id:'pa1',nm:'Kløftspringet',alt:'Genvej',tip:'Kort, men stop ikke over kløften',spec:'s.>aa..s',to:['p1'],gap:[3,5],
  pts:[[1105,852],[1200,800],[1300,725],[1400,640],[1470,565]]},
 {id:'pa2',nm:'Karavanevejen',alt:'Omvej',tip:'Længere, men med power-kasser',spec:'.b..ss.J...b',to:['p1'],
  pts:[[1105,925],[1260,932],[1405,918],[1500,862],[1545,760],[1548,650],[1540,565]]},
 {id:'p1',nm:'Lavaland',spec:'.z',to:['pb1','pb2'],pts:[[1505,525],[1505,465],[1505,400]]},
 {id:'pb1',nm:'Vulkanbroen',alt:'Genvej',tip:'Kort, men broen brænder',spec:'fff..',to:['p2'],up:[0,5],
  pts:[[1470,365],[1430,285],[1360,215],[1255,160]]},
 {id:'pb2',nm:'Askestien',alt:'Omvej',tip:'Længere, med fartbånd og kasser',spec:'.b.>...b',to:['p2'],
  pts:[[1540,365],[1545,260],[1525,165],[1460,105],[1340,88],[1255,92]]},
 {id:'p2',nm:'Isbjerget',spec:'ii.J...b.z',to:['pc1','pc2'],pts:[[1220,125],[1100,112],[990,150],[880,185],[770,150],[640,125]]},
 {id:'pc1',nm:'Mudderstien',alt:'Genvej',tip:'Kort, men mudderet er tungt',spec:'mm.mm.m..',to:['p3'],
  pts:[[605,160],[500,240],[380,340],[260,450],[190,520]]},
 {id:'pc2',nm:'Glastunnelen',alt:'Omvej',tip:'Længere, under søen med kasser',spec:'..b.>....b..J.',to:['p3'],
  pts:[[605,92],[450,80],[300,85],[180,120],[110,210],[100,330],[110,450],[115,520]]},
 {id:'p3',nm:'Rummet',spec:'.h.z..G',to:[],pts:[[150,560],[135,680],[150,790],[210,860],[290,882]]}
];
const FT={
 b:{k:'p',ic:'❓',n:'Power-kasse',d:'Kør igennem, og få en tilfældig power, hvis du ikke allerede har én.'},
 '>':{k:'g',ic:'⏩',n:'Fartbånd',d:'Stopper du her, skyder du 3 felter frem.'},
 J:{k:'g',ic:'🛫',n:'Hopperampe',d:'Stopper du her, flyver bilen 4 felter frem hen over alt, hvad der ligger under den.'},
 s:{k:'n',ic:'🏜️',n:'Dybt sand',d:'Hvert sandfelt koster 2 skridt.'},
 m:{k:'n',ic:'🟤',n:'Mudder',d:'Hvert mudderfelt koster 2 skridt.'},
 i:{k:'n',ic:'🧊',n:'Glat is',d:'Stopper du på isen, glider du 2 felter videre.'},
 L:{k:'b',ic:'🔄',n:'Toppen af loopet',d:'Stopper du på toppen, falder du ned til foden af loopet.'},
 a:{k:'b',ic:'🕳️',n:'Kløften',d:'Stopper du i luften, falder du ned og må starte forfra ved gaflen.'},
 f:{k:'b',ic:'🔥',n:'Brændende bro',d:'Stopper du på broen, brænder motoren, og du står over næste tur.'},
 z:{k:'b',ic:'⛈️',n:'Tordensky',d:'Lynet slår ned i den bil, der fører, og den ryger 2 felter tilbage. Også hvis det er dig!'},
 h:{k:'b',ic:'🌑',n:'Sort hul',d:'Du bliver suget 3 felter tilbage.'}
};
const POW={
 raket:{ic:'🚀',n:'Raket',d:'Brug den før du slår: +4 felter på slaget.'},
 missil:{ic:'🎯',n:'Jagermissil',d:'Flyver selv hen til bilen lige foran dig og sender den 3 felter tilbage.'},
 lyn:{ic:'⚡',n:'Lynstorm',d:'Alle de andre biler ryger 2 felter tilbage.'},
 olie:{ic:'🛢️',n:'Olieplet',d:'Hældes ud bag dig. Den næste, der kører ind i den, snurrer rundt og stopper.'},
 skjold:{ic:'🛡️',n:'Skjold',d:'Virker af sig selv: tager det næste angreb, skub eller lyn for dig.'}
};
const EVT={
 vulkan:{k:'b',ic:'🌋',n:'Vulkanudbrud',col:'#ff4a12',d:'Lavabomber regner ned over det røde stykke af banen. Biler, der holder der, ryger 2 felter tilbage, og det samme sker for alle, der stopper der i denne runde.'},
 meteor:{k:'b',ic:'☄️',n:'Meteorregn',col:'#ffb02e',d:'Meteorer slår ned og laver kratere på banen. Stopper du i et krater i denne runde, ryger du 2 felter tilbage.'},
 nordlys:{k:'g',ic:'🌌',n:'Nordlys',col:'#3dffa8',d:'Et grønt lys danser over banen. Biler i lyset kører 2 felter frem, og stopper du i lyset i denne runde, skyder du 3 felter frem.'},
 stjerne:{k:'p',ic:'🌠',n:'Stjerneskud',col:'#c4a8ff',d:'Stjerneskud lander på banen. Stopper du på et i denne runde, får du en power.'}
};
const NODES=[],PI={};
PATHS.forEach((P,pi)=>{PI[P.id]=pi;P.n=P.spec.length;P.ids=[];for(let k=0;k<P.n;k++){const c=P.spec[k];P.ids.push(NODES.length);NODES.push({id:NODES.length,pi,k,c,next:[],back:null,cost:c==='s'||c==='m'?2:1,ns:c==='L'||c==='a'})}});
const link=(a,b)=>{NODES[a].next.push(b);if(NODES[b].back===null)NODES[b].back=a};
PATHS.forEach(P=>{for(let k=0;k<P.n-1;k++)link(P.ids[k],P.ids[k+1]);P.to.forEach(t=>link(P.ids[P.n-1],PATHS[PI[t]].ids[0]))});
const START=PATHS[0].ids[0],GOAL=NODES.find(n=>n.c==='G').id;
/* felter tilbage til mål (korteste vej) */

/* ================= sound ================= */
let AC;
const ac=()=>AC=AC||new (window.AudioContext||window.webkitAudioContext)();
function tone(f,d,type,v,when,f2){if(mute)return;try{ac();const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function noise(d,v,when,f){if(mute)return;try{ac();const t=AC.currentTime+(when||0),n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type='lowpass';fl.frequency.value=f||900;g.gain.value=v||.3;s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t)}catch(e){}}
const sfx={step:()=>tone(420,.05,'triangle',.05),

/* ================= geometry ================= */
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const TW=72,HW=TW/2,K=1.125;
let G=null;
function cr(P){let d=`M${P[0][0]} ${P[0][1]}`;for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
  d+=`C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6} ${p2[0]} ${p2[1]}`}return d}
function geom(port){
  const W=(port?1000:1600)*K,H=(port?1600:1000)*K,M=port?(([x,y])=>[y*K,(1600-x)*K]):(([x,y])=>[x*K,y*K]);
  const P=PATHS.map(pa=>{const pts=pa.pts.map(M),e=document.createElementNS(NS,'path');e.setAttribute('d',cr(pts));$('meas').appendChild(e);
    const L=e.getTotalLength(),a=[];for(let s=0;s<L;s+=4){const q=e.getPointAtLength(s);a.push([q.x,q.y])}const q=e.getPointAtLength(L);a.push([q.x,q.y]);e.remove();
    return {L,a,FL:L/pa.n,pts}});
  const g={W,H,port,M,P};
  g.np=NODES.map(n=>atP(P[n.pi],(n.k+.5)*P[n.pi].FL));
  g.co=[];P.forEach(p=>p.a.forEach((q,i)=>{if(i%3===0)g.co.push(q)}));
  return g}
function atP(p,s){const A=p.a,k=Math.max(0,Math.min(A.length-1.001,s/4)),i=Math.floor(k),f=k-i,a=A[i],b=A[i+1];
  const x=a[0]+(b[0]-a[0])*f,y=a[1]+(b[1]-a[1])*f,i0=Math.max(0,i-2),i1=Math.min(A.length-1,i+3);
  let tx=A[i1][0]-A[i0][0],ty=A[i1][1]-A[i0][1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
  return {x,y,tx,ty,nx:-ty,ny:tx}}
const clear=(x,y,r)=>G.co.every(([a,b])=>(a-x)**2+(b-y)**2>(HW+12+r)**2);
const F1=v=>(+v).toFixed(1);
const ang=p=>Math.atan2(p.ty,p.tx)*57.2958;
function poseBetween(a,b,t){const A=NODES[a],B=NODES[b];
  if(A.pi===B.pi&&Math.abs(A.k-B.k)===1){const p=G.P[A.pi];return atP(p,(A.k+.5+(B.k-A.k)*t)*p.FL)}
  const pa=G.np[a],pb=G.np[b];let tx=pa.tx+(pb.tx-pa.tx)*t,ty=pa.ty+(pb.ty-pa.ty)*t;const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
  return {x:pa.x+(pb.x-pa.x)*t,y:pa.y+(pb.y-pa.y)*t,tx,ty,nx:-ty,ny:tx}}

/* ================= drawing helpers ================= */
let seed=1;const R=()=>((seed=(seed*16807)%2147483647)/2147483647);
const pick=a=>a[Math.floor(R()*a.length)];
const blob=(x,y,r,n,j)=>{let d='';for(let k=0;k<n;k++){const a=k/n*6.283,rr=r*(1-j/2+R()*j);d+=(k?'L':'M')+F1(x+Math.cos(a)*rr)+' '+F1(y+Math.sin(a)*rr)}return d+'Z'};
const sblob=(x,y,r,n,j)=>{const p=[];for(let k=0;k<n;k++){const a=k/n*6.283,rr=r*(1-j/2+R()*j);p.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr])}
  let d='';for(let k=0;k<n;k++){const a=p[k],b=p[(k+1)%n],m=[(a[0]+b[0])/2,(a[1]+b[1])/2];d+=(k?'':'M'+F1((p[n-1][0]+a[0])/2)+' '+F1((p[n-1][1]+a[1])/2))+'Q'+F1(a[0])+' '+F1(a[1])+' '+F1(m[0])+' '+F1(m[1])}return d+'Z'};
const rock=(x,y,s,c,c2)=>{const d=blob(x,y,s,7,.45);return `<path d="${d}" fill="rgba(0,0,0,.38)" transform="translate(${F1(s*.35)} ${F1(s*.45)})"/><path d="${d}" fill="${c}" stroke="${c2}" stroke-width="1.2"/><path d="${blob(x-s*.22,y-s*.22,s*.5,6,.4)}" fill="rgba(255,255,255,.13)"/>`};
const tree=(x,y,s,dark)=>`<circle cx="${F1(x+s*.35)}" cy="${F1(y+s*.5)}" r="${F1(s)}" fill="rgba(0,0,0,.35)"/>`+[0,1,2,3].map(k=>{const a=R()*6.28,o=s*.38;return `<circle cx="${F1(x+Math.cos(a)*o)}" cy="${F1(y+Math.sin(a)*o)}" r="${F1(s*(.55+R()*.2))}" fill="url(#${dark?'cn2':'cn'})"/>`}).join('');
const pine=(x,y,s)=>`<circle cx="${F1(x+s*.35)}" cy="${F1(y+s*.5)}" r="${F1(s)}" fill="rgba(30,40,50,.33)"/>`+[1,.7,.42].map((k,j)=>{let d='';const n=9;for(let i=0;i<n*2;i++){const a=i/(n*2)*6.283+j*.3,rr=s*k*(i%2?.55:1);d+=(i?'L':'M')+F1(x+Math.cos(a)*rr)+' '+F1(y+Math.sin(a)*rr)}return `<path d="${d}Z" fill="${['#1b3f2e','#22503a','#2c6246'][j]}" stroke="#0e2419" stroke-width=".7"/>`}).join('')+`<circle cx="${F1(x-s*.15)}" cy="${F1(y-s*.2)}" r="${F1(s*.2)}" fill="#eef3f6" opacity=".85"/>`;
const PROP={
 city:(x,y)=>{const w=26+R()*40,h=22+R()*36,a=Math.round(R()*3)*30,c=pick(['#7d8188','#8f8a82','#666a71','#a29c92','#72767d','#857c74']),tall=R();
   return `<g transform="translate(${F1(x)} ${F1(y)}) rotate(${a})"><rect x="${F1(-w/2+4+tall*10)}" y="${F1(-h/2+6+tall*14)}" width="${F1(w)}" height="${F1(h)}" fill="rgba(0,0,0,.42)"/><rect x="${F1(-w/2)}" y="${F1(-h/2)}" width="${F1(w)}" height="${F1(h)}" fill="${c}" stroke="#25272b" stroke-width="1.1"/><rect x="${F1(-w/2+3)}" y="${F1(-h/2+3)}" width="${F1(w-6)}" height="${F1(h-6)}" fill="none" stroke="rgba(255,255,255,.16)"/>${R()<.6?`<rect x="${F1(-w/4)}" y="${F1(-h/4)}" width="9" height="7" fill="#50545a" stroke="#383b40"/>`:''}${R()<.4?`<circle cx="${F1(w/5)}" cy="${F1(h/6)}" r="3.5" fill="#4b4f55" stroke="#33363b"/>`:''}${R()<.25?`<rect x="${F1(-w/2+4)}" y="${F1(h/2-7)}" width="${F1(w-8)}" height="3" fill="${pick(['#ff5fb0','#45d6ff','#f5b829'])}" opacity=".85"/>`:''}</g>`},
 desert:(x,y)=>{const r=R();if(r<.3)return rock(x,y,7+R()*14,'#a2703f','#6e4724');
   if(r<.62)return `<ellipse cx="${F1(x)}" cy="${F1(y)}" rx="${F1(30+R()*40)}" ry="${F1(9+R()*9)}" transform="rotate(${F1(R()*24-12)} ${F1(x)} ${F1(y)})" fill="url(#dune)"/><ellipse cx="${F1(x+6)}" cy="${F1(y+7)}" rx="${F1(26+R()*20)}" ry="5" transform="rotate(${F1(R()*24-12)} ${F1(x)} ${F1(y)})" fill="rgba(120,80,40,.18)"/>`;
   if(r<.78)return `<circle cx="${F1(x+3)}" cy="${F1(y+4)}" r="7" fill="rgba(0,0,0,.25)"/><path d="${blob(x,y,7,8,.5)}" fill="#4d7a3e" stroke="#2c4a22"/>`;
   return [0,1,2,3].map(()=>`<circle cx="${F1(x+(R()-.5)*16)}" cy="${F1(y+(R()-.5)*16)}" r="${F1(2.5+R()*3)}" fill="#7a7442" opacity=".8"/>`).join('')},
 lava:(x,y)=>{const r=R();if(r<.2){const d=blob(x,y,8+R()*12,9,.5);return `<path d="${d}" fill="url(#lv)" filter="url(#glow)" opacity=".9"/>`}
   if(r<.38){let d=`M${F1(x)} ${F1(y)}`;for(let k=0;k<4;k++)d+=`l${F1((R()-.5)*34)} ${F1((R()-.5)*34)}`;return `<path d="${d}" stroke="#ff6a1a" stroke-width="2.2" fill="none" filter="url(#glow)"/>`}
   return rock(x,y,7+R()*16,'#2c2420','#120d0b')},

   return `<ellipse cx="${F1(x)}" cy="${F1(y)}" rx="${F1(18+R()*20)}" ry="${F1(9+R()*8)}" fill="#c6dce8" opacity=".8"/>`},
 jungle:(x,y)=>{const r=R();if(r<.85)return tree(x,y,13+R()*13,R()<.5);
   return `<path d="${blob(x,y,9+R()*8,8,.4)}" fill="#4a3720" opacity=".8"/>`},

   if(r<.5)return rock(x,y,5+R()*10,'#5a5c64','#2e3036');
   return ''}
};

/* ================= movement ================= */
async function stepTo(i,to,ms,back){const v=Vv[i],from=S.cars[i].pos;v.moving=true;
  await tw(ms,k=>{const p=poseBetween(from,to,k);v.x=p.x;v.y=p.y;v.tx=p.tx;v.ty=p.ty;v.hop=back?0:Math.sin(k*Math.PI)*.55});
  S.cars[i].pos=to;v.hop=0}
async function slideBack(i,n,spin){const c=S.cars[i];let to=backOf(c.pos,n);const path=[];let b=c.pos;while(b!==to&&path.length<20){b=NODES[b].back;if(b===null)break;path.push(b)}
  Vv[i].moving=true;for(const nd of path){await tw(170,k=>{const p=poseBetween(c.pos,nd,k);Vv[i].x=p.x;Vv[i].y=p.y;Vv[i].tx=p.tx;Vv[i].ty=p.ty;if(spin)Vv[i].spin+=.25});c.pos=nd}
  await tw(300,k=>{if(spin)Vv[i].spin=Vv[i].spin*(1-k)});Vv[i].spin=0;Vv[i].moving=false}
async function hit(j,n,why){const c=S.cars[j];if(c.pw==='skjold'){c.pw=null;syncMods();sfx.zap();await banner('🛡️','Skjoldet holdt!',`${rawName(j)} slipper for ${why}.`,'p',1400);log(`${rawName(j)}s skjold tog ${why}.`);return false}
  await slideBack(j,n,true);syncMods();return true}
const shown={};
async function drive(i,steps,free){const c=S.cars[i];let r=steps,moved=0;
  while(r>0){const nd=NODES[c.pos];if(nd.c==='G')return 'goal';
    let nx=nd.next[0];if(nd.next.length>1)nx=await chooseFork(i,nd,r);
    const cost=free?1:NODES[nx].cost;
    if(r<cost){const t=NODES[nx].c==='s'?'Sandet er for dybt':'Mudderet er for tungt';log(`${rawName(i)}: ${t}, bilen sidder fast.`);await banner(NODES[nx].c==='s'?'🏜️':'🟤',t+'!',`Næste felt koster 2 skridt, og ${rawName(i)} har kun 1 tilbage.`,'b',1400);return 'stuck'}
    r-=cost;sfx.step();await stepTo(i,nx,cost>1?420:Math.max(150,Math.min(260,1500/Math.max(1,steps))));moved++;
    if(cost>1){Vv[i].smoke=1;syncMods()}
    if(r===0)for(let j=0;j<S.n;j++)if(j!==i&&S.cars[j].pos===nx){sfx.bump();shake=Math.max(shake,.3);const ok=await hit(j,1,'skubbet');if(ok){log(`${rawName(i)} skubbede ${rawName(j)} et felt tilbage.`);await banner('💥','Skub!',`${rawName(i)} kører op i ${rawName(j)}, som ryger et felt tilbage.`,'b',1300)}}
    const oi=S.oil.indexOf(nx);if(oi>=0){S.oil.splice(oi,1);syncMods();sfx.bad();if(c.pw==='skjold'){c.pw=null;syncMods();await banner('🛡️','Skjoldet holdt!',`${rawName(i)} kører lige igennem oliepletten.`,'p',1300)}
      else{await tw(800,k=>Vv[i].spin=k*12.56);Vv[i].spin=0;log(`${rawName(i)} snurrede rundt i en olieplet.`);await banner('🛢️','Olieplet!',`${rawName(i)} snurrer rundt og stopper her.`,'b',1500);Vv[i].moving=false;return 'oil'}}
    if(NODES[nx].c==='b'&&!c.pw)await givePower(i);
    if(NODES[nx].c==='G'){Vv[i].moving=false;return 'goal'}}
  Vv[i].moving=false;Vv[i].smoke=0;syncMods();return moved?'ok':'none'}
async function land(i,depth){const c=S.cars[i],nd=NODES[c.pos],v=Vv[i];if(nd.c==='G')return;
  if(nd.ns){const loop=nd.c==='L';sfx.bad();shake=.5;log(`${rawName(i)} ${loop?'faldt ned fra loopet':'faldt ned i kløften'}.`);
    await banner(loop?'🔄':'🕳️',loop?'Ingen fart nok!':'Ned i kløften!',loop?'Bilen falder ned fra toppen af loopet og lander ved foden.':'Bilen falder ned og bliver hejst op ved gaflen.','b',1700);
    v.moving=true;await tw(600,k=>{v.sc=1-k*.8;v.spin=k*(loop?3:8);v.op=1-k*.7});c.pos=nd.fall;const p=G.np[nd.fall];v.x=p.x;v.y=p.y;v.tx=p.tx;v.ty=p.ty;await wait(250);
    await tw(450,k=>{v.sc=.2+k*.8;v.spin=0;v.op=.3+k*.7;v.hop=Math.sin(k*Math.PI)*.5});v.sc=1;v.op=1;v.hop=0;v.moving=false;return}
  if(nd.c==='f'){sfx.boom();v.fire=1;syncMods();shake=.4;c.skip=1;log(`${rawName(i)} brændte på Vulkanbroen og står over.`);await banner('🔥','Motoren brænder!',`${rawName(i)} stoppede på den brændende bro og står over næste tur.`,'b',1800);v.fire=0;syncMods();return}
  if(nd.c==='z'){const L=leaders();log(`Tordensky! Lynet ramte ${L.map(rawName).join(' og ')}.`);await banner('⛈️','Tordensky!',L.includes(i)?'Lynet rammer den forreste bil … og det er dig selv!':`Lynet rammer den forreste bil: ${L.map(rawName).join(' og ')}.`,'b',1700);
    for(const j of L){await fxBolt(Vv[j].x,Vv[j].y);await hit(j,2,'lynet')}return}
  if(nd.c==='h'){sfx.whoosh();log(`${rawName(i)} blev suget ind i det sorte hul.`);await banner('🌑','Sort hul!',`${rawName(i)} bliver suget 3 felter tilbage.`,'b',1500);await tw(500,k=>v.spin=k*6);await slideBack(i,3,true);return}
  if(nd.c==='J'&&depth<3){sfx.rev();await banner('🛫','Hopperampe!',`${rawName(i)} letter og flyver 4 felter frem.`,'g');await fly(i,4);await land(i,depth+1);return}
  if(nd.c==='>'&&depth<3){sfx.rev();v.fire=1;syncMods();await banner('⏩','Fartbånd!','Bilen skyder 3 felter frem.','g',1100);const r=await drive(i,3,true);v.fire=0;syncMods();if(r==='ok')await land(i,depth+1);return}
  if(nd.c==='i'&&depth<3){log(`${rawName(i)} gled på isen.`);await banner('🧊','Glat is!','Bilen glider 2 felter videre.','b',1100);const r=await drive(i,2,true);if(r==='ok'&&NODES[c.pos].c!=='i')await land(i,depth+1);return}}

async function givePower(i){const c=S.cars[i];if(c.pw)return;const pw=drawPower(i);c.pw=pw;syncMods();sfx.zap();log(`${rawName(i)} fik en power: ${POW[pw].n}.`);hud(true);await banner(POW[pw].ic,POW[pw].n+'!',`${rawName(i)}: ${POW[pw].d}`,'p')}
async function fly(i,n){const c=S.cars[i],v=Vv[i],path=[];let b=c.pos;for(let k=0;k<n;k++){const x=NODES[b].next[0];if(x===undefined)break;path.push(x);b=x;if(NODES[x].c==='G')break}
  v.moving=true;sfx.whoosh();for(let k=0;k<path.length;k++){const from=c.pos,to=path[k];await tw(300,t=>{const p=poseBetween(from,to,t);v.x=p.x;v.y=p.y;v.tx=p.tx;v.ty=p.ty;v.hop=Math.sin((k+t)/path.length*Math.PI)*2.4});c.pos=to}
  v.hop=0;v.moving=false;sfx.bump();shake=Math.max(shake,.35);
  for(let j=0;j<S.n;j++)if(j!==i&&S.cars[j].pos===c.pos){const ok=await hit(j,1,'landingen');if(ok){log(`${rawName(i)} landede oven på ${rawName(j)}.`);await banner('💥','Hård landing!',`${rawName(i)} lander lige ved siden af ${rawName(j)}, som ryger et felt tilbage.`,'b')}}
  if(NODES[c.pos].c==='b')await givePower(i)}

/* ================= events on random sections ================= */
function drawEv(){const g=$('cars')&&$('cars').querySelector('#ev');if(!g||!G)return;const E=S.ev&&EVT[S.ev.k];if(!E){g.innerHTML='';return}
  const pts=S.ev.zone.map(id=>G.np[id]),line=pts.map(a=>F1(a.x)+','+F1(a.y)).join(' ');let o='';
  if(S.ev.k==='nordlys')o+=[0,1,2].map(k=>`<polyline class="hla" points="${pts.map((a,j)=>F1(a.x+a.nx*(k-1)*30+Math.sin(j*1.3+k)*14)+','+F1(a.y+a.ny*(k-1)*30+Math.cos(j*1.1+k)*14)).join(' ')}" fill="none" stroke="${['#3dffa8','#5fd8ff','#b48cff'][k]}" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity=".55" filter="url(#eblur)" style="animation-delay:${k*.3}s"/>`).join('');
  else o+=`<polyline class="hla" points="${line}" fill="none" stroke="${E.col}" stroke-width="${TW+30}" stroke-linecap="round" stroke-linejoin="round" opacity=".38" filter="url(#eblur)"/>`;
  if(S.ev.k==='vulkan')pts.forEach((a,j)=>{o+=`<circle class="hla" cx="${F1(a.x+a.nx*(j%2?20:-20))}" cy="${F1(a.y+a.ny*(j%2?20:-20))}" r="7" fill="#ffb02e" filter="url(#glow)" style="animation-delay:${j*.17}s"/>`});
  S.ev.spots.forEach(id=>{const a=G.np[id];o+=S.ev.k==='meteor'?`<circle cx="${F1(a.x)}" cy="${F1(a.y)}" r="30" fill="url(#crt)"/><circle cx="${F1(a.x)}" cy="${F1(a.y)}" r="18" fill="#140c08" stroke="#5a3a22" stroke-width="3"/>`
    :`<g transform="translate(${F1(a.x)} ${F1(a.y)})"><circle class="hla" r="30" fill="#c4a8ff" opacity=".35" filter="url(#eblur)"/><path d="M0 -20L5.5 -6.5L20 -6L8.5 3.5L12.5 18L0 9.5L-12.5 18L-8.5 3.5L-20 -6L-5.5 -6.5Z" fill="#fff4b0" stroke="#e9a91b" stroke-width="2"/></g>`});
  const m=pts[Math.floor(pts.length/2)],t=`${E.ic} ${E.n.toUpperCase()}`,w=t.length*10+26;
  o+=`<g transform="translate(${F1(m.x)} ${F1(m.y-56)})"><rect x="${-w/2}" y="-16" width="${w}" height="32" rx="8" fill="#121417" stroke="${E.col}" stroke-width="3"/><text y="1" text-anchor="middle" dominant-baseline="central" font-family="Barlow Condensed,Arial" font-weight="800" font-size="19" fill="#fff">${t}</text></g>`;
  g.innerHTML=o}
const evRange=()=>{if(!S.ev)return '';const ns=S.ev.zone.map(id=>NODES[id].num);return `felt ${Math.min(...ns)}–${Math.max(...ns)}`};
async function fxMeteor(x,y){const g=mk(`<line stroke="#ffd36a" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>`),l=g.firstChild;sfx.whoosh();
  await tw(420,k=>{const sx=x+260*(1-k),sy=y-320*(1-k);l.setAttribute('x1',F1(sx+60));l.setAttribute('y1',F1(sy-75));l.setAttribute('x2',F1(sx));l.setAttribute('y2',F1(sy))});g.remove();await fxBoom(x,y,.7)}
async function newRound(){S.round=(S.round||1)+1;if(S.ev){S.ev=null;drawEv()}if(S.round<3||Math.random()>.45)return;await startEvent()}
async function startEvent(kind){const ks=Object.keys(EVT),k=kind||ks[Math.floor(Math.random()*ks.length)],E=EVT[k];
  const anchor=Math.floor(Math.random()*S.n);let b=S.cars[anchor].pos;for(let s=0;s<2;s++){const x=NODES[b].back;if(x!==null)b=x}
  const zone=[];let x=b;for(let s=0;s<8&&x!==undefined;s++){if(x!==START&&x!==GOAL)zone.push(x);const nx=NODES[x].next;x=nx[Math.floor(Math.random()*nx.length)]}
  const pool=zone.filter(z=>!NODES[z].ns).sort(()=>Math.random()-.5),spots=k==='meteor'?pool.slice(0,3):k==='stjerne'?pool.slice(0,2):[];
  S.ev={k,zone,spots};syncMods();log(`${E.n} på ${evRange()}!`);(E.k==='b'?sfx.bad:sfx.good)();if(k==='nordlys')flash('#3dffa8',700);else if(k==='vulkan'){shake=.6;sfx.boom()}
  await banner(E.ic,E.n+'!',`${E.d} Det gælder ${evRange()}.`,E.k);
  for(const j of ids()){const pos=S.cars[j].pos;if(pos===GOAL)continue;
    if(k==='vulkan'&&zone.includes(pos)){await fxBoom(Vv[j].x,Vv[j].y,.8);if(await hit(j,2,'lavabomben'))log(`Lavabombe: ${rawName(j)} ryger 2 felter tilbage.`)}
    else if(k==='meteor'&&spots.includes(pos)){await fxMeteor(Vv[j].x,Vv[j].y);if(await hit(j,2,'meteoren'))log(`Meteor: ${rawName(j)} ryger 2 felter tilbage.`)}
    else if(k==='nordlys'&&zone.includes(pos)){log(`Nordlyset skubber ${rawName(j)} 2 felter frem.`);await drive(j,2,true)}
    else if(k==='stjerne'&&spots.includes(pos)){S.ev.spots=S.ev.spots.filter(z=>z!==pos);syncMods();await givePower(j)}}
  if(k==='meteor')for(const id of spots){const a=G.np[id];if(!ids().some(j=>S.cars[j].pos===id))await fxMeteor(a.x,a.y)}}
async function zoneHit(i){if(!S.ev)return;const k=S.ev.k,c=S.cars[i],pos=c.pos;if(pos===GOAL)return;
  if(k==='vulkan'&&S.ev.zone.includes(pos)){await banner('🌋','Lavabombe!',`${rawName(i)} stoppede i vulkanudbruddet og ryger 2 felter tilbage.`,'b');await fxBoom(Vv[i].x,Vv[i].y,.8);await hit(i,2,'lavabomben')}
  else if(k==='meteor'&&S.ev.spots.includes(pos)){await banner('☄️','Meteorkrater!',`${rawName(i)} kørte ned i et krater og ryger 2 felter tilbage.`,'b');await hit(i,2,'meteoren')}
  else if(k==='nordlys'&&S.ev.zone.includes(pos)){flash('#3dffa8',500);await banner('🌌','Nordlys!',`Lyset giver ${rawName(i)} fart: 3 felter frem.`,'g');const r=await drive(i,3,true);if(r==='ok')await land(i,2)}
  else if(k==='stjerne'&&S.ev.spots.includes(pos)){S.ev.spots=S.ev.spots.filter(z=>z!==pos);syncMods();if(c.pw)await banner('🌠','Stjerneskud!',`${rawName(i)} har allerede en power, så stjernen forsvinder bare.`,'p');else await givePower(i)}}

/* ================= powers ================= */
function drawPower(i){const pl=place(i),last=pl===S.n&&S.n>1,first=pl===1;
  const w=first?{olie:3,skjold:3,missil:1,raket:1,lyn:0}:last?{raket:3,lyn:2,missil:2,skjold:1,olie:0}:{missil:3,raket:2,olie:1,skjold:1,lyn:1};
  let t=Math.random()*Object.values(w).reduce((a,b)=>a+b,0);for(const k in w){t-=w[k];if(t<=0)return k}return 'raket'}
function missileTarget(i){const me=dist(i),o=ids().filter(j=>j!==i);const ahead=o.filter(j=>dist(j)<me).sort((a,b)=>dist(b)-dist(a));if(ahead.length)return ahead[0];
  const beh=o.filter(j=>dist(j)>=me).sort((a,b)=>dist(a)-dist(b));return beh[0]}
async function usePower(){if(busy||S.win!==null||S.t.ph!=='roll')return;const i=S.p,c=S.cars[i],pw=c.pw;if(!pw||pw==='skjold')return;
  snap();busy=true;c.pw=null;syncMods();padLock(`${rawName(i)} bruger ${POW[pw].n}!`);
  if(pw==='raket'){S.t.plus=(S.t.plus||0)+4;sfx.rev();Vv[i].fire=1;syncMods();await banner('🚀','Raket klar!','+4 felter på dit slag.','p',1300);log(`${rawName(i)} tændte raketten: +4 på slaget.`)}
  else if(pw==='missil'){const j=missileTarget(i);if(j===undefined){await banner('🎯','Ingen at ramme','Missilet fløj ud i rummet.','p',1200)}else{log(`${rawName(i)}s jagermissil ramte ${rawName(j)}.`);await banner('🎯','Jagermissil!',`Missilet finder selv bilen lige foran: ${rawName(j)}.`,'p',1300);await fxMissile(i,j);await hit(j,3,'missilet')}}
  else if(pw==='lyn'){log(`${rawName(i)} sendte en lynstorm.`);await banner('⚡','Lynstorm!','Alle de andre biler ryger 2 felter tilbage.','p',1300);for(const j of ids()){if(j===i)continue;await fxBolt(Vv[j].x,Vv[j].y);await hit(j,2,'lynet')}}
  else if(pw==='olie'){const b=NODES[c.pos].back;if(b===null||b===START){await banner('🛢️','Ingen plads','Der er ikke noget felt bag dig. Oliepletten er spildt.','p',1200)}else{S.oil.push(b);syncMods();sfx.bad();log(`${rawName(i)} hældte olie ud bag sig.`);await banner('🛢️','Olieplet!','Den ligger bag dig og venter på den næste bil.','p',1300)}}
  save();busy=false;syncMods();hud()}

/* ================= turn flow ================= */
function bonus(i){return (S.t.plus||0)+(isLast(i)?1:0)}
function chooseFork(i,node,r){return new Promise(res=>{pend={type:'fork',node:node.id,i,r,res:v=>{pend=null;hlFork(null);hud();res(v)}};hlFork(node.id);hud(true)})}
function hlFork(id){const g=$('cars').querySelector('#hl');if(!g)return;if(id===null){g.innerHTML='';return}
  g.innerHTML=NODES[id].next.map(n=>{const pa=PATHS[NODES[n].pi],P=G.P[NODES[n].pi],gv=pa.alt==='Genvej',c=gv?'#ff6a3a':'#4aa3ff';let pts=[];for(let s=0;s<Math.min(P.L,2.2*P.FL);s+=8){const a=atP(P,s);pts.push(F1(a.x)+','+F1(a.y))}
    const a=atP(P,1.1*P.FL);return `<polyline class="hla" points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="${TW+10}" stroke-opacity=".45" stroke-linecap="round"/><g transform="translate(${F1(a.x)} ${F1(a.y)})"><rect x="-44" y="-15" width="88" height="30" rx="7" fill="${c}" stroke="#fff" stroke-width="2"/><text y="1" text-anchor="middle" dominant-baseline="central" font-family="Barlow Condensed,Arial" font-weight="800" font-style="italic" font-size="20" fill="#fff">${pa.alt.toUpperCase()}</text></g>`}).join('')}
async function advance(){for(let k=0;k<8;k++){S.p=(S.p+1)%S.n;if(S.p===0)await newRound();const c=S.cars[S.p];if(!c.skip)return;c.skip--;syncMods();log(`${rawName(S.p)} står over.`);await banner('💤','Står over',`${rawName(S.p)} står over denne tur.`,'b',1300)}}
async function go(steps,why){const i=S.p;busy=true;padLock(`${rawName(i)} kører ${steps} skridt${why?' ('+why+')':''}.`);S.last=`${rawName(i)} kørte ${steps} skridt${why?' ('+why+')':''}.`;log(S.last);
  Vv[i].fire=S.t.plus?1:Vv[i].fire;syncMods();
  const r=await drive(i,steps,false);Vv[i].fire=0;syncMods();
  if(r!=='goal'&&r!=='oil'&&r!=='stuck'&&r!=='none')await land(i,0);
  if(r!=='goal')await zoneHit(i);
  await endTurn()}
async function endTurn(){const fin=()=>ids().find(j=>S.cars[j].pos===GOAL);let w=fin();if(w===undefined){await advance();w=fin()}
  if(w!==undefined){S.win=w;log(`${rawName(w)} vinder løbet!`);sfx.win();await banner('🏁','I mål!',`${rawName(w)} kører over målstregen først!`,'g',2200)}
  S.t={ph:'roll'};save();busy=false;syncAll();hud()}
function roll(v){if(busy||bnDone||S.win!==null||S.phase!=='race')return;const i=S.p;snap();const b=bonus(i);go(v+b,b?bonusTxt(i):'')}
function act(a){if(pend&&pend.type==='fork'){if(a==='f0'||a==='f1')pend.res(NODES[pend.node].next[+a[1]]);return}
  if(busy||S.win!==null)return;if(a==='pw')usePower()}
const bonusTxt=i=>[S.t.plus?'🚀 +'+S.t.plus:'',isLast(i)?'bagerst +1':''].filter(Boolean).join(', ');

/* ================= HUD ================= */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const dieSvg=v=>`<svg viewBox="0 0 60 60" aria-hidden="true"><defs><linearGradient id="dg${v}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dde3"/></linearGradient></defs><rect x="3" y="3" width="54" height="54" rx="11" fill="url(#dg${v})" stroke="#9aa1ab" stroke-width="1.5"/>${PIPS[v].map(k=>`<circle cx="${16+(k%3)*14}" cy="${16+Math.floor(k/3)*14}" r="5" fill="#16181b"/>`).join('')}</svg>`;
$('keys').innerHTML=[1,2,3,4,5,6].map(v=>`<button class="key" data-v="${v}" aria-label="Terningen viste ${v}">${dieSvg(v)}</button>`).join('');
function modChips(c,i){const o=[];if(c.pw)o.push([POW[c.pw].ic+' '+POW[c.pw].n,'p']);if(c.skip)o.push(['💤 står over','b']);if(isLast(i))o.push(['🔼 bagerst: +1','']);
  return o.map(([t,k])=>`<span class="mod${k?' '+k:''}">${t}</span>`).join('')}
function padLock(t){$('last').textContent='';$('msg').textContent=t;$('hint').textContent='';$('keys').hidden=true;$('acts').innerHTML='';$('bUndo').disabled=true}
function hud(keepPad){
  const race=S.phase==='race';$('setup').classList.toggle('show',!race);$('pad').hidden=!race;$('pl').hidden=!race;
  ['bUndo','bNew'].forEach(id=>$(id).style.display=race?'':'none');
  requestAnimationFrame(()=>build());
  if(CEL.length)syncMods();
  if(!race){setupUI();return}
  $('pl').innerHTML=ids().map(i=>{const c=S.cars[i],pl=place(i),d=NODES[c.pos].d;return `<div class="pc${i===S.p&&S.win===null?' on':''}" style="--c:${col(i)}"><img src="${AV[S.players[i].car]}" alt=""><b>${nm(i)}</b><span class="plc${pl===1?' p1':''}">${pl}.</span><small>${d?(c.pos===START?'Start':'Felt '+NODES[c.pos].num)+' · '+d+' til mål':'I mål'}<span class="ar"> · ${PATHS[NODES[c.pos].pi].nm}</span></small><div class="pbar"><i style="width:${(1-d/TOTAL)*100}%"></i></div><div class="mods">${modChips(c,i)}</div></div>`}).join('');
  $('log').innerHTML=S.log.map(t=>`<li>${esc(t)}</li>`).join('')||'<li>Ingen træk endnu.</li>';
  const w=$('win');if(S.win!==null){$('wtxt').innerHTML=`<span style="color:${col(S.win)}">${nm(S.win)}</span> vinder!`;
    const ord=ids().sort((a,b)=>(b===S.win)-(a===S.win)||dist(a)-dist(b));
    $('stand').innerHTML=ord.map((i,k)=>`<li><span>${k+1}.</span><img src="${AV[S.players[i].car]}" alt=""><span>${nm(i)}</span><span style="margin-left:auto;color:var(--soft)">${dist(i)?dist(i)+' felter fra mål':'I mål'}</span></li>`).join('');
    if(!w.classList.contains('show')){w.classList.add('show');confetti()}}else w.classList.remove('show');
  if(busy&&!(pend&&pend.type==='fork'))return;
  const p=S.p,c=S.cars[p],t=S.t,pad=$('pad'),keys=$('keys'),acts=$('acts');pad.style.setProperty('--c',col(p));
  $('last').textContent=S.last;
  let msg='',hint='',a='',showKeys=false;const b=bonus(p);
  if(pend&&pend.type==='fork'){const nx=NODES[pend.node].next.map(n=>PATHS[NODES[n].pi]);msg=`<b>${nm(pend.i)}</b> er ved en gaffel med ${pend.r} skridt tilbage. Hvilken vej?`;
    a=nx.map((pa,k)=>`<button class="act ${pa.alt==='Genvej'?'gv':'om'}" data-a="f${k}">${pa.alt}: ${pa.nm}<small>${pa.tip}</small></button>`).join('')}
  else if(S.win!==null)msg=`<b>${nm(S.win)}</b> har vundet!`;
  else{showKeys=true;msg=`<b>${nm(p)}</b>: slå terningen, og tast slaget.`;hint=[bonusTxt(p),S.ev?EVT[S.ev.k].ic+' '+EVT[S.ev.k].n+' på '+evRange():''].filter(Boolean).join(' · ');
    if(c.pw&&c.pw!=='skjold')a=`<button class="act pw" data-a="pw">Brug ${POW[c.pw].ic} ${POW[c.pw].n}<small>${POW[c.pw].d}</small></button>`;else if(c.pw==='skjold')hint=(hint?hint+' · ':'')+'🛡️ skjoldet beskytter dig';}
  $('msg').innerHTML=msg;$('hint').textContent=hint;keys.hidden=!showKeys;acts.innerHTML=a;
  document.querySelectorAll('.key').forEach(k=>k.disabled=!showKeys);
  $('bUndo').disabled=!hist.length||!!pend}
function confetti(){if(RM)return;const em=['🏁','🏆','✨','🎉'];for(let i=0;i<30;i++){const s=document.createElement('span');s.className='conf';s.textContent=em[i%4];s.style.left=Math.random()*100+'vw';s.style.animationDuration=2+Math.random()*2.5+'s';s.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),6000)}}
function setupUI(){
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===S.n));
  $('srows').innerHTML=Array.from({length:S.n},(_,i)=>{const pc=S.players[i].car;return `<div class="srow" style="--c:${CARS[pc].col}"><input data-i="${i}" maxlength="14" value="${esc(S.players[i].name)}" placeholder="${CARS[pc].def}" aria-label="Navn på spiller ${i+1}">
   <div class="pick">${CARS.map((c,k)=>`<button data-i="${i}" data-k="${k}" style="--k:${c.col}" aria-pressed="${k===pc}" aria-label="${c.n}" title="${c.n}"><img src="${AV[k]}" alt=""></button>`).join('')}</div></div>`}).join('')}
function startRace(){hist=[];const pl=S.players,n=S.n;S=fresh(pl,n);S.phase='race';S.last='Løbet er i gang!';save();if(CEL.length)paintCars();syncAll();hud()}
function undo(){if(busy||pend||!hist.length)return;S=JSON.parse(hist.pop());save();syncAll();hud()}
$('keys').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)roll(+b.dataset.v)});
$('acts').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a)});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||S.phase!=='race')return;if(bnDone&&(e.key==='Enter'||e.key===' '||e.key==='Escape')){e.preventDefault();bnClose();return}if(e.key>='1'&&e.key<='6')roll(+e.key)});
$('seg').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;S.n=+b.dataset.n;save();hud()});
$('srows').addEventListener('input',e=>{const i=e.target.dataset.i;if(i!==undefined){S.players[i].name=e.target.value;save()}});
$('srows').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;const i=+b.dataset.i,k=+b.dataset.k,o=S.players.findIndex(p=>p.car===k);if(o===i)return;S.players[o].car=S.players[i].car;S.players[i].car=k;save();if(CEL.length)paintCars();hud()});
$('go').onclick=startRace;
$('bUndo').onclick=undo;$('wundo').onclick=undo;
$('again').onclick=startRace;
$('wsetup').onclick=()=>{S.phase='setup';S.win=null;save();hud();$('win').classList.remove('show')};
$('bNew').onclick=()=>{if(busy)return;if(S.win===null&&S.cars.some(c=>c.pos!==START)&&!confirm('Vil du stoppe løbet og starte et nyt?'))return;S.phase='setup';S.win=null;save();hud()};
$('bSnd').onclick=()=>{mute=!mute;$('bSnd').setAttribute('aria-pressed',!mute)};
$('bRules').onclick=()=>$('rules').classList.add('show');$('rclose').onclick=()=>$('rules').classList.remove('show');
const cls={g:'',b:'b',p:'p',n:'n'};
$('rtxt').innerHTML=`<ul><li>Én omgang rundt om banen. Første bil over <b>START / MÅL</b> vinder. Man behøver ikke slå præcist.</li><li>Slå med en rigtig terning, og tryk på det, den viste. Bilen kører selv.</li><li>Når der sker noget, bliver skiltet stående, til I trykker OK.</li></ul>
<h3>Gafler</h3><ul><li>Tre steder deler banen sig. Når bilen kommer til en gaffel, vælger du <b>Genvej</b> (kort, men farlig) eller <b>Omvej</b> (længere, men med power-kasser og fartbånd).</li></ul>
<h3>Felter og underlag</h3><ul class="ev">${Object.values(FT).map(e=>`<li class="${cls[e.k]}"><b>${e.ic} ${e.n}</b><br>${e.d}</li>`).join('')}</ul>
<h3>Begivenheder</h3><ul class="ev">${Object.values(EVT).map(e=>`<li class="${cls[e.k]}"><b>${e.ic} ${e.n}</b><br>${e.d}</li>`).join('')}</ul>
<ul><li>Fra anden runde kan der ske en begivenhed, hver gang en ny runde starter. Den rammer et tilfældigt stykke af banen, som lyser op, og varer runden ud.</li></ul>
<h3>Powers</h3><ul class="ev">${Object.values(POW).map(e=>`<li class="p"><b>${e.ic} ${e.n}</b><br>${e.d}</li>`).join('')}</ul>
<ul><li>Du kan have én power ad gangen. Du bestemmer selv, hvornår du bruger den, men aldrig hvem den rammer. Det klarer spillet.</li><li>Bilerne bagerst får oftere de stærke powers.</li></ul>
<h3>Biler, der mødes</h3><ul><li>Kører du ind i en anden bil, skubber du den et felt tilbage.</li><li>Den bil, der ligger sidst, får +1 på hvert slag, så ingen falder helt af.</li></ul>`;
syncAll();hud();build();requestAnimationFrame(tick);
window.GR={get S(){return S},NODES,PATHS,roll,act,usePower,startEvent,sync(){syncAll();hud()},build,get pend(){return pend},get busy(){return busy}};
}
</script>
</body>
