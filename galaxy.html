<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121417">
<title>Galaxy Raceway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121417;--panel:rgba(24,27,32,.94);--line:#30353d;--ink:#f2f3f5;--soft:#a0a8b4;--gold:#f5b829;--bad:#e5484d;--good:#30a46c}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,#1f2329,#0d0f12 75%);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.disp{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.02em}
#app{position:fixed;inset:0;display:grid;grid-template:"top top" auto "pl board" minmax(0,1fr) "pl pad" auto / minmax(190px,240px) minmax(0,1fr);gap:10px;
 padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#top{grid-area:top;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-size:clamp(22px,3vw,30px);line-height:1;margin-right:auto;white-space:nowrap}
.logo span,.title span{color:var(--gold)}
.pill{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 14px;min-height:42px;font-weight:700;font-size:14px;text-decoration:none;color:#fff;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed=true]{background:#fff;color:#121417;border-color:#fff}
.pill:disabled{opacity:.4}
#pl{grid-area:pl;display:flex;flex-direction:column;gap:10px;overflow:auto;align-self:start;max-height:100%;padding-top:8px}
.pc{background:var(--panel);border:2px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 8px;align-items:center;position:relative}
.pc.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 0 18px color-mix(in srgb,var(--c) 55%,transparent)}
.pc.on::after{content:"Din tur";position:absolute;top:-10px;right:10px;background:var(--c);color:#fff;font-size:12px;font-weight:700;padding:0 8px;border-radius:6px}
.pc img{width:44px;height:44px;grid-row:span 2}
.pc b{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc small{color:var(--soft);font-weight:600;font-size:12px}
.pbar{grid-column:1/-1;height:6px;border-radius:6px;background:#0b0c0e;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--c);transition:width .5s}
.mods{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mods:empty{display:none}
.mod{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:#0b0c0e;border:1px solid var(--good)}
.mod.b{border-color:var(--bad)}
#bw{grid-area:board;position:relative;min-height:0;min-width:0}
#bw svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#cars{pointer-events:none;overflow:visible}
#pad{grid-area:pad;justify-self:center;width:min(100%,620px);background:var(--panel);border:2px solid var(--line);border-top:4px solid var(--c,var(--line));border-radius:16px;padding:8px 12px 12px;display:grid;gap:6px}
#pad[hidden],#pl[hidden]{display:none}
#last{font-size:13px;font-weight:600;color:var(--soft);text-align:center;min-height:18px}
#msg{font-size:clamp(16px,2.4vw,20px);font-weight:700;text-align:center;line-height:1.2}
#msg b{color:var(--c);filter:brightness(1.3)}
#hint{font-size:13px;font-weight:700;text-align:center;color:var(--gold);min-height:18px}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.key{border:0;background:transparent;padding:0;border-radius:12px;transition:transform .1s}
.key svg{display:block;width:100%;height:auto;max-height:68px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.55))}
.key:active{transform:translateY(3px) scale(.96)}
.key:disabled{opacity:.35}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;text-align:center;display:none;width:min(92vw,520px);background:rgba(16,18,22,.94);border:2px solid var(--line);border-top:6px solid var(--good);border-radius:16px;padding:14px 18px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
#banner.b{border-top-color:var(--bad)}
#banner.show{display:block;animation:pop .3s cubic-bezier(.3,1.5,.5,1) both}
#banner .bi{font-size:clamp(40px,7vw,60px);line-height:1}
#banner .bt{font-size:clamp(28px,5vw,42px);line-height:1.05;margin-top:4px}
#banner.g .bt{color:var(--gold)}#banner.b .bt{color:#ff7a70}
#banner .bd{margin-top:6px;font-weight:600;font-size:clamp(14px,2.2vw,17px);color:#dfe3e8}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.ov{position:fixed;inset:0;z-index:10;background:rgba(8,9,11,.72);backdrop-filter:blur(4px);display:none;overflow:auto;padding:16px}
.ov.show{display:grid;place-items:center}
.box{background:#16191e;border:2px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px);width:min(100%,720px);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.title{font-size:clamp(36px,8vw,64px);line-height:.95;text-align:center;margin:0 0 6px}
.sub{text-align:center;color:var(--soft);font-weight:600;margin:0 0 16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-width:52px;min-height:44px;border:0;background:#0d0f12;font-weight:700;font-size:18px}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed=true]{background:#fff;color:#121417}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:#0d0f12;border:2px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:8px 10px;margin:8px 0}
.srow input{font:700 18px Barlow,sans-serif;color:#fff;background:transparent;border:0;border-bottom:2px solid var(--line);padding:6px 4px;width:100%}
.srow input:focus{border-bottom-color:var(--c);outline:none}
.pick{display:flex;gap:6px}
.pick button{width:58px;height:58px;border-radius:10px;border:2px solid var(--line);background:#1d2026;padding:2px}
.pick button img{width:100%;height:100%;display:block}
.pick button[aria-pressed=true]{border-color:#fff;background:color-mix(in srgb,var(--k) 35%,#1d2026)}
.cta{border:0;border-radius:12px;background:var(--gold);color:#121417;font-weight:800;font-size:19px;padding:12px 26px;min-height:54px;box-shadow:0 4px 0 #9c720f}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 #9c720f}
.btn2{border:2px solid var(--line);border-radius:12px;background:#0d0f12;font-weight:700;font-size:16px;padding:10px 18px;min-height:54px;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.rules h3{margin:14px 0 6px;font-size:16px;color:var(--gold)}
.rules ul{margin:0;padding-left:20px}.rules li{margin:3px 0}
.rules .ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px;list-style:none;padding:0}
.rules .ev li{background:#0d0f12;border-left:5px solid var(--good);border-radius:8px;padding:6px 10px}
.rules .ev li.b{border-color:var(--bad)}
#log{list-style:none;padding:0;margin:0;color:var(--soft);font-size:14px}
.stand{list-style:none;padding:0;margin:14px auto 0;max-width:340px}
.stand li{display:flex;align-items:center;gap:10px;font-weight:700;padding:4px 0}
.stand img{width:44px;height:44px}
.conf{position:fixed;top:-40px;z-index:11;font-size:26px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.ver{position:fixed;right:10px;bottom:2px;font-size:11px;color:var(--soft);opacity:.7;pointer-events:none}
#meas{position:absolute;width:0;height:0;overflow:hidden}
/* svg car effects */
.flm{animation:flm .12s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 50%}
@keyframes flm{to{transform:scaleX(.7)}}
.dring{animation:dring 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes dring{to{transform:rotate(360deg)}}
.smk circle{animation:smk 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.smk circle:nth-child(2){animation-delay:.45s}.smk circle:nth-child(3){animation-delay:.9s}
@keyframes smk{from{transform:translate(0,0) scale(.5);opacity:.85}to{transform:translate(-26px,-10px) scale(2);opacity:0}}
@media (max-width:760px),(orientation:portrait){
 #app{grid-template:"top" auto "pl" auto "board" minmax(0,1fr) "pad" auto / minmax(0,1fr)}
 #pl{flex-direction:row;max-width:100%;padding-top:10px}
 .pc{flex:1 0 128px;grid-template-columns:32px minmax(0,1fr);padding:6px 8px}.pc img{width:32px;height:32px}.pc b{font-size:14px}
 .pill{padding:4px 10px;font-size:13px;min-height:38px}
}
@media (max-height:560px){.key svg{max-height:48px}#pad{padding:6px 10px 8px;gap:4px}#last{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<svg id="meas" aria-hidden="true"></svg>
<div id="app">
  <div id="top">
    <div class="logo disp">Galaxy <span>Raceway</span></div>
    <a class="pill" href="index.html">← LDA Spil</a>
    <button class="pill" id="bSnd" aria-pressed="true">Lyd</button>
    <button class="pill" id="bRules">Regler</button>
    <button class="pill" id="bUndo">Fortryd</button>
    <button class="pill" id="bNew">Nyt løb</button>
  </div>
  <div id="pl"></div>
  <div id="bw"><svg id="bstatic" role="img" aria-label="Spillebrættet set oppefra"></svg><svg id="cars" aria-hidden="true"></svg></div>
  <div id="pad"><div id="last"></div><div id="msg"></div><div id="hint"></div><div class="keys" id="keys"></div></div>
</div>
<div id="banner"><div class="bi"></div><div class="bt disp"></div><div class="bd"></div></div>
<div class="ov" id="setup"><div class="box">
  <h1 class="title disp">Galaxy <span>Raceway</span></h1>
  <p class="sub">Slå med en rigtig terning, og tast slaget ind. Første bil i mål vinder!</p>
  <div class="row"><b>Antal spillere</b><div class="seg" id="seg"><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button></div></div>
  <div id="srows"></div>
  <div class="acts"><a class="btn2" href="index.html">← LDA Spil</a><button class="cta" id="go">Start løbet!</button></div>
</div></div>
<div class="ov" id="rules"><div class="box rules">
  <h2 class="disp" style="margin:0;font-size:30px">Regler</h2>
  <div id="rtxt"></div>
  <h3>Seneste træk</h3><ul id="log"></ul>
  <div class="acts"><button class="cta" id="rclose">Luk</button></div>
</div></div>
<div class="ov" id="win"><div class="box" style="text-align:center">
  <div style="font-size:64px;line-height:1">🏆</div>
  <h2 class="title disp" id="wtxt"></h2>
  <ul class="stand" id="stand"></ul>
  <div class="acts"><button class="btn2" id="wundo">Fortryd</button><button class="btn2" id="wsetup">Skift biler</button><button class="cta" id="again">Nyt løb</button></div>
</div></div>
<div class="ver">Galaxy Raceway · version 5.0</div>
<script>
{
/* ================= data ================= */
const N=60,KEY='lda-galaxy';
const CARS=[{n:'Hajen',def:'Rød',col:'#d0312d',c2:'#f4f4f4',num:7},{n:'Svæveren',def:'Blå',col:'#1d5fd0',c2:'#8fd0ff',num:21},{n:'Jungletrucken',def:'Grøn',col:'#2e7a3c',c2:'#e8c34a',num:4},{n:'Diskobilen',def:'Disko',col:'#7a3cc8',c2:'#f5b829',num:99}];
const EV={
 star:{g:1,ic:'⭐',n:'Stjerne-boost',d:'+1 på alle slag resten af løbet (højst +3).'},
 rocket:{g:1,ic:'🚀',n:'Raket',d:'Slå med 2 terninger i dine næste 2 ture.'},
 dbl:{g:1,ic:'⚡',n:'Dobbelt fart',d:'Dit næste slag tæller dobbelt.'},
 tele:{g:1,ic:'🌀',n:'Teleport',d:'Zap! Du hopper frem til den næste portal.'},
 slide:{g:1,ic:'⏬',n:'Ned ad bakke',d:'Fuld fart ned ad bjerget: 3 felter frem.'},
 wheel:{g:0,ic:'🛞',n:'Hjulet faldt af',d:'Dit næste slag tæller 2 mindre.'},
 mud:{g:0,ic:'🟤',n:'Mudder',d:'Du sidder fast: næste slag rykker du kun 1 felt.'},
 ice:{g:0,ic:'❄️',n:'Glat is',d:'Næste tur skal du slå mindst 3, ellers spinner hjulene.'},
 hole:{g:0,ic:'🕳️',n:'Hul i banen',d:'Du falder tilbage til starten af området.'},
 warn:{g:0,ic:'⚠️',n:'Advarsel',d:'Du står over i din næste tur.'}
};
const BIO=[
 {id:'city',n:'Neonbyen',from:0,g:'#5d6268',acc:'#ff3fa4',ev:[[2,'star'],[4,'dbl']]},
 {id:'desert',n:'Ørkenen',from:8,g:'#d6ad74',acc:'#f5b829',ev:[[1,'wheel'],[3,'tele','lava',3],[5,'rocket'],[6,'warn']]},
 {id:'lava',n:'Lavaland',from:17,g:'#2a2320',acc:'#ff6a1a',ev:[[2,'wheel'],[5,'hole'],[6,'star'],[8,'hole']]},
 {id:'ice',n:'Isbjerget',from:26,g:'#e3ebf1',acc:'#5fc4ff',ev:[[1,'ice'],[3,'rocket'],[5,'ice'],[7,'dbl'],[9,'ice'],[11,'star'],[12,'slide']]},
 {id:'jungle',n:'Junglen',from:40,g:'#2c5427',acc:'#7ad35a',ev:[[1,'mud'],[3,'warn'],[4,'tele','water',3],[6,'mud'],[8,'wheel']]},
 {id:'water',n:'Glastunnelen',from:49,g:'#1d5d88',acc:'#7fe3ff',ev:[[1,'star'],[4,'dbl']]},
 {id:'space',n:'Rummet',from:54,g:'#15161d',acc:'#b48cff',ev:[[1,'rocket'],[2,'wheel'],[4,'hole'],[5,'warn']]}
];
BIO.forEach((b,i)=>b.to=i<BIO.length-1?BIO[i+1].from:N+1);
const FIELDS=[];for(let i=0;i<=N;i++){const bi=BIO.findIndex(b=>i>=b.from&&i<b.to);FIELDS.push({b:bi,ev:null,cp:BIO[bi].from})}
BIO.forEach(b=>b.ev.forEach(([o,e,tb,to])=>{const f=b.from+o;if(f>=b.to||f>=N||f<1)return;FIELDS[f].ev=e;
  if(e==='tele'){const d=BIO.find(x=>x.id===tb).from+to;FIELDS[f].dest=d;FIELDS[d].ev='exit'}}));

/* ================= state ================= */
let S,hist=[],busy=false,mute=false;
const defPlayers=()=>{let nm=[];try{nm=(JSON.parse(localStorage.getItem('lda-spil'))||{}).names||[]}catch(e){}
  return CARS.map((c,i)=>({car:i,name:(nm[i]&&!['Rød','Blå','Grøn','Gul'].includes(nm[i]))?nm[i]:''}))};
const newCar=()=>({pos:0,star:0,rocket:0,dbl:0,wheel:0,mud:0,ice:0,skip:0});
const fresh=(players,n)=>({phase:'setup',n:n||2,players:players||defPlayers(),cars:[0,1,2,3].map(newCar),p:0,d1:null,chains:[],log:[],last:'',win:null});
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.players||S.players.length!==4||!S.cars||!S.chains)S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const snap=()=>{hist.push(JSON.stringify(S));if(hist.length>80)hist.shift()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rawName=i=>(S.players[i].name||'').trim()||CARS[S.players[i].car].def;
const nm=i=>esc(rawName(i));
const col=i=>CARS[S.players[i].car].col;
const log=t=>{S.log.unshift(t);S.log=S.log.slice(0,14)};
const grp=i=>S.chains.find(g=>g.m.includes(i));
const dropGrp=g=>{const k=S.chains.indexOf(g);if(k>=0)S.chains.splice(k,1)};
const names=ids=>ids.map(rawName).join(' og ');
const clone=o=>JSON.parse(JSON.stringify(o));

/* ================= sound ================= */
let AC;
function tone(f,d,type,v,when){if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={step:()=>tone(520,.06,'triangle',.06),
 good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.15,'square',.05,i*.09)),
 bad:()=>[392,330,262,196].forEach((f,i)=>tone(f,.18,'sawtooth',.05,i*.1)),
 crash:()=>{tone(90,.35,'sawtooth',.12);tone(140,.25,'square',.08,.06)},
 zap:()=>[300,600,1200,1800].forEach((f,i)=>tone(f,.08,'sine',.07,i*.05)),
 win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.22,'square',.06,i*.13))};

/* ================= board geometry ================= */
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const LAND=[[150,840],[450,812],[750,844],[1050,810],[1330,832],[1475,750],[1420,650],[1150,615],[850,650],[550,610],[270,642],[125,550],[215,430],[520,400],[820,438],[1120,400],[1400,422],[1485,325],[1400,222],[1110,190],[800,222],[500,184],[230,160]];
const TW=92,HW=TW/2;
let G=null;
function geom(port){
  const W=port?1000:1600,H=port?1600:1000,P=LAND.map(([x,y])=>port?[y,1600-x]:[x,y]);
  let d=`M${P[0][0]} ${P[0][1]}`;
  for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
    d+=`C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6} ${p2[0]} ${p2[1]}`}
  const pe=document.createElementNS(NS,'path');pe.setAttribute('d',d);$('meas').appendChild(pe);
  const tot=pe.getTotalLength(),pts=[];for(let s=0;s<tot;s+=4){const q=pe.getPointAtLength(s);pts.push([q.x,q.y])}
  const q=pe.getPointAtLength(tot);pts.push([q.x,q.y]);pe.remove();
  return {W,H,tot,pts,port,co:pts.filter((_,i)=>i%3===0)}}
function at(s){const p=G.pts,k=Math.max(0,Math.min(p.length-1.001,s/4)),i=Math.floor(k),f=k-i,a=p[i],b=p[i+1];
  const x=a[0]+(b[0]-a[0])*f,y=a[1]+(b[1]-a[1])*f,i0=Math.max(0,i-2),i1=Math.min(p.length-1,i+3);
  let tx=p[i1][0]-p[i0][0],ty=p[i1][1]-p[i0][1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
  return {x,y,tx,ty,nx:-ty,ny:tx}}
const FL=()=>G.tot/(N+1);
const fs=f=>(Math.min(N,Math.max(0,f))+.5)*FL();
const fr=f=>at(fs(f));
const clear=(x,y,r)=>G.co.every(([a,b])=>(a-x)**2+(b-y)**2>(HW+14+r)**2);
const nearField=(x,y)=>{let best=0,bd=1e9;G.co.forEach(([a,b],i)=>{const d=(a-x)**2+(b-y)**2;if(d<bd){bd=d;best=i}});return Math.min(N,Math.max(0,Math.floor(best*12/FL())))};
const F1=v=>v.toFixed(1);

/* ================= drawing helpers ================= */
let seed=1;const R=()=>((seed=(seed*16807)%2147483647)/2147483647);
const pick=a=>a[Math.floor(R()*a.length)];
const blob=(x,y,r,n,j)=>{let d='';for(let k=0;k<n;k++){const a=k/n*6.283,rr=r*(1-j/2+R()*j);d+=(k?'L':'M')+F1(x+Math.cos(a)*rr)+' '+F1(y+Math.sin(a)*rr)}return d+'Z'};
const rock=(x,y,s,c,c2)=>{const d=blob(x,y,s,7,.45);return `<path d="${d}" fill="rgba(0,0,0,.35)" transform="translate(4 5)"/><path d="${d}" fill="${c}" stroke="${c2}" stroke-width="1.5"/><path d="${blob(x-s*.2,y-s*.2,s*.45,6,.4)}" fill="rgba(255,255,255,.14)"/>`};

const pine=(x,y,s)=>`<circle cx="${F1(x+4)}" cy="${F1(y+6)}" r="${F1(s)}" fill="rgba(30,40,50,.35)"/>`+[1,.72,.45].map((k,j)=>{let d='';const n=9;for(let i=0;i<n*2;i++){const a=i/(n*2)*6.283+j*.3,rr=s*k*(i%2?.55:1);d+=(i?'L':'M')+F1(x+Math.cos(a)*rr)+' '+F1(y+Math.sin(a)*rr)}return `<path d="${d}Z" fill="${['#1d4a33','#24583d','#2f6a49'][j]}" stroke="#0f2a1d" stroke-width=".8"/>`}).join('')+`<circle cx="${F1(x-s*.2)}" cy="${F1(y-s*.25)}" r="${F1(s*.22)}" fill="#f4f8fb" opacity=".9"/>`;
const PROP={
 city:(x,y)=>{const w=24+R()*36,h=20+R()*32,a=Math.round(R()*4)*22.5,c=pick(['#8d9199','#a59f94','#6f747c','#b7b1a5','#7c8088','#9a8f86']);
   return `<g transform="translate(${F1(x)} ${F1(y)}) rotate(${a})"><rect x="${F1(-w/2+6)}" y="${F1(-h/2+7)}" width="${F1(w)}" height="${F1(h)}" fill="rgba(0,0,0,.4)"/><rect x="${F1(-w/2)}" y="${F1(-h/2)}" width="${F1(w)}" height="${F1(h)}" fill="${c}" stroke="#2a2c30" stroke-width="1.2"/><rect x="${F1(-w/2+3)}" y="${F1(-h/2+3)}" width="${F1(w-6)}" height="${F1(h-6)}" fill="none" stroke="rgba(255,255,255,.2)"/>${R()<.6?`<rect x="${F1(-w/4)}" y="${F1(-h/4)}" width="9" height="7" fill="#55595f" stroke="#3a3d42"/>`:''}${R()<.4?`<rect x="${F1(w/6)}" y="${F1(h/8)}" width="6" height="6" fill="#4b4f55"/>`:''}${R()<.45?`<rect x="${F1(-w/2)}" y="${F1(h/2-3)}" width="${F1(w)}" height="3" fill="${pick(['#ff3fa4','#35d6ff','#f5b829'])}" filter="url(#glow)"/>`:''}</g>`},
 desert:(x,y)=>{const r=R();if(r<.3)return rock(x,y,8+R()*14,'#a77440','#7a5029');
   if(r<.62)return `<ellipse cx="${F1(x)}" cy="${F1(y)}" rx="${F1(30+R()*34)}" ry="${F1(10+R()*9)}" transform="rotate(${F1(R()*30-15)} ${F1(x)} ${F1(y)})" fill="url(#dune)"/>`;
   if(r<.8)return `<circle cx="${F1(x+3)}" cy="${F1(y+4)}" r="7" fill="rgba(0,0,0,.25)"/><path d="${blob(x,y,7,8,.5)}" fill="#3f7a3a" stroke="#244a22"/><circle cx="${F1(x)}" cy="${F1(y)}" r="2" fill="#e05a6a"/>`;
   return [0,1,2,3].map(()=>`<circle cx="${F1(x+(R()-.5)*14)}" cy="${F1(y+(R()-.5)*14)}" r="${F1(3+R()*3)}" fill="#7d7a44" opacity=".85"/>`).join('')},

   if(r<.75)return `<g transform="translate(${F1(x)} ${F1(y)}) rotate(${F1(R()*360)})"><ellipse rx="7" ry="3.2" fill="${pick(['#ff9a3c','#ffd23f','#ff6fa8'])}"/><path d="M-6 0l-5 -3v6z" fill="${pick(['#ff9a3c','#ffd23f'])}"/></g>`;
   return `<path d="${blob(x,y,8+R()*10,8,.6)}" fill="${pick(['#e8708f','#f29a5a','#c16be0'])}" opacity=".8"/>`},

};

/* ================= static board ================= */
function boardSvg(){
  seed=4711;const W=G.W,H=G.H;let o='';
  const poly=(s0,s1,dd=0)=>{s0=Math.max(0,s0);s1=Math.min(G.tot,s1);const p=[];for(let s=s0;s<s1;s+=8){const a=at(s);p.push(F1(a.x+a.nx*dd)+','+F1(a.y+a.ny*dd))}const a=at(s1);p.push(F1(a.x+a.nx*dd)+','+F1(a.y+a.ny*dd));return p.join(' ')};

   <radialGradient id="dune"><stop offset="0" stop-color="#f3d7a2" stop-opacity=".9"/><stop offset="1" stop-color="#f3d7a2" stop-opacity="0"/></radialGradient>
   <radialGradient id="cr" cx=".6" cy=".6"><stop offset="0" stop-color="#2b2c33"/><stop offset="1" stop-color="#40424b"/></radialGradient>
   <radialGradient id="pl1" cx=".35" cy=".35"><stop offset="0" stop-color="#e9c9a0"/><stop offset=".6" stop-color="#b4805a"/><stop offset="1" stop-color="#5a3a26"/></radialGradient>
   <pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fff"/><rect width="8" height="8" fill="#111"/><rect x="8" y="8" width="8" height="8" fill="#111"/></pattern>
   <marker id="arw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9a8ff"/></marker></defs>`;
  o+=`<rect width="${W}" height="${H}" rx="26" fill="#3d4a35"/>`;

  BIO.forEach((b,i)=>{o+=`<polyline points="${poly(fs(b.from)-FL()*.5-(i?30:260),fs(b.to-1)+FL()*.5+(i<BIO.length-1?30:260))}" fill="none" stroke="${b.g}" stroke-width="250" stroke-linecap="round" stroke-linejoin="round"/>`});
  /* scattered props */
  for(let k=0;k<900;k++){const x=20+R()*(W-40),y=20+R()*(H-40);if(!clear(x,y,14))continue;const b=BIO[FIELDS[nearField(x,y)].b];if(b.id==='space'&&R()<.3){o+=PROP.space(x,y);continue}if(R()<(b.id==='city'?.5:b.id==='jungle'?.75:.55))o+=PROP[b.id](x,y)}
  /* planet in a free corner */
  {const cs=[[W-70,70],[70,70],[W-70,H-70],[70,H-70]].filter(([x,y])=>clear(x,y,50)&&BIO[FIELDS[nearField(x,y)].b].id==='space');if(cs.length){const[x,y]=cs[0];o+=`<circle cx="${x}" cy="${y}" r="44" fill="url(#pl1)"/><ellipse cx="${x}" cy="${y}" rx="68" ry="13" fill="none" stroke="#e9d6b8" stroke-width="5" opacity=".7" transform="rotate(-18 ${x} ${y})"/>`}}
  /* grandstand at the start */
  const gsd=(()=>{const a=fr(1);return clear(a.x-a.nx*(HW+46),a.y-a.ny*(HW+46),20)?-1:1})();
  for(let k=0;k<14;k++){const a=at(fs(0)-FL()*.4+k*24),cx=a.x+gsd*a.nx*(HW+46),cy=a.y+gsd*a.ny*(HW+46),ang=Math.atan2(a.ty,a.tx)*57.3;
    if(!clear(cx,cy,10))continue;o+=`<g transform="translate(${F1(cx)} ${F1(cy)}) rotate(${F1(ang)})"><rect x="-12" y="-18" width="24" height="36" fill="#8d949e" stroke="#4a5058"/>${[-12,-4,4,12].map(yy=>[-7,0,7].map(xx=>`<circle cx="${xx}" cy="${yy}" r="2.2" fill="${pick(['#e5484d','#f5b829','#3e8ef7','#fff','#30a46c'])}"/>`).join('')).join('')}<rect x="-12" y="-20" width="24" height="4" fill="#d0312d"/></g>`}
  /* track */
  const full=poly(0,G.tot);
  o+=`<polyline points="${full}" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="${TW+24}" stroke-linejoin="round" stroke-linecap="round" transform="translate(5 7)"/>`;
  o+=`<polyline points="${full}" fill="none" stroke="#f1f1f1" stroke-width="${TW+14}" stroke-linejoin="round" stroke-linecap="butt"/>`;
  [-1,1].forEach(sd=>o+=`<polyline points="${poly(0,G.tot,sd*(HW+3.5))}" fill="none" stroke="#c8282b" stroke-width="7" stroke-dasharray="14 14"/>`);
  o+=`<polyline points="${full}" fill="none" stroke="#3b3e44" stroke-width="${TW}" stroke-linejoin="round"/>`;
  o+=`<polyline points="${full}" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="${TW*.35}" stroke-linejoin="round"/>`;
  /* fields */
  const edge=(s,dd)=>{const a=at(s);return [a.x+a.nx*dd,a.y+a.ny*dd]};
  const quad=(i,fill)=>{const s0=i*FL(),s1=(i+1)*FL(),m=(s0+s1)/2,p=[edge(s0,HW),edge(m,HW),edge(s1,HW),edge(s1,-HW),edge(m,-HW),edge(s0,-HW)];return `<polygon points="${p.map(q=>q.map(F1).join(',')).join(' ')}" fill="${fill}"/>`};

  for(let i=1;i<N;i++){const a=fr(i);o+=`<text x="${F1(a.x+a.nx*(HW-11))}" y="${F1(a.y+a.ny*(HW-11))}" text-anchor="middle" dominant-baseline="central" font-family="Barlow Condensed,Arial" font-weight="700" font-size="15" fill="#fff" stroke="#16181b" stroke-width="3" paint-order="stroke">${i}</text>`}

    [-1,1].forEach(sd=>o+=`<polyline points="${poly(s0,s1,sd*(HW+16))}" fill="none" stroke="rgba(225,247,255,.75)" stroke-width="3"/>`);
    for(let s=s0;s<=s1;s+=30){const a=edge(s,HW+16),b=edge(s,-HW-16);o+=`<line x1="${F1(a[0])}" y1="${F1(a[1])}" x2="${F1(b[0])}" y2="${F1(b[1])}" stroke="rgba(225,247,255,.4)" stroke-width="2"/>`}}
  /* teleport links */
  for(let i=1;i<N;i++){const f=FIELDS[i];if(f.ev!=='tele')continue;const a=fr(i),b=fr(f.dest),ax=a.x+a.nx*(HW+26),ay=a.y+a.ny*(HW+26),bx=b.x+b.nx*(HW+26),by=b.y+b.ny*(HW+26),mx=(ax+bx)/2+(by-ay)*.25,my=(ay+by)/2-(bx-ax)*.25;
    o+=`<path d="M${F1(ax)} ${F1(ay)}Q${F1(mx)} ${F1(my)} ${F1(bx)} ${F1(by)}" fill="none" stroke="#c9a8ff" stroke-width="4" stroke-dasharray="10 9" opacity=".85" marker-end="url(#arw)"/>`;
    [a,b].forEach(q=>o+=`<circle cx="${F1(q.x)}" cy="${F1(q.y)}" r="34" fill="none" stroke="#b48cff" stroke-width="3" stroke-dasharray="6 6" opacity=".8"/>`)}
  /* event tokens on the verge */
  for(let i=1;i<N;i++){const e=FIELDS[i].ev;if(!e)continue;const a=fr(i),x=a.x+a.nx*(HW+26),y=a.y+a.ny*(HW+26),c=e==='exit'?'#7b4ce0':EV[e].g?'#e9a91b':'#d23b3f';
    o+=`<circle cx="${F1(x+2)}" cy="${F1(y+3)}" r="19" fill="rgba(0,0,0,.4)"/><circle cx="${F1(x)}" cy="${F1(y)}" r="18" fill="${c}" stroke="#fff" stroke-width="3"/><text x="${F1(x)}" y="${F1(y+1)}" text-anchor="middle" dominant-baseline="central" font-size="19">${e==='exit'?'🌀':EV[e].ic}</text>`}
  /* start / finish signs */
  [[0,'START'],[N,'MÅL']].forEach(([i,t])=>{const a=fr(i),x=a.x+a.nx*(HW+40),y=a.y+a.ny*(HW+40),w=t.length*15+24;
    o+=`<rect x="${F1(x-w/2)}" y="${F1(y-15)}" width="${w}" height="30" rx="5" fill="#111" stroke="#fff" stroke-width="2"/><text x="${F1(x)}" y="${F1(y+1)}" text-anchor="middle" dominant-baseline="central" font-family="Barlow Condensed,Arial" font-weight="800" font-style="italic" font-size="22" fill="#fff">${t}</text>`});
  /* area signs */
  BIO.forEach((b,i)=>{if(!i)return;const a=fr(b.from),w=b.n.length*10.5+26,sd=clear(a.x-a.nx*(HW+40),a.y-a.ny*(HW+40),18)?-1:1,x=a.x+sd*a.nx*(HW+(FIELDS[b.from].ev&&sd>0?70:40)),y=a.y+sd*a.ny*(HW+(FIELDS[b.from].ev&&sd>0?70:40));

/* ================= visual state + loop ================= */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,SPD=RM?.35:1;
const Vv=[0,1,2,3].map(()=>({f:0,lat:0,lon:0,tl:0,tn:0,hop:0,sc:1,spin:0,tilt:0,op:1,moving:false,trail:0}));
const tweens=[];
const tw=(ms,fn)=>window.GRFAST?(fn(1),Promise.resolve()):new Promise(r=>tweens.push({t0:performance.now(),ms:Math.max(1,ms*SPD),fn,r}));
const wait=ms=>tw(ms,()=>{});
let shake=0;
function layout(){const by={};
  for(let i=0;i<S.n;i++){const v=Vv[i];if(v.moving){v.tl=0;v.tn=-v.trail*24;continue}const k=Math.round(v.f);(by[k]=by[k]||[]).push(i)}
  for(const k in by){const Ls=by[k],g=S.chains.find(g=>g.m.some(i=>Ls.includes(i)));
    if(g)Ls.sort((a,b)=>{const x=g.m.indexOf(a),y=g.m.indexOf(b);return(x<0?9:x)-(y<0?9:y)});
    const n=Ls.length;Ls.forEach((i,j)=>{let la=0,lo=0;
      if(n===2){if(g&&g.m.includes(Ls[0])&&g.m.includes(Ls[1]))lo=j?-19:19;else la=j?-18:18}
      else if(n>2){la=j%2?-18:18;lo=j<2?20:-20}
      Vv[i].tl=la;Vv[i].tn=lo})}}
function tick(now){requestAnimationFrame(tick);
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i],k=Math.min(1,(now-t.t0)/t.ms);t.fn(k);if(k>=1){tweens.splice(i,1);t.r()}}
  if(!G||!CEL.length)return;
  const race=S.phase==='race';if(race)layout();
  const pos=[];
  for(let i=0;i<4;i++){const el=CEL[i],v=Vv[i];const show=i<S.n;el.style.display=show?'':'none';if(!show)continue;
    v.lat+=(v.tl-v.lat)*.2;v.lon+=(v.tn-v.lon)*.2;const a=fr(v.f),x=a.x+a.nx*v.lat+a.tx*v.lon,y=a.y+a.ny*v.lat+a.ty*v.lon;pos[i]=[x,y];
    const ang=Math.atan2(a.ty,a.tx)*57.2958+v.spin*57.2958+v.tilt,s=Math.max(.001,v.sc)*(1+v.hop*.3)*1.22;
    el.setAttribute('transform',`translate(${F1(x)} ${F1(y)})`);el.style.opacity=v.op;
    el._b.setAttribute('transform',`rotate(${F1(ang)}) scale(${s.toFixed(3)})`);
    el._sh.setAttribute('transform',`translate(${F1(3+v.hop*14)} ${F1(5+v.hop*14)}) rotate(${F1(ang)}) scale(${(s*(1-v.hop*.15)).toFixed(3)})`)}
  for(let i=0;i<4;i++)if(i===S.p&&CEL[i].parentNode.lastChild!==CEL[i]&&Vv[i].moving)CEL[i].parentNode.appendChild(CEL[i]);
  chainEl.forEach((t,k)=>{const g=race&&S.chains[k];t.style.display=g?'':'none';if(g){let x=0,y=0;g.m.forEach(i=>{x+=pos[i][0];y+=pos[i][1]});t.setAttribute('x',F1(x/g.m.length));t.setAttribute('y',F1(y/g.m.length-26+Math.sin(now/250)*3))}});
  const bw=$('bw');if(shake>0){shake-=.016;bw.style.transform=`translate(${F1((Math.random()-.5)*shake*24)}px,${F1((Math.random()-.5)*shake*24)}px)`}else if(bw.style.transform)bw.style.transform=''}
function build(force){const r=$('bw').getBoundingClientRect();if(r.width<10||r.height<10)return;const port=r.height>r.width*1.05;
  if(G&&G.port===port&&!force)return;G=geom(port);const vb=`0 0 ${G.W} ${G.H}`;$('bstatic').setAttribute('viewBox',vb);$('cars').setAttribute('viewBox',vb);
  $('bstatic').innerHTML=boardSvg();if(!CEL.length)buildCars()}
new ResizeObserver(()=>build()).observe($('bw'));

function syncMods(st){for(let i=0;i<4;i++){const g=CEL[i];if(!g||!g._b)continue;const c=st[i],on=i<S.n,sh=(cls,v)=>g.querySelectorAll('.'+cls).forEach(e=>e.style.display=on&&v?'':'none');
  sh('rk',c.rocket>0);sh('ic',c.ice);sh('md',c.mud);sh('dbl',c.dbl);sh('smk',c.wheel);Vv[i].tilt=c.wheel?9:0;
  g._t.textContent=on?'⭐'.repeat(c.star)+(c.skip?'💤':''):''}}
function syncAll(){for(let i=0;i<4;i++){const v=Vv[i];v.f=S.cars[i].pos;v.moving=false;v.hop=v.spin=0;v.sc=1;v.op=1}syncMods(S.cars)}

/* ================= banner ================= */
const bn=$('banner');
async function banner(ic,t,d,good,ms){bn.className=good?'g':'b';bn.children[0].textContent=ic;bn.children[1].textContent=t;bn.children[2].textContent=d;bn.children[2].style.display=d?'':'none';
  void bn.offsetWidth;bn.classList.add('show');await wait(ms||1700);bn.classList.remove('show')}

/* ================= animations ================= */
async function play(A){
  for(const a of A){
    if(a.t==='move'){const n=a.to-a.from;if(!n){await wait(400);continue}
      a.ids.forEach((i,k)=>{Vv[i].moving=true;Vv[i].trail=k});const ms=Math.max(160,Math.min(300,1700/n));
      for(let k=a.from;k<a.to;k++){sfx.step();await tw(ms,x=>a.ids.forEach(i=>{Vv[i].f=k+x;Vv[i].hop=Math.sin(x*Math.PI)*.7}))}
      a.ids.forEach(i=>{Vv[i].moving=false;Vv[i].hop=0;Vv[i].f=a.to})}
    else if(a.t==='sync')syncMods(a.st);
    else if(a.t==='ev'){const e=EV[a.e];(e.g?sfx.good:sfx.bad)();if(!e.g)shake=.3;await banner(e.ic,e.n+'!',e.d+(a.ids.length>1?' Det gælder hele klyngen!':''),e.g)}
    else if(a.t==='jump'){const ids=a.ids;
      if(a.style==='slide'){sfx.zap();await tw(900,x=>ids.forEach(i=>Vv[i].f=a.from+(a.to-a.from)*(1-(1-x)*(1-x))))}
      else if(a.style==='tele'){sfx.zap();await tw(450,x=>ids.forEach(i=>{Vv[i].sc=1-x;Vv[i].spin=x*10;Vv[i].op=1-x}));ids.forEach(i=>Vv[i].f=a.to);await wait(400);sfx.zap();await tw(450,x=>ids.forEach(i=>{Vv[i].sc=x;Vv[i].spin=(1-x)*10;Vv[i].op=x}))}
      else{await tw(600,x=>ids.forEach(i=>{Vv[i].sc=1-x*.85;Vv[i].spin=x*6;Vv[i].op=1-x*.8}));ids.forEach(i=>Vv[i].f=a.to);await wait(350);await tw(450,x=>ids.forEach(i=>{Vv[i].sc=.15+x*.85;Vv[i].spin=0;Vv[i].op=.2+x*.8;Vv[i].hop=Math.sin(x*Math.PI)*.6}))}
      ids.forEach(i=>{Vv[i].f=a.to;Vv[i].sc=1;Vv[i].spin=0;Vv[i].op=1;Vv[i].hop=0})}
    else if(a.t==='crash'){sfx.crash();shake=.55;await banner('💥','Krasj!',a.txt,false,1900)}
    else if(a.t==='free')await banner('🔓','Fri igen!',a.txt,true,1300);
    else if(a.t==='skip')await banner('💤','Står over',a.txt,false,1300);
    else if(a.t==='win'){sfx.win();await wait(700)}
  }}

/* ================= rules engine ================= */
function fieldEvent(at,ids,A){const f=FIELDS[at],e=f.ev;if(!e||e==='exit')return;
  ids.forEach(i=>{const c=S.cars[i];if(e==='star')c.star=Math.min(3,c.star+1);else if(e==='rocket')c.rocket=2;else if(e==='dbl')c.dbl=1;else if(e==='wheel')c.wheel=1;else if(e==='mud')c.mud=1;else if(e==='ice')c.ice=1;else if(e==='warn')c.skip=1});
  A.push({t:'ev',e,ids:ids.slice()},{t:'sync',st:clone(S.cars)});log(`${names(ids)}: ${EV[e].n} på felt ${at}.`);
  let dest=null;if(e==='tele')dest=f.dest;else if(e==='slide')dest=Math.min(N-1,at+3);else if(e==='hole')dest=f.cp;
  if(dest!==null){ids.forEach(i=>S.cars[i].pos=dest);A.push({t:'jump',ids:ids.slice(),from:at,to:dest,style:e})}
  return EV[e]}
function advance(A){for(let k=0;k<12;k++){S.p=(S.p+1)%S.n;const c=S.cars[S.p];if(!c.skip)return;
  c.skip--;log(`${rawName(S.p)} står over.`);A.push({t:'sync',st:clone(S.cars)},{t:'skip',txt:`${rawName(S.p)} står over denne tur.`});
  const g=grp(S.p);if(g&&g.br===S.p){dropGrp(g);A.push({t:'free',txt:`${names(g.m)} hænger ikke sammen længere.`})}}}
async function roll(v){
  if(busy||S.win!==null||S.phase!=='race')return;snap();
  const p=S.p,c=S.cars[p];
  if(c.rocket>0&&S.d1===null){S.d1=v;save();hud();return}
  const two=S.d1!==null,base=two?S.d1+v:v;S.d1=null;
  let steps=base;const why=[];
  if(c.ice&&base<3){steps=0;why.push('hjulene spinner på isen')}
  if(steps>0){if(c.mud){steps=1;why.push('mudder')}else{if(c.dbl){steps*=2;why.push('dobbelt fart')}if(c.star){steps+=c.star;why.push('+'+c.star+' stjerne')}if(c.wheel){steps=Math.max(0,steps-2);why.push('hjul af −2')}}}
  c.ice=c.mud=c.dbl=c.wheel=0;if(two)c.rocket--;
  const A=[],g=grp(p),ids=g?g.m.slice():[p],from=c.pos,to=Math.min(N,from+steps);
  ids.forEach(i=>S.cars[i].pos=to);
  const rolled=two?`${base} (to terninger)`:String(base);
  S.last=`${rawName(p)} slog ${rolled} og ${to-from?`rykkede ${to-from} felt${to-from===1?'':'er'}`:'blev stående'}${why.length?' ('+why.join(', ')+')':''}.`;log(S.last);
  A.push({t:'move',ids,from,to},{t:'sync',st:clone(S.cars)});
  if(to>=N){S.win=ids[0];log(`${rawName(S.win)} vinder løbet!`);A.push({t:'win'})}
  else{
    if(to>from){const e=fieldEvent(to,ids,A);if(e)S.last+=` ${e.ic} ${e.n}!`}
    if(g&&g.br===p){dropGrp(g);A.push({t:'free',txt:`${names(g.m)} hænger ikke sammen længere.`})}
    const f=S.cars[p].pos,others=[];for(let j=0;j<S.n;j++)if(!ids.includes(j)&&S.cars[j].pos===f)others.push(j);
    if(f>0&&others.length){const m=[];others.forEach(j=>{const og=grp(j);if(og){og.m.forEach(k=>m.includes(k)||m.push(k));dropGrp(og)}else if(!m.includes(j))m.push(j)});
      const mg=grp(p);if(mg)dropGrp(mg);const front=m.slice();ids.forEach(k=>m.includes(k)||m.push(k));S.chains.push({m,br:p});
      const txt=`${names(ids)} hænger fast bag ${names(front)}. De følges ad i én runde og deler alt!`;log(`Krasj på felt ${f}: ${txt}`);S.last+=' 💥 Krasj!';A.push({t:'crash',txt})}
    advance(A)}
  save();busy=true;padLock(S.last);
  await play(A);busy=false;syncAll();hud()}

/* ================= HUD ================= */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const dieSvg=v=>`<svg viewBox="0 0 60 60" aria-hidden="true"><defs><linearGradient id="dg${v}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dde3"/></linearGradient></defs><rect x="3" y="3" width="54" height="54" rx="11" fill="url(#dg${v})" stroke="#9aa1ab" stroke-width="1.5"/>${PIPS[v].map(k=>`<circle cx="${16+(k%3)*14}" cy="${16+Math.floor(k/3)*14}" r="5" fill="#16181b"/>`).join('')}</svg>`;

function modChips(c,i){const o=[];if(c.star)o.push(['⭐ +'+c.star,1]);if(c.rocket)o.push([`🚀 2 terninger (${c.rocket} tur${c.rocket>1?'e':''})`,1]);if(c.dbl)o.push(['⚡ ×2',1]);
  if(c.wheel)o.push(['🛞 −2',0]);if(c.mud)o.push(['🟤 kun 1 felt',0]);if(c.ice)o.push(['❄️ slå 3+',0]);if(c.skip)o.push(['💤 står over',0]);if(grp(i))o.push(['🔗 hænger fast',0]);
  return o.map(([t,g])=>`<span class="mod${g?'':' b'}">${t}</span>`).join('')}
function padLock(t){$('last').textContent='';$('msg').textContent=t;$('hint').textContent='';document.querySelectorAll('.key').forEach(b=>b.disabled=true);$('bUndo').disabled=true}
function hud(){
  const race=S.phase==='race';$('setup').classList.toggle('show',!race);$('pad').hidden=!race;$('pl').hidden=!race;
  ['bUndo','bNew'].forEach(id=>$(id).style.display=race?'':'none');

  if(CEL.length)syncMods(S.cars);

  $('pl').innerHTML=Array.from({length:S.n},(_,i)=>{const c=S.cars[i];return `<div class="pc${i===S.p&&S.win===null?' on':''}" style="--c:${col(i)}"><img src="${AV[S.players[i].car]}" alt=""><b>${nm(i)}</b><small>Felt ${c.pos} af ${N} · ${BIO[FIELDS[c.pos].b].n}</small><div class="pbar"><i style="width:${c.pos/N*100}%"></i></div><div class="mods">${modChips(c,i)}</div></div>`}).join('');
  const p=S.p,c=S.cars[p],pad=$('pad');pad.style.setProperty('--c',col(p));
  $('last').textContent=S.last;
  $('msg').innerHTML=S.win!==null?`<b>${nm(S.win)}</b> har vundet!`:S.d1!==null?`<b>${nm(p)}</b>: første terning var ${S.d1}. Tast den anden terning.`:c.rocket>0?`<b>${nm(p)}</b>: slå 2 terninger, og tast den første.`:`<b>${nm(p)}</b>: slå terningen, og tast slaget.`;
  const h=[];if(c.ice)h.push('❄️ under 3 = du bliver stående');if(c.mud)h.push('🟤 du rykker kun 1 felt');else{if(c.dbl)h.push('⚡ slaget tæller dobbelt');if(c.star)h.push('⭐ +'+c.star);if(c.wheel)h.push('🛞 −2')}
  const g=grp(p);if(g)h.push('🔗 hele klyngen rykker med');
  $('hint').textContent=S.win!==null?'':h.join(' · ');
  document.querySelectorAll('.key').forEach(b=>b.disabled=S.win!==null);
  $('bUndo').disabled=!hist.length;
  $('log').innerHTML=S.log.map(t=>`<li>${esc(t)}</li>`).join('')||'<li>Ingen træk endnu.</li>';
  const w=$('win');if(S.win!==null){$('wtxt').innerHTML=`<span style="color:${col(S.win)}">${nm(S.win)}</span> vinder!`;
    const ord=Array.from({length:S.n},(_,i)=>i).sort((a,b)=>(b===S.win)-(a===S.win)||S.cars[b].pos-S.cars[a].pos);
    $('stand').innerHTML=ord.map((i,k)=>`<li><span>${k+1}.</span><img src="${AV[S.players[i].car]}" alt=""><span>${nm(i)}</span><span style="margin-left:auto;color:var(--soft)">felt ${S.cars[i].pos}</span></li>`).join('');
    if(!w.classList.contains('show')){w.classList.add('show');confetti()}}else w.classList.remove('show')}
function confetti(){if(RM)return;const em=['🏁','🏆','✨','🎉'];for(let i=0;i<30;i++){const s=document.createElement('span');s.className='conf';s.textContent=em[i%4];s.style.left=Math.random()*100+'vw';s.style.animationDuration=2+Math.random()*2.5+'s';s.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),6000)}}
function setupUI(){
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===S.n));
  $('srows').innerHTML=Array.from({length:S.n},(_,i)=>{const pc=S.players[i].car;return `<div class="srow" style="--c:${CARS[pc].col}"><input data-i="${i}" maxlength="14" value="${esc(S.players[i].name)}" placeholder="${CARS[pc].def}" aria-label="Navn på spiller ${i+1}">
   <div class="pick">${CARS.map((c,k)=>`<button data-i="${i}" data-k="${k}" style="--k:${c.col}" aria-pressed="${k===pc}" aria-label="${c.n}" title="${c.n}"><img src="${AV[k]}" alt=""></button>`).join('')}</div></div>`}).join('')}
function startRace(){hist=[];const pl=S.players,n=S.n;S=fresh(pl,n);S.phase='race';S.last='Løbet er i gang!';save();if(CEL.length)paintCars();syncAll();hud()}
