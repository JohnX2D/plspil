<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0624">
<title>Galaxy Raceway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0624;--panel:rgba(16,12,52,.88);--line:#3a2f8f;--ink:#fff;--soft:#b9b3e6;--gold:#ffc23a;--bad:#ff4b4b;--good:#35d07f;
--c0:#ff3b30;--c1:#2f8bff;--c2:#35b34a;--c3:#b44dff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 Poppins,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.disp{font-family:"Lilita One",Poppins,sans-serif;font-weight:400;letter-spacing:.5px}
#hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template:"top top" auto "pl ." minmax(0,1fr) "pad pad" auto / minmax(190px,250px) minmax(0,1fr);gap:10px;
 padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#hud[hidden]{display:none}
#hud>*{pointer-events:auto}
#top{grid-area:top;display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}
#top>*{pointer-events:auto}
.logo{font-size:clamp(20px,3vw,30px);line-height:1;margin-right:auto;text-shadow:0 3px 0 #000;white-space:nowrap}
.logo i{font-style:normal}
.pill{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;min-height:42px;font-weight:700;font-size:14px;text-decoration:none;color:#fff;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(6px)}
.pill[aria-pressed=true]{background:#fff;color:#0b0624;border-color:#fff}
.pill:disabled{opacity:.4}
#pl{grid-area:pl;display:flex;flex-direction:column;gap:8px;overflow:auto;align-self:start;max-height:100%}
.pc{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:8px 10px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 8px;align-items:center;backdrop-filter:blur(6px);position:relative}
.pc.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent),0 0 22px color-mix(in srgb,var(--c) 60%,transparent)}
.pc.on::after{content:"Din tur";position:absolute;top:-11px;right:10px;background:var(--c);color:#fff;font-size:12px;font-weight:800;padding:1px 10px;border-radius:99px}
.pc img{width:52px;height:52px;grid-row:span 2;border-radius:12px;background:color-mix(in srgb,var(--c) 30%,#0b0624)}
.pc b{font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc small{color:var(--soft);font-weight:600;font-size:12px}
.pbar{grid-column:1/-1;height:9px;border-radius:9px;background:#0b0624;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .5s}
.mods{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mod{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;background:#0b0624;border:2px solid var(--good)}
.mod.b{border-color:var(--bad)}
#pad{grid-area:pad;justify-self:center;width:min(100%,640px);background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:10px 12px 12px;backdrop-filter:blur(6px);display:grid;gap:8px}
#pad.on{border-color:var(--c)}
#last{font-size:13px;font-weight:600;color:var(--soft);text-align:center;min-height:18px}
#msg{font-size:clamp(16px,2.4vw,20px);font-weight:800;text-align:center;line-height:1.2}
#msg b{color:var(--c);filter:brightness(1.35)}
#hint{font-size:13px;font-weight:700;text-align:center;color:var(--gold);min-height:18px}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.key{border:0;background:transparent;padding:0;border-radius:14px;transition:transform .1s}
.key svg{display:block;width:100%;height:auto;max-height:76px;filter:drop-shadow(0 4px 0 #000)}
.key:active{transform:translateY(3px) scale(.96)}
.key:disabled{opacity:.35}
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;text-align:center;display:none;width:min(92vw,520px)}
#banner.show{display:block;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
#banner .bi{font-size:clamp(54px,10vw,88px);line-height:1;filter:drop-shadow(0 5px 0 #000)}
#banner .bt{font-size:clamp(28px,6vw,48px);line-height:1.05;-webkit-text-stroke:2px #0b0624;paint-order:stroke;text-shadow:0 5px 0 #0b0624}
#banner.g .bt{color:var(--gold)}#banner.b .bt{color:#ff6b5e}
#banner .bd{display:inline-block;margin-top:8px;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:6px 14px;font-weight:700;font-size:clamp(14px,2.4vw,18px)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}}
.ov{position:fixed;inset:0;z-index:10;background:rgba(6,3,24,.82);backdrop-filter:blur(8px);display:none;overflow:auto;padding:16px}
.ov.show{display:grid;place-items:center}
.box{background:#120d3d;border:4px solid var(--line);border-radius:26px;padding:clamp(16px,3vw,28px);width:min(100%,720px);box-shadow:0 10px 0 #05031a}
.title{font-size:clamp(34px,8vw,64px);line-height:.95;text-align:center;margin:0 0 4px;-webkit-text-stroke:2px #0b0624;paint-order:stroke;text-shadow:0 5px 0 #05031a}
.title i{font-style:normal}
.sub{text-align:center;color:var(--soft);font-weight:600;margin:0 0 16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.seg{display:flex;border:3px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{min-width:52px;min-height:44px;border:0;background:#0b0624;font-weight:800;font-size:18px}
.seg button+button{border-left:3px solid var(--line)}
.seg button[aria-pressed=true]{background:#fff;color:#0b0624}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:#0b0624;border:3px solid var(--c);border-radius:18px;padding:8px 10px;margin:8px 0}
.srow input{font:800 18px Poppins,sans-serif;color:#fff;background:transparent;border:0;border-bottom:2px dashed var(--c);padding:6px 4px;width:100%}
.pick{display:flex;gap:6px}
.pick button{width:58px;height:58px;border-radius:14px;border:3px solid transparent;background:#1b1557;padding:0;overflow:hidden}
.pick button img{width:100%;height:100%;display:block}
.pick button[aria-pressed=true]{border-color:#fff;background:var(--k)}
.pick button.taken{opacity:.35}
.cta{border:0;border-radius:16px;background:var(--gold);color:#0b0624;font-weight:800;font-size:20px;padding:12px 26px;min-height:54px;box-shadow:0 5px 0 #a8740a}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #a8740a}
.btn2{border:3px solid var(--line);border-radius:16px;background:#0b0624;font-weight:800;font-size:16px;padding:10px 18px;min-height:54px}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.rules h3{margin:14px 0 6px;font-size:16px;color:var(--gold)}
.rules ul{margin:0;padding-left:20px}.rules li{margin:3px 0}
.rules .ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px;list-style:none;padding:0}
.rules .ev li{background:#0b0624;border-left:5px solid var(--good);border-radius:10px;padding:6px 10px}
.rules .ev li.b{border-color:var(--bad)}
#log{list-style:none;padding:0;margin:0;color:var(--soft);font-size:14px}
.stand{list-style:none;padding:0;margin:14px auto 0;max-width:340px}
.stand li{display:flex;align-items:center;gap:10px;font-weight:700;padding:4px 0}
.stand img{width:44px;height:44px}
.conf{position:fixed;top:-40px;z-index:11;font-size:28px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.ver{position:fixed;right:10px;bottom:4px;font-size:11px;color:var(--soft);opacity:.7;pointer-events:none}
#err{display:none;position:fixed;inset:0;place-items:center;padding:24px;text-align:center;font-weight:700}
@media (max-width:760px),(orientation:portrait){
 #hud{grid-template:"top" auto "pl" auto "." minmax(0,1fr) "pad" auto / minmax(0,1fr)}
 #pl{flex-direction:row;max-width:100%}
 .pc{flex:1 0 132px;grid-template-columns:36px minmax(0,1fr);padding:6px 8px}.pc img{width:36px;height:36px}.pc b{font-size:14px}
 .pill{padding:4px 10px;font-size:13px;min-height:38px}
}
@media (max-height:560px){.key svg{max-height:52px}#pad{padding:6px 10px 8px;gap:4px}#last{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="err">Galaxy Raceway kræver 3D-grafik (WebGL), og det kunne ikke startes i denne browser.</div>
<div id="hud" hidden>
  <div id="top">
    <div class="logo disp" id="logo"></div>
    <a class="pill" href="index.html">← LDA Spil</a>
    <button class="pill" id="bOver" aria-pressed="false">Oversigt</button>
    <button class="pill" id="bSnd" aria-pressed="true">Lyd</button>
    <button class="pill" id="bRules">Regler</button>
    <button class="pill" id="bUndo">Fortryd</button>
    <button class="pill" id="bNew">Nyt løb</button>
  </div>
  <div id="pl"></div>
  <div id="pad"><div id="last"></div><div id="msg"></div><div id="hint"></div><div class="keys" id="keys"></div></div>
</div>
<div id="banner"><div class="bi"></div><div class="bt disp"></div><div class="bd"></div></div>
<div class="ov" id="setup"><div class="box">
  <h1 class="title disp" id="stitle"></h1>
  <p class="sub">Slå med en rigtig terning, og tast slaget ind. Første bil i mål vinder!</p>
  <div class="row"><b>Antal spillere</b><div class="seg" id="seg"><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button></div></div>
  <div id="srows"></div>
  <div class="acts"><a class="btn2" href="index.html" style="text-decoration:none;color:#fff;display:inline-flex;align-items:center">← LDA Spil</a><button class="cta" id="go">Start løbet!</button></div>
</div></div>
<div class="ov" id="rules"><div class="box rules">
  <h2 class="disp" style="margin:0;font-size:30px">Regler</h2>
  <div id="rtxt"></div>
  <h3>Seneste træk</h3><ul id="log"></ul>
  <div class="acts"><button class="cta" id="rclose">Luk</button></div>
</div></div>
<div class="ov" id="win"><div class="box" style="text-align:center">
  <div style="font-size:70px;line-height:1">🏆</div>
  <h2 class="title disp" id="wtxt"></h2>
  <ul class="stand" id="stand"></ul>
  <div class="acts"><button class="btn2" id="wundo">Fortryd</button><button class="btn2" id="wsetup">Skift biler</button><button class="cta" id="again">Nyt løb</button></div>
</div></div>
<div class="ver">Galaxy Raceway · version 4.0</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
/* ================= data ================= */
const N=60,KEY='lda-galaxy';
const CARS=[{n:'Hajen',def:'Rød',col:'#ff3b30'},{n:'Svæveren',def:'Blå',col:'#2f8bff'},{n:'Jungletrucken',def:'Grøn',col:'#35b34a'},{n:'Diskobilen',def:'Disko',col:'#b44dff'}];
const EV={
 star:{g:1,ic:'⭐',n:'Stjerne-boost',d:'+1 på alle slag resten af løbet (højst +3).'},
 rocket:{g:1,ic:'🚀',n:'Raket',d:'Slå med 2 terninger i dine næste 2 ture.'},
 dbl:{g:1,ic:'⚡',n:'Dobbelt fart',d:'Dit næste slag tæller dobbelt.'},
 tele:{g:1,ic:'🌀',n:'Teleport',d:'Zap! Du hopper frem til den næste portal.'},
 slide:{g:1,ic:'⏬',n:'Ned ad bakke',d:'Fuld fart ned ad bjerget: 3 felter frem.'},
 wheel:{g:0,ic:'🛞',n:'Hjulet faldt af',d:'Dit næste slag tæller 2 mindre.'},
 mud:{g:0,ic:'🟤',n:'Mudder',d:'Du sidder fast: næste slag rykker du kun 1 felt.'},
 ice:{g:0,ic:'❄️',n:'Glat is',d:'Næste tur skal du slå mindst 3, ellers spinner hjulene.'},
 hole:{g:0,ic:'🕳️',n:'Hul i banen',d:'Du falder tilbage til starten af området.'},
 warn:{g:0,ic:'⚠️',n:'Advarsel',d:'Du står over i din næste tur.'}
};
/* control points: x, z, height */
const CP=[[-42,-20,0],[-32,-22,0],[-22,-19,0],[-12,-23,0],[-2,-20,0],[6,-23,0],[16,-20,0],[26,-22,0],[36,-18,0],[40,-9,0],[34,-2,0],[24,-3,0],
 [14,3,.6],[4,5,1.2],[-3,-2,2.6],[4,-9,4],[11,-2,5.4],[8,6,6],[2,11,5],[-4,13,2.5],[-13,11,.4],[-22,8,0],[-31,11,0],[-38,17,0],[-33,24,0],
 [-23,26,-1.5],[-11,24,-2],[1,26,-1.5],[11,24,.5],[21,27,2],[30,24,3],[38,17,3.5],[33,9,4]];
const BIO=[
 {id:'city',n:'🌆 Neonbyen',cp:0,tile:0x7d6bff,rail:0xff4fd8,ground:0x1c1650,ev:[[2,'star'],[4,'dbl']]},
 {id:'desert',n:'🌵 Ørkenen',cp:3,tile:0xf0c27a,rail:0xffd34d,ground:0xd9a45b,ev:[[1,'wheel'],[3,'tele','lava',3],[5,'rocket'],[6,'warn']]},
 {id:'lava',n:'🌋 Lavaland',cp:7,tile:0xb0503a,rail:0xff7a1a,ground:0x3a1410,ev:[[2,'wheel'],[5,'hole'],[6,'star'],[8,'hole']]},
 {id:'ice',n:'🏔️ Isbjerget',cp:12,tile:0xc9ecff,rail:0x6fd3ff,ground:0xe4f3ff,ev:[[1,'ice'],[3,'rocket'],[5,'ice'],[7,'dbl'],[9,'ice'],[11,'star'],[12,'slide']]},
 {id:'jungle',n:'🌴 Junglen',cp:20,tile:0x9cc45a,rail:0x8cff5a,ground:0x2f7d3a,ev:[[1,'mud'],[3,'warn'],[4,'tele','water',3],[6,'mud'],[8,'wheel']]},
 {id:'water',n:'🐠 Glastunnelen',cp:25,tile:0x5fd0f0,rail:0x7af3ff,ground:0x0b5fa8,ev:[[1,'star'],[4,'dbl']]},
 {id:'space',n:'🪐 Rummet',cp:28,tile:0xa57bff,rail:0xe07dff,ground:0x3a1d7a,ev:[[1,'rocket'],[2,'wheel'],[4,'hole'],[5,'warn'],[6,'hole']]}
];

/* ================= state ================= */
let S,hist=[],busy=false,mute=false;
const defPlayers=()=>{let nm=[];try{nm=(JSON.parse(localStorage.getItem('lda-spil'))||{}).names||[]}catch(e){}
  return CARS.map((c,i)=>({car:i,name:(nm[i]&&!['Rød','Blå','Grøn','Gul'].includes(nm[i]))?nm[i]:''}))};
const newCar=()=>({pos:0,star:0,rocket:0,dbl:0,wheel:0,mud:0,ice:0,skip:0});
const fresh=(players,n)=>({phase:'setup',n:n||2,players:players||defPlayers(),cars:[0,1,2,3].map(newCar),p:0,d1:null,chains:[],log:[],last:'',win:null});
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.players||S.players.length!==4||!S.cars||!S.chains)S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const snap=()=>{hist.push(JSON.stringify(S));if(hist.length>80)hist.shift()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rawName=i=>(S.players[i].name||'').trim()||CARS[S.players[i].car].def;
const nm=i=>esc(rawName(i));
const col=i=>CARS[S.players[i].car].col;
const log=t=>{S.log.unshift(t);S.log=S.log.slice(0,14)};
const grp=i=>S.chains.find(g=>g.m.includes(i));
const dropGrp=g=>{const k=S.chains.indexOf(g);if(k>=0)S.chains.splice(k,1)};
const names=ids=>ids.map(rawName).join(' og ');
const clone=o=>JSON.parse(JSON.stringify(o));

/* ================= sound ================= */
let AC;
function tone(f,d,type,v,when){if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={step:()=>tone(520,.06,'triangle',.06),
 good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.15,'square',.05,i*.09)),
 bad:()=>[392,330,262,196].forEach((f,i)=>tone(f,.18,'sawtooth',.05,i*.1)),
 crash:()=>{tone(90,.35,'sawtooth',.12);tone(140,.25,'square',.08,.06)},
 zap:()=>[300,600,1200,1800].forEach((f,i)=>tone(f,.08,'sine',.07,i*.05)),
 win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.22,'square',.06,i*.13))};

/* ================= 3D ================= */
const $=id=>document.getElementById(id);
const T=window.THREE;let renderer;
try{if(!T)throw 0;renderer=new T.WebGLRenderer({canvas:$('gl'),antialias:true})}catch(e){$('err').style.display='grid'}
if(renderer){
const V3=T.Vector3,UP=new V3(0,1,0);
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new T.Scene();scene.background=new T.Color(0x0b0624);
const camera=new T.PerspectiveCamera(45,1,.5,900);
scene.add(new T.HemisphereLight(0xffffff,0x5a4a9a,1.0));
const sun=new T.DirectionalLight(0xffffff,.75);sun.position.set(20,50,35);scene.add(sun);
let seed=4711;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
const L=(c,o)=>new T.MeshLambertMaterial(Object.assign({color:c},o||{}));
const B=(c,o)=>new T.MeshBasicMaterial(Object.assign({color:c},o||{}));
const mk=(g,m,x,y,z,par)=>{const o=new T.Mesh(g,m);o.position.set(x||0,y||0,z||0);if(par)par.add(o);return o};
const SPH=new T.SphereGeometry(1,20,14),BOX=new T.BoxGeometry(1,1,1),CYL=new T.CylinderGeometry(1,1,1,16),CONE=new T.ConeGeometry(1,1,12),DOD=new T.DodecahedronGeometry(1,0),OCT=new T.OctahedronGeometry(1,0);
const sc=(o,x,y,z)=>{o.scale.set(x,y===undefined?x:y,z===undefined?x:z);return o};

/* ---- track curve ---- */
const curve=new T.CatmullRomCurve3(CP.map(p=>new V3(p[0],p[2],p[1])),false,'centripetal');
curve.arcLengthDivisions=1600;
const LEN=curve.getLengths(1600),TOT=LEN[1600],GAP=TOT/N;
const cpField=k=>Math.round(LEN[Math.round(k/(CP.length-1)*1600)]/TOT*N);
BIO.forEach((b,i)=>b.from=i?cpField(b.cp):0);BIO.forEach((b,i)=>b.to=i<BIO.length-1?BIO[i+1].from:N+1);
const FIELDS=[];for(let i=0;i<=N;i++){const bi=BIO.findIndex(b=>i>=b.from&&i<b.to);FIELDS.push({b:bi,ev:null,cp:BIO[bi].from})}
BIO.forEach(b=>b.ev.forEach(([o,e,tb,to])=>{const f=b.from+o;if(f>=b.to||f>=N||f<1)return;FIELDS[f].ev=e;
  if(e==='tele'){const d=BIO.find(x=>x.id===tb).from+to;FIELDS[f].dest=d;FIELDS[d].ev='exit'}}));
const RING=BIO[6].from+2.5;
function frame(f){const u=Math.min(1,Math.max(0,f/N)),p=curve.getPointAt(u),t=curve.getTangentAt(u),s=new V3().crossVectors(UP,t).normalize(),n=new V3().crossVectors(t,s);return{p,t,s,n}}
const FR=[];for(let i=0;i<=N;i++)FR.push(frame(i));
const mat4=new T.Matrix4();
const orient=(o,F)=>{mat4.makeBasis(F.s,F.n,F.t);o.quaternion.setFromRotationMatrix(mat4)};

function ribbon(f0,f1,hw,off,yf,mat){const n=Math.max(6,Math.ceil((f1-f0)*8)),pos=[],idx=[];
  for(let i=0;i<=n;i++){const F=frame(f0+(f1-f0)*i/n),s=new V3(F.s.x,0,F.s.z).normalize(),y=yf(F.p.y);

const tweens=[];

let overDist=110;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  const tv=Math.tan(camera.fov*Math.PI/360);overDist=Math.max(54/(tv*camera.aspect),50/tv)}
addEventListener('resize',resize);resize();
function layout(){const by={};
  for(let i=0;i<S.n;i++){const v=Vv[i];if(v.moving){v.tl=0;v.tn=-v.trail*2.5;continue}const k=Math.round(v.f);(by[k]=by[k]||[]).push(i)}
  for(const k in by){const Ls=by[k],g=S.chains.find(g=>g.m.some(i=>Ls.includes(i)));
    if(g)Ls.sort((a,b)=>{const x=g.m.indexOf(a),y=g.m.indexOf(b);return(x<0?9:x)-(y<0?9:y)});
    const n=Ls.length;Ls.forEach((i,j)=>{let la=0,lo=0;
      if(n===2){if(g&&g.m.includes(Ls[0])&&g.m.includes(Ls[1]))lo=j?-1.3:1.3;else la=j?-1.25:1.25}
      else if(n>2){la=j%2?-1.25:1.25;lo=j<2?1.3:-1.3}
      Vv[i].tl=la;Vv[i].tn=lo})}}
const q=new T.Quaternion(),ZA=new V3(0,0,1);
function tick(now){requestAnimationFrame(tick);
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i],k=Math.min(1,(now-t.t0)/t.ms);t.fn(k);if(k>=1){tweens.splice(i,1);t.r()}}
  const race=S.phase==='race';
  if(race)layout();
  MODELS.forEach(m=>m.visible=false);
  for(let i=0;i<4;i++){const v=Vv[i],m=MODELS[S.players[i].car];if(i>=S.n&&race)continue;if(!race&&i>=S.n)continue;m.visible=true;
    v.lat+=(v.tl-v.lat)*.2;v.lon+=(v.tn-v.lon)*.2;const F=frame(v.f);
    m.position.copy(F.p).addScaledVector(F.n,.3+v.hop+v.drop+(S.players[i].car===1?.12+Math.sin(now/300+i)*.06:0)).addScaledVector(F.s,v.lat).addScaledVector(F.t,v.lon);
    orient(m,F);let roll=v.tilt;const r=v.f-(RING-.5);if(r>0&&r<1)roll+=r*Math.PI*2;
    if(roll)m.quaternion.multiply(q.setFromAxisAngle(ZA,roll));if(v.spin)m.quaternion.multiply(q.setFromAxisAngle(UP,v.spin));m.scale.setScalar(Math.max(.001,v.sc));
    const u=m.userData;if(u.ring.visible)u.ring.rotation.z=now/200}
  chainSpr.forEach((s,k)=>{const g=race&&S.chains[k];s.visible=!!g;if(g){s.position.set(0,0,0);g.m.forEach(i=>s.position.add(MODELS[S.players[i].car].position));s.position.multiplyScalar(1/g.m.length);s.position.y+=1.4+Math.sin(now/250)*.15}});
  bob.forEach(b=>b.o.position.y=b.y+Math.sin(now/500+b.ph)*.25);spin.forEach(s=>s.o.rotation[s.ax]+=s.v*.016);
  flames.forEach((f,i)=>f.scale.y=.9*(1+Math.sin(now/40+i)*.25)*(i%2?1.3:1));discos.forEach(d=>d.rotation.y=now/400);
  lavaMat.emissiveIntensity=.75+Math.sin(now/600)*.2;
  const tgt=cam.over?new V3(0,0,14):MODELS[S.players[Math.min(cam.follow,3)].car].position.clone().add(new V3(0,0,3));
  cam.T.lerp(tgt,.08);cam.cur+=((cam.over?overDist:cam.dist)-cam.cur)*.08;
  const el=cam.over?1.05:cam.el,ce=Math.cos(el);
  camera.position.set(cam.T.x+cam.cur*Math.sin(cam.az)*ce,cam.T.y+cam.cur*Math.sin(el),cam.T.z+cam.cur*Math.cos(cam.az)*ce);
  if(cam.shake>0){cam.shake-=.016;camera.position.x+=(Math.random()-.5)*cam.shake*3;camera.position.y+=(Math.random()-.5)*cam.shake*3}
  camera.lookAt(cam.T);renderer.render(scene,camera)}

{const el=$('gl'),pts=new Map();let pd=0;
  el.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);try{el.setPointerCapture(e.pointerId)}catch(x){}});
  el.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];pts.set(e.pointerId,[e.clientX,e.clientY]);

    else if(pts.size===2){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)cam.dist=Math.min(80,Math.max(16,cam.dist*pd/d));pd=d}});
  const up=e=>{pts.delete(e.pointerId);pd=0};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);

function syncMods(st){for(let i=0;i<S.n;i++){const c=st[i],u=MODELS[S.players[i].car].userData,g=grp(i);
  u.rocket.visible=c.rocket>0;u.ice.visible=!!c.ice;u.mud.visible=!!c.mud;u.ring.visible=!!c.dbl;u.wheels[1].visible=!c.wheel;u.smoke.visible=!!c.wheel;Vv[i].tilt=c.wheel?.2:0;

/* ================= banner ================= */
const bn=$('banner');
async function banner(ic,t,d,good,ms){bn.className=good?'g':'b';bn.children[0].textContent=ic;bn.children[1].textContent=t;bn.children[2].textContent=d;bn.children[2].style.display=d?'':'none';
  void bn.offsetWidth;bn.classList.add('show');await wait(ms||1700);bn.classList.remove('show')}

/* ================= animations ================= */
async function play(A){
  for(const a of A){
    if(a.t==='move'){const n=a.to-a.from;cam.follow=a.ids[0];if(!n){await wait(400);continue}
      a.ids.forEach((i,k)=>{Vv[i].moving=true;Vv[i].trail=k});const ms=Math.max(150,Math.min(300,1700/n));
      for(let k=a.from;k<a.to;k++){sfx.step();await tw(ms,x=>a.ids.forEach(i=>{Vv[i].f=k+x;Vv[i].hop=Math.sin(x*Math.PI)*.7}))}
      a.ids.forEach(i=>{Vv[i].moving=false;Vv[i].hop=0;Vv[i].f=a.to})}
    else if(a.t==='sync')syncMods(a.st);
    else if(a.t==='ev'){const e=EV[a.e];(e.g?sfx.good:sfx.bad)();if(!e.g)cam.shake=.25;await banner(e.ic,e.n+'!',e.d+(a.ids.length>1?' Det gælder hele klyngen!':''),e.g)}
    else if(a.t==='jump'){const ids=a.ids;
      if(a.style==='slide'){sfx.zap();await tw(900,x=>ids.forEach(i=>Vv[i].f=a.from+(a.to-a.from)*(1-(1-x)*(1-x))))}
      else if(a.style==='tele'){sfx.zap();await tw(450,x=>ids.forEach(i=>{Vv[i].sc=1-x;Vv[i].spin=x*10}));ids.forEach(i=>Vv[i].f=a.to);await wait(500);sfx.zap();await tw(450,x=>ids.forEach(i=>{Vv[i].sc=x;Vv[i].spin=(1-x)*10}))}
      else{await tw(500,x=>ids.forEach(i=>{Vv[i].drop=-x*x*7;Vv[i].sc=1-x*.7;Vv[i].spin=x*6}));ids.forEach(i=>Vv[i].f=a.to);await wait(450);await tw(500,x=>ids.forEach(i=>{Vv[i].drop=(1-x)*(1-x)*8;Vv[i].sc=1;Vv[i].spin=0}))}
      ids.forEach(i=>{Vv[i].f=a.to;Vv[i].sc=1;Vv[i].spin=0;Vv[i].drop=0})}
    else if(a.t==='crash'){sfx.crash();cam.shake=.5;await banner('💥','Krasj!',a.txt,false,1900)}
    else if(a.t==='free')await banner('🔓','Fri igen!',a.txt,true,1300);
    else if(a.t==='skip')await banner('💤','Står over',a.txt,false,1300);
    else if(a.t==='win'){sfx.win();await wait(700)}
  }}

/* ================= rules engine ================= */
function fieldEvent(at,ids,A){const f=FIELDS[at],e=f.ev;if(!e||e==='exit')return;
  ids.forEach(i=>{const c=S.cars[i];if(e==='star')c.star=Math.min(3,c.star+1);else if(e==='rocket')c.rocket=2;else if(e==='dbl')c.dbl=1;else if(e==='wheel')c.wheel=1;else if(e==='mud')c.mud=1;else if(e==='ice')c.ice=1;else if(e==='warn')c.skip=1});
  A.push({t:'ev',e,ids:ids.slice()},{t:'sync',st:clone(S.cars)});log(`${names(ids)}: ${EV[e].n} på felt ${at}.`);
  let dest=null;if(e==='tele')dest=f.dest;else if(e==='slide')dest=Math.min(N-1,at+3);else if(e==='hole')dest=f.cp;
  if(dest!==null){ids.forEach(i=>S.cars[i].pos=dest);A.push({t:'jump',ids:ids.slice(),from:at,to:dest,style:e})}
  return EV[e]}
function advance(A){for(let k=0;k<12;k++){S.p=(S.p+1)%S.n;const c=S.cars[S.p];if(!c.skip)return;
  c.skip--;log(`${rawName(S.p)} står over.`);A.push({t:'sync',st:clone(S.cars)},{t:'skip',txt:`${rawName(S.p)} står over denne tur.`});
  const g=grp(S.p);if(g&&g.br===S.p){dropGrp(g);A.push({t:'free',txt:`${names(g.m)} hænger ikke sammen længere.`})}}}
async function roll(v){
  if(busy||S.win!==null||S.phase!=='race')return;snap();
  const p=S.p,c=S.cars[p];
  if(c.rocket>0&&S.d1===null){S.d1=v;save();hud();return}
  const two=S.d1!==null,base=two?S.d1+v:v;S.d1=null;
  let steps=base;const why=[];
  if(c.ice&&base<3){steps=0;why.push('hjulene spinner på isen')}
  if(steps>0){if(c.mud){steps=1;why.push('mudder')}else{if(c.dbl){steps*=2;why.push('dobbelt fart')}if(c.star){steps+=c.star;why.push('+'+c.star+' stjerne')}if(c.wheel){steps=Math.max(0,steps-2);why.push('hjul af −2')}}}
  c.ice=c.mud=c.dbl=c.wheel=0;if(two)c.rocket--;
  const A=[],g=grp(p),ids=g?g.m.slice():[p],from=c.pos,to=Math.min(N,from+steps);
  ids.forEach(i=>S.cars[i].pos=to);
  const rolled=two?`${base} (to terninger)`:String(base);
  S.last=`${rawName(p)} slog ${rolled} og ${to-from?`rykkede ${to-from} felt${to-from===1?'':'er'}`:'blev stående'}${why.length?' ('+why.join(', ')+')':''}.`;log(S.last);
  A.push({t:'move',ids,from,to},{t:'sync',st:clone(S.cars)});
  if(to>=N){S.win=ids[0];log(`${rawName(S.win)} vinder løbet!`);A.push({t:'win'})}
  else{
    if(to>from){const e=fieldEvent(to,ids,A);if(e)S.last+=` ${e.ic} ${e.n}!`}
    if(g&&g.br===p){dropGrp(g);A.push({t:'free',txt:`${names(g.m)} hænger ikke sammen længere.`})}
    const f=S.cars[p].pos,others=[];for(let j=0;j<S.n;j++)if(!ids.includes(j)&&S.cars[j].pos===f)others.push(j);
    if(f>0&&others.length){const m=[];others.forEach(j=>{const og=grp(j);if(og){og.m.forEach(k=>m.includes(k)||m.push(k));dropGrp(og)}else if(!m.includes(j))m.push(j)});
      const mg=grp(p);if(mg)dropGrp(mg);const front=m.slice();ids.forEach(k=>m.includes(k)||m.push(k));S.chains.push({m,br:p});
      const txt=`${names(ids)} hænger fast bag ${names(front)}. De følges ad i én runde og deler alt!`;log(`Krasj på felt ${f}: ${txt}`);S.last+=' 💥 Krasj!';A.push({t:'crash',txt})}
    advance(A)}
  save();busy=true;padLock(S.last);
  await play(A);busy=false;syncAll();hud()}
