<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>Skyggeborgen · Den tavse klokke</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap');
:root{color-scheme:dark;--gold:#dfc08b;--muted:#a8adba;--line:#ffffff20;--ink:#f6efe1;--red:#e0705f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0e15;color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;overflow:hidden}
button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #edc47e;outline-offset:3px}
header{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));z-index:6;background:linear-gradient(#0b0e15ee,#0b0e1500);pointer-events:none}

.brand{font:700 13px Cinzel,serif;letter-spacing:.2em;color:var(--gold);text-decoration:none;white-space:nowrap}

#app{position:fixed;inset:0}
/* intro and hero selection */
.backdrop{position:fixed;inset:0;background:linear-gradient(90deg,rgba(10,13,20,.96) 0%,rgba(10,13,20,.8) 45%,rgba(10,13,20,.4)),linear-gradient(0deg,#10131b 0%,transparent 65%),url('assets/skyggeborgen.jpg') center/cover no-repeat;z-index:-2}
.page{position:absolute;inset:0;overflow:auto;padding:76px 5% 40px}
.intro{display:flex;align-items:center}
.intro-inner{max-width:640px}
.eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);font-weight:800}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:600}
h1{font-size:clamp(38px,7vw,96px);line-height:1.05;margin:8px 0 14px}
.lead{font-size:17px;line-height:1.7;color:#d5d3d1;max-width:560px}
.btn{border:1px solid #c5a978;background:#d0b17e;color:#17171a;border-radius:8px;padding:14px 22px;font-weight:800;min-height:52px;font-size:17px;text-decoration:none;display:inline-flex;align-items:center}
.btn.alt{background:#151a24c9;color:#f3e9d8;border-color:#8b7758}
.btn:disabled{opacity:.4}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
.hero-choice{border:1px solid #8b775a66;background:linear-gradient(160deg,#22211f,#101117);border-radius:5px;color:var(--ink);padding:8px 8px 15px;text-align:center;box-shadow:0 12px 28px #0008}
.hero-choice>svg{width:100%;height:210px;display:block;filter:drop-shadow(0 8px 9px #000)}
.hero-choice h3{margin:4px 0 2px;font-size:18px}
.hero-choice p{margin:0;color:#b8bbc1;font-size:13px;line-height:1.4}
.hero-choice.selected{border-color:#d4b27a;background:#29231ddd;box-shadow:0 0 0 1px #d4b27a,0 12px 35px #000b}
/* game layout: stage + panel */
.game{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
.stage{position:relative;overflow:hidden;min-height:0;background:#0b0e15}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage:before,.stage:after{content:"";position:absolute;inset:-8%;pointer-events:none;z-index:2}
.stage:before{background:radial-gradient(ellipse at 70% 42%,transparent 15%,#080c14a0 100%),linear-gradient(0deg,#080a1070,transparent 40%);box-shadow:inset 0 0 110px #000}
.stage:after{inset:auto -25% -8%;height:35%;background:radial-gradient(ellipse at 40% 80%,#9ba9b62b,transparent 60%);filter:blur(18px);animation:mist 18s ease-in-out infinite alternate}
@keyframes mist{from{transform:translateX(-7%)}to{transform:translateX(7%)}}
.scene-image{transform-box:fill-box;transform-origin:center;animation:slowzoom 28s ease-in-out infinite alternate}@keyframes slowzoom{from{transform:scale(1)}to{transform:scale(1.045)}}
.vig{z-index:3;position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 calc(var(--d)*70px + 40px) calc(var(--d)*34px) #000;transition:box-shadow 1.2s}
.tag{z-index:3;position:absolute;left:14px;top:58px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#e8d6b0;background:#0b0e15b0;border:1px solid #ffffff22;border-radius:20px;padding:5px 11px;pointer-events:none}
.dots{z-index:3;position:absolute;right:14px;bottom:14px;display:flex;gap:6px;pointer-events:none}
.dots i{width:22px;height:4px;border-radius:3px;background:#ffffff33}.dots i.on{background:#e3c088;box-shadow:0 0 8px #e3c08888}
.panel{background:linear-gradient(145deg,#1b1a1b,#0b0e14 70%);box-shadow:-15px 0 45px #0009;border-top:1px solid var(--line);padding:14px 16px max(16px,env(safe-area-inset-bottom));overflow:auto;max-height:50vh}
.panel h2{font-size:clamp(20px,2.6vw,27px);margin:0 0 6px;color:var(--gold)}
.cap{font-family:Georgia,serif;font-size:clamp(18px,2.3vw,21px);line-height:1.5;margin:0}
.more{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0 0;font-size:13px}
.full{font-family:Georgia,serif;color:#d9d2c4;white-space:pre-line;font-size:15px;line-height:1.6;margin:8px 0 0;padding:10px 12px;border-left:2px solid #b4915e55;background:#ffffff06}
.notice{border-left:3px solid #8fe0a0;padding:8px 12px;margin:10px 0 0;background:#8fe0a012;color:#d8f2dc;font-weight:700;font-size:15px}
.cards{display:grid;gap:9px;margin-top:12px}
.card{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #ffffff2c;background:linear-gradient(135deg,#262321,#13151a);border-radius:5px;padding:10px 14px;color:var(--ink);font-weight:800;font-size:17px;min-height:62px;box-shadow:0 4px 0 #0008;transition:transform .1s}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 #0008}
.card:disabled{opacity:.4}
.card .ic{color:#cfb080;font-family:Georgia,serif;font-size:20px;width:30px;text-align:center;flex:none}
.card small{display:block;font-weight:600;color:var(--muted);font-size:13px;margin-top:2px}
.card .go{margin-left:auto;color:var(--gold);font-size:20px}
.card.main{background:linear-gradient(135deg,#7a5a2c,#4a3518);border-color:#e3c08877}
.card.hc>svg{width:46px;height:58px;flex:none}
.card .hp{color:#ff8f80;letter-spacing:1px;font-size:14px}
.dice{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}
.die{aspect-ratio:1;border:0;border-radius:14px;background:linear-gradient(#fff,#d9dde3);padding:0;box-shadow:0 4px 0 #7d838c}
.die svg{width:100%;height:100%;display:block}
.die:active{transform:translateY(3px);box-shadow:0 1px 0 #7d838c}
.dlegend{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.suits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.suit{border:0;border-radius:12px;background:#f4f1ea;color:#16181b;font-size:30px;font-weight:900;padding:10px 0 6px;box-shadow:0 4px 0 #8a8578}
.suit small{display:block;font-size:12px;font-weight:700}
.suit.red{color:#c0262d}
.sumlist{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
@media (max-width:480px){.brand{display:none}.quiet{padding:7px 9px;font-size:12px}.panel{max-height:44vh;padding:12px 12px max(12px,env(safe-area-inset-bottom))}.card{min-height:54px;font-size:16px;padding:8px 12px}.card.hc>svg{width:38px;height:48px}.cap{font-size:17px}}
@media (min-aspect-ratio:4/3){
 .game{grid-template-rows:none;grid-template-columns:minmax(0,1fr) min(420px,38vw)}
 .panel{max-height:none;border-top:0;border-left:1px solid var(--line);padding-top:66px}
}
/* svg animation */
.bob{animation:bob 2.6s ease-in-out infinite}.cheer{animation:cheer 1.3s ease-in-out infinite}@keyframes cheer{25%{transform:translateY(-26px)}50%{transform:translateY(0)}}@keyframes bob{50%{transform:translateY(-4px)}}
.breath{animation:bob 3.4s ease-in-out infinite}
.flick{animation:flick .16s ease-in-out infinite alternate}@keyframes flick{to{opacity:.65}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}
.rain{animation:rain .55s linear infinite}@keyframes rain{to{transform:translate(-40px,140px)}}
.drift{animation:drift 26s linear infinite alternate}@keyframes drift{to{transform:translateX(-140px)}}
.swing{animation:swing 3.2s ease-in-out infinite}@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.rise{animation:rise 3s linear infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-120px);opacity:0}}
.drip{animation:drip 1.8s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(160px);opacity:0}}
.beam{animation:beam 1.4s ease-in-out infinite alternate}@keyframes beam{to{opacity:.5}}
.ko{transform:translate(20px,-30px) rotate(-82deg);opacity:.55;filter:grayscale(1)}
.hurt{animation:hurt .55s ease-in-out 2}@keyframes hurt{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{filter:brightness(2.2) sepia(1) hue-rotate(-40deg)}75%{transform:translateX(6px)}}
.lunge{animation:lunge .6s ease-in-out}@keyframes lunge{40%{transform:translateX(-90px)}}
.hop{animation:hop .5s ease-out}@keyframes hop{40%{transform:translate(30px,-26px)}}
.crumble{animation:crumble 2.6s ease-in forwards}@keyframes crumble{0%{filter:none}30%{filter:brightness(1.8)}100%{transform:translateY(40px) scaleY(.2);opacity:0;filter:grayscale(1) blur(3px)}}
.pop{animation:pop 1.6s ease-out forwards}@keyframes pop{0%{opacity:0;transform:translateY(12px) scale(.5)}18%{opacity:1;transform:translateY(0) scale(1.25)}70%{opacity:1}100%{opacity:0;transform:translateY(-60px) scale(1)}}
.slash{stroke-dasharray:420;stroke-dashoffset:420;animation:slash .32s ease-out forwards,fadeout .5s .45s forwards}@keyframes slash{to{stroke-dashoffset:0}}@keyframes fadeout{to{opacity:0}}
.fly{animation:fly .6s ease-in forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy))}}
.boom{animation:boom .7s ease-out forwards;opacity:0}@keyframes boom{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(2.2)}}
.ring{animation:ring 1.3s ease-out forwards}@keyframes ring{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}
.spark{animation:spark .9s ease-out forwards}@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.up{animation:up 1.4s ease-out forwards}@keyframes up{0%{opacity:0}20%{opacity:1}100%{transform:translateY(-110px);opacity:0}}
.dome{animation:dome 1.4s ease-out forwards}@keyframes dome{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.05)}100%{opacity:0}}
.walk{transition:transform 1.7s cubic-bezier(.45,0,.3,1)}
.flip{position:absolute;left:50%;top:44%;width:120px;height:170px;margin:-85px 0 0 -60px;border-radius:12px;background:#f4f1ea;color:#16181b;display:grid;place-items:center;font-size:84px;font-weight:900;box-shadow:0 20px 50px #000c;animation:flipin .9s cubic-bezier(.3,1.4,.5,1) both;pointer-events:none}
.flip.red{color:#c0262d}@keyframes flipin{0%{transform:rotateY(180deg) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.tb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style></head><body><header><a class="brand" href="index.html">✦ &nbsp; LDA SPIL</a><div class="head-actions"><button class="quiet" id="sound">♫ Lyd: fra</button><button class="quiet" id="narrate">▶ Fortæl</button><button class="quiet" id="restart">Nyt eventyr</button></div></header><div id="app"></div><script>
'use strict';
const KEY='skyggeborgen-v1', campaignKey='skyggeborgen-kampagne';
const heroes={warrior:{name:'Warrior',icon:'⚔',title:'Vogteren',desc:'Beskyt en helt mod ét angreb.',ability:'Skjoldmur'},mage:{name:'Mage',icon:'✦',title:'Flammens mester',desc:'Giv fjenden 2 skade.',ability:'Ildstorm'},priest:{name:'Priest',icon:'✧',title:'Lysets vogter',desc:'Giv en helt 2 liv tilbage.',ability:'Helende lys'},hunter:{name:'Demon Hunter',icon:'◈',title:'Skyggenes jæger',desc:'Afslør faren før et valg.',ability:'Dæmonblik'}};
const initial=()=>({screen:'intro',selected:[],hp:{},used:{},dark:0,flags:{},chapter:0,story:'',title:'',options:[],phase:'',pending:null,enemy:0,acted:[],log:[],card:null});
let S=initial();try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.screen)S=x}catch(e){}
if(S.mapAt===undefined)S.mapAt=0;if(S.screen==='map'&&!S.mapNext)S.screen='intro';
if(S.screen==='combat'&&!S.pending&&['action','attackhelper','attackroll','revive'].includes(S.phase)){S.phase=alive().every(x=>(S.acted||[]).includes(x))?'enemy':'choose'}let audioOn=false,ctx=null,hum=null,voiceAudio=null;
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function clamp(n){return Math.max(0,Math.min(4,n))}function changeDark(n=1){S.dark=clamp(S.dark+n)}function damage(id,n=1){S.hp[id]=clamp(S.hp[id]-n)}function heal(id,n=1){S.hp[id]=clamp(S.hp[id]+n)}function alive(){return S.selected.filter(id=>S.hp[id]>0)}function defeated(){if(!alive().length){scene('tabt');return true}return false}
function sound(kind){if(!audioOn)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();let now=ctx.currentTime;if(kind==='ambient'){if(hum)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=55;g.gain.value=.018;o.connect(g).connect(ctx.destination);o.start();hum={o,g};return}let o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='bell'?'sine':'triangle';o.frequency.setValueAtTime(kind==='bell'?220:kind==='hit'?95:340,now);o.frequency.exponentialRampToValueAtTime(kind==='bell'?210:65,now+.7);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.09,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+(kind==='bell'?2:.45));o.connect(g).connect(ctx.destination);o.start();o.stop(now+(kind==='bell'?2:.5))}catch(e){}}
/* Fortællerstemme: klip indtalt med ElevenLabs ligger i voices/skyggeborgen.json (voices/lav_stemmer.py), ét klip pr. afsnit. Mangler et afsnit, bruges browserens stemme. */
let CLIPS=null,playId=0;const clipUrls={};try{fetch('voices/skyggeborgen.json').then(r=>r.ok?r.json():null).then(j=>{if(j&&j.klip)CLIPS=j.klip}).catch(()=>{})}catch(e){}
function clipUrl(t){if(!CLIPS||!CLIPS[t])return null;if(!clipUrls[t]){const bin=atob(CLIPS[t].mp3),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);clipUrls[t]=URL.createObjectURL(new Blob([arr],{type:'audio/mpeg'}))}return clipUrls[t]}
function stopVoice(){playId++;if(voiceAudio){voiceAudio.pause();voiceAudio=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function story(title,text,choices,chapter){stopVoice();showFull=false;S.flags.visionText='';S.screen='story';S.title=title;S.story=text;S.options=choices;S.chapter=chapter;S.phase='story';save();render();if(title.includes('klokke')||title.includes('porten'))sound('bell')}
const op=(label,action,detail='')=>({label,action,detail});
function scene(id){S.pending=null;S.card=null;if(['mira','port','vej','taarn','kapel','vagt','elias'].includes(id))S.place=id;switch(id){
case 'mira':story('Pigen i regnen',`Regnen trommer mod jeres kapper, da I når frem til landsbyen. Alle vinduer er mørke. Alle undtagen ét.\nI døråbningen står en pige med en alt for stor frakke. Hun holder en rusten nøgle så hårdt, at hendes knoer er blevet hvide.\n“Klokken ringede igen i nat,” hvisker hun. “Den sidste gang … kaldte den mit navn.”\nHun rækker jer nøglen. “Vil I finde ud af, hvem der ringer?”`,[op('Spørg, hvad hun ved om klokken','mira_klokke'),op('Spørg til nøglen','mira_nogle'),op('Lov hende, at I vil hjælpe','mira_lov')],1);break;
case 'port':story('Ridderen ved porten',`Borgens port er lukket. Ved siden af den hænger en mindre dør skævt i sine hængsler.\nEn ridder sidder lænket til muren. Hans rustning er revnet, og hans hjelm er tom. Da I nærmer jer, løfter han langsomt hovedet.\n“Mit navn er Sir Rav. Jeg forsøgte at nå frem til klokken. Borgens egne vagter lænkede mig fast.”`,[op('Befri Sir Rav','rav_roll','Et lavt slag larmer og kan koste liv.'),op('Spørg, hvem der lænkede ham fast','rav_ord'),op('Gå ind i borgen','rav_ga')],2);break;
case 'vej':story('To veje gennem mørket',`I står i en rund sal. Vand drypper fra loftet, og jeres lys får skyggerne til at strække sig hen over gulvet.\nTil venstre fører en trappe op til klokken. Til højre skinner et svagt, blåt lys fra et glemt kapel.\nKLANG.\nFra dybet under jer svarer en anden lyd. Bank. Bank. Bank.`,[op('Gå op i klokketårnet','taarn'),op('Undersøg det glemte kapel','kapel')],3);break;
case 'taarn':S.flags.route='Klokketårnet';story('Klokketårnet',`Trappen snor sig opad. Øverst hænger en enorm klokke. Den står fuldstændig stille.\nAlligevel ryster væggene, da den ringer.\nPå gulvet ligger en lille hammer. Ved siden af den er der ridset en flamme over en lukket dør. Flammen beskytter noget bag døren.`,[op('Undersøg hammeren','card'),op('Følg rebet nedad','vagt')],3);break;
case 'kapel':S.flags.route='Det glemte kapel';story('Det glemte kapel',`Kapellet er fyldt med væltede bænke. Foran alteret brænder ét enkelt blåt lys.\nI væggen bag alteret er der hugget en flamme over en lukket dør. Under billedet står: “Så længe ilden lever, holder døren.”\nLyset blafrer. En lille skygge bevæger sig under alteret.`,[op('Undersøg skyggen','card'),op('Følg trappen bag alteret','vagt')],3);break;
case 'vagt':if(S.dark>=2&&!S.flags.darkEncounter){S.flags.darkEncounter=true;S.screen='dark';S.title='Noget i mørket';S.story='Noget kravler ned ad væggen. I ser det kun et øjeblik — for mange ben, for lange skygger.\nAskevagten vender sig og jager det væk. “Selv nu beskytter jeg jer,” siger han.\nVælg en helt, der mister 1 liv. Den sidste stående helt kan ikke slås ud her.';save();render();return}vagt();break;
case 'elias':story('Stemmen bag døren',`Den rustne nøgle passer i låsen. Døren åbner med en lang, dyb lyd.\nPå den anden side sidder en gammel mand ved en revne i gulvet. Et blåt lys strømmer fra hans hænder ned i stenen.\n“Jeg hedder Elias. Jeg ringede med klokken for at få hjælp. En skygge er fanget under borgen, men nogen har taget en glød fra flammen.”\nHans hænder ryster. “Jeg ved ikke, hvor længe jeg kan holde revnen lukket.”`,[op('Hjælp Elias med at forsegle revnen','seal_roll','Det lykkes, men et lavt slag koster liv.'),op('Tag Elias med til bålet','elias_baal','Revnen står åben.'),op('Lad Elias blive og find gløden','elias_bliv','Revnen står åben.' )],5);break;
case 'slut':finish();break;
case 'tabt':stopVoice();S.screen='lost';S.title='Tilbage ved bålet';S.story='I åbner øjnene ved Det Sidste Bål. Jeres kapper er våde, og ilden er næsten gået ud. Men under asken findes stadig en lille glød.\nBorgen står der endnu. Og klokken er ikke blevet stille.';save();render();break;
}}
function vagt(){let opts=[op('Tal med vagten','talk_roll','Et lavt slag kan starte en kamp.')];if(S.flags.segl)opts.push(op('Vis Flammeseglet','vagt_fred'));if(S.flags.ravWords||S.flags.ed)opts.push(op('Fortæl ham om hans ed','vagt_fred'));opts.push(op('Gå til angreb','fight'));story('Vagten under klokken',`Trappen fører jer ned under borgen. Foran en stendør står en vagt i rustning. Aske siver ud mellem pladerne, hver gang han bevæger sig.\nHan løfter sit sværd. “Ingen må åbne døren.”\nFra den anden side lyder en svag stemme: “Vent … der er nogen herude!”`,opts,4)}
function result(title,text,next='port'){story(title,text,[op('Fortsæt',next)],S.chapter)}
function beginRoll(type){S.screen='roll';S.pending={type,hero:null,helper:null};S.phase='choose';save();render()}
function resolveRoll(n){let p=S.pending,hero=p.hero;let title='',text='',next='';if(p.type==='rav'){S.flags.rav=true;FX={list:[{t:'sparks',who:'foe'},...(n<=2?[{t:'hurt',who:hero,d:.3},{t:'txt',who:hero,txt:'−1 ♥',d:.3}]:[])]};if(n<=4)changeDark();if(n<=2)damage(hero);title='Kæden brister';text=n<=2?'Kæden brister med et øredøvende brag. Larmen vækker mørket, og slaget sårer helten.':n<=4?'Kæden brister, men støjen vækker mørket.':'Kæden løsnes stille.';text+='\nRidderen rejser sig. “Jeg skylder jer en tjeneste. Hvis mørket finder jer, så kald mit navn.”';next='vej'}else if(p.type==='talk'){if(n<=2){changeDark();S.pending=null;if(defeated())return;result('Vagten hæver sværdet','Vagten tror, I vil bryde ind. Mørket vokser.','fight');return}if(n<=4&&!S.flags.segl&&!S.flags.ravWords&&!S.flags.ed){S.pending=null;result('Vagten tøver','Han tøver, men I har intet tegn eller ord, der kan overbevise ham. Han hæver sværdet.','fight');return}title='Vagten lytter';text=n<=4?'Vagten tøver. I viser ham det, I har lært, og langsomt sænker han sværdet.':'Vagten sænker sværdet. “Tal da med stemmen,” siger han.';S.flags.guard='skånet';next='elias'}else if(p.type==='seal'){S.flags.sealed=true;FX={list:[{t:'seal'},...(n<=2?[{t:'hurt',who:hero,d:.3},{t:'txt',who:hero,txt:'−1 ♥',d:.3}]:[])]};S.flags.elias='døren';if(n<=2)damage(hero);if(n>=5)S.flags.tegn=true;title='Det blå lys';text=n<=2?'Forseglingen holder, men en kold kraft rammer helten for 1 liv.':n<=4?'Det blå lys breder sig gennem sprækkerne. Bankelyden bliver svagere.':'Forseglingen lyser klart. Elias giver jer Vogterens tegn som tak.';text+='\n“Jeg bliver her og holder øje. Find den stjålne glød.”';next='slut'}S.pending=null;if(defeated())return;result(title,text,next)}
function cardResult(suit){S.card=suit;FX={list:[{t:'card',ic:{heart:'♥',diamond:'♦',club:'♣',spade:'♠'}[suit],red:suit==='heart'||suit==='diamond'}]};let txt='';if(suit==='heart'){let hurt=S.selected.filter(x=>S.hp[x]<4);if(hurt.length){S.screen='cardheal';S.story='Et varmt, blåt lys samler sig om jeres hænder. Vælg en helt, som får 1 liv tilbage.';save();render();return}S.flags.spark=true;txt='Et varmt, blåt lys samler sig til en lysgnist. I kan bruge den til at give en helt 1 liv.'}if(suit==='diamond'){S.flags.segl=true;txt='I finder et lille sølvsegl med en flamme. Måske genkender nogen det.'}if(suit==='club'){S.flags.ed=true;txt='En hviskende stemme siger: “Vagten glemte sin ed, men ikke sit hjerte.”'}if(suit==='spade'){changeDark();txt='Noget sort glider ud af synsfeltet. Alle lys blafrer. Mørket vokser.'}result('Et fund i mørket',txt,'vagt')}
function combat(){S.screen='combat';S.enemy=S.selected.length;S.acted=[];S.flags.round=1;S.flags.guard='kamp';S.phase='choose';S.pending=null;save();render()}
function afterAction(){if(S.enemy<=0){S.flags.guard='besejret';result('Vagten falder','Vagten falder på knæ. Gløden i hans bryst slukkes langsomt. “Jeg skulle … bare holde den lukket,” hvisker han.','elias');return}if(defeated())return;if(alive().every(x=>S.acted.includes(x))){S.phase='enemy';S.pending=null}else{S.phase='choose';S.pending=null}save();render()}

function finish(){S.upgrades={};let campaign={rav:!!S.flags.rav,ravWords:!!S.flags.ravWords,guard:S.flags.guard||'skånet',sealed:!!S.flags.sealed,elias:S.flags.elias||'døren',tegn:!!S.flags.tegn,route:S.flags.route,heroes:S.selected,items:[S.flags.spark?'Lysgnist':null,S.flags.segl?'Flammeseglet':null].filter(Boolean),completed:true};try{localStorage.setItem(campaignKey,JSON.stringify(campaign))}catch(e){}S.screen='ending';S.title='Klokken er stille';S.story='Da I kommer ud af borgen, er regnen holdt op. Langt væk i landsbyen står Mira og venter.\nSå ser I et lille, rødt lys bevæge sig mellem træerne. Det ligner en lanterne.\nMira stivner. “Åh nej,” hvisker hun. “Den fandt han.”';save();render();sound('bell')}

function mapSvg(){W=stageW();const s=Math.max(.6,Math.min(1,W/1000)),vert=W<800,pts=NODES.map((n,i)=>vert?{x:W*(i%2?.64:.36),y:92+i*(476/6),lx:i%2?1:-1}:{x:W*(.1+i*.8/6),y:i%2?250:400,lx:0});
  let o=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${DEFS}<rect width="${W}" height="${H}" fill="#1a1712"/><rect width="${W}" height="${H}" fill="url(#night)" opacity=".55"/>${stars(60,H)}`;rs=5;for(let k=0;k<26;k++){const x=R()*W,y=120+R()*460,h=24+R()*30;o+=`<path d="M${F(x)} ${F(y-h)}L${F(x-12)} ${F(y)}L${F(x+12)} ${F(y)}Z" fill="#0d1612" opacity=".7"/>`}
  o+=`<path d="M${pts.map(p=>F(p.x)+' '+p.y).join(' L')}" stroke="#e3c08855" stroke-width="10" fill="none" stroke-dasharray="4 16" stroke-linecap="round"/>`;
  const route=S.mapNext==='taarn'||S.flags.route==='Klokketårnet'?['Klokketårnet','Ⅳ']:S.mapNext==='kapel'||S.flags.route==='Det glemte kapel'?['Kapellet','Ⅳ']:['Tårn / kapel','Ⅳ'];
  pts.forEach((p,i)=>{const done=i<=S.mapAt,next=i===nodeIdx(S.mapNext),n=i===3?route:[NODES[i][1],NODES[i][2]];
    o+=`<g transform="translate(${F(p.x)} ${p.y})">${next?`<circle r="56" fill="url(#gY)" class="pulse"/>`:''}<circle r="34" fill="${done?'#3a2c18':'#15181f'}" stroke="${done||next?'#e3c088':'#4a4f5a'}" stroke-width="4"/><text y="12" text-anchor="middle" font-size="32"${done||next?'':' opacity=".35"'}>${n[1]}</text><text x="${p.lx*50}" y="${p.lx?7:68}" text-anchor="${p.lx>0?'start':p.lx<0?'end':'middle'}" font-family="Cinzel,serif" font-weight="700" font-size="${vert?18:F(20*s+4)}" fill="${done||next?'#f3e2bd':'#7a7f8a'}" stroke="#000" stroke-width="3" paint-order="stroke">${n[0]}</text></g>`});
  const tp=p=>p.lx?[p.x-p.lx*62,p.y+32]:[p.x,p.y-44],a=tp(pts[S.mapAt||0]),b=tp(pts[nodeIdx(S.mapNext)]);
  o+=`<g id="tok" class="walk" style="transform:translate(${F(a[0])}px,${F(a[1])}px)" data-to="${F(b[0])},${F(b[1])}">${S.selected.map((id,i)=>`<g transform="translate(${F((i-(S.selected.length-1)/2)*26)} 0) scale(.42)">${realisticHero(id)}</g>`).join('')}</g>`;
  return o+`</svg>`}
/* ---------- render ---------- */
function render(){let html='';
  if(S.screen==='intro'){html=`<div class="backdrop"></div><main class="page intro"><div class="intro-inner"><div class="eyebrow">Et samarbejdseventyr for 2–4 helte</div><h1>Skygge<br>borgen<span style="color:#d5b783">.</span></h1><p class="lead">En gammel klokke ringer i mørket. En flamme er ved at dø. Og nogen venter på jer bag borgens mure.</p><div class="toolbar"><button class="btn" data-action="setup">Begynd eventyret &nbsp;→</button><a class="btn alt" href="index.html">Tilbage til spillene</a></div><p class="muted" style="margin-top:22px">10–20 minutter · terninger og et spil kort</p></div></main>`}
  else if(S.screen==='setup'){html=`<div class="backdrop"></div><main class="page"><div class="eyebrow">Før eventyret begynder</div><h1 style="font-size:clamp(30px,5vw,54px)">Vælg jeres helte</h1><p class="lead">Vælg 2–4 helte. Hver spiller styrer én, og I vinder eller taber sammen.</p><div class="roster">${Object.entries(heroes).map(([id,h])=>`<button class="hero-choice ${S.selected.includes(id)?'selected':''}" data-action="select:${id}" aria-pressed="${S.selected.includes(id)}"><svg viewBox="-70 -200 140 215">${DEFS}<ellipse rx="40" ry="9" fill="#000" opacity=".4"/>${realisticHero(id)}</svg><h3>${h.name}</h3><p>${h.desc}</p></button>`).join('')}</div><p class="muted">I skal bruge et blandet spil kort uden jokere og mindst én terning.</p><div class="toolbar"><button class="btn" data-action="start" ${S.selected.length<2?'disabled':''}>Træd ind i historien &nbsp;→</button></div></main>`}
  else{let pane='',stage=S.screen==='map'?mapSvg():stageSvg();
    if(S.screen==='map'){const to=NODES[nodeIdx(S.mapNext)];pane=`<h2>Videre i eventyret</h2><p class="cap">I går videre mod ${S.mapNext==='taarn'?'klokketårnet':S.mapNext==='kapel'?'det glemte kapel':to[1].toLowerCase()}.</p>${cards([op('Gå videre','go:'+S.mapNext)]).replace('class="card"','class="card main"')}`}
    else if(S.screen==='story'){const risky=['Ridderen ved porten','Vagten under klokken','Klokketårnet','Det glemte kapel'].includes(S.title),canSee=risky&&S.selected.includes('hunter')&&S.hp.hunter>0&&!S.used.hunter&&!S.flags.visionText;
      pane=storyBlock()+(S.flags.visionText?`<div class="notice">Dæmonblik: ${esc(S.flags.visionText)}</div>`:'')+(canSee?cards([op('Demon Hunter bruger Dæmonblik','vision','Se faren, før I vælger.')]):'')+cards(S.options)}
    else if(S.screen==='roll'){const p=S.pending,prompts={rav:'Hvem forsøger at bryde kæden?',talk:'Hvem taler med askevagten?',seal:'Hvem hjælper Elias med at forsegle revnen?'};
      if(!p.hero)pane=`<h2>Terningeslag</h2><p class="cap">${prompts[p.type]}</p>`+heroCards('rollhero',alive());
      else if(p.helper===null)pane=`<h2>Hjælp?</h2><p class="cap">Vil en anden helt hjælpe ${heroes[p.hero].name}? Så slår I 2 terninger og bruger den højeste.</p>`+heroCards('helper',alive().filter(x=>x!==p.hero))+cards([op('Ingen hjælper','helper:none')]);
      else pane=`<h2>Slå ${p.helper!=='none'?'2 terninger':'terningen'}!</h2><p class="cap">Tryk på det, ${p.helper!=='none'?'den højeste':'terningen'} viser.</p>`+diceRow('roll','<span>1–2 det koster</span><span>3–4 lykkes, men …</span><span>5–6 flot!</span>')}
    else if(S.screen==='card'){pane=`<h2>Vend et kort</h2><p class="cap">Vend det øverste kort i bunken. Hvilken kulør er det?</p><div class="suits"><button class="suit red" data-action="card:heart">♥<small>Hjerter</small></button><button class="suit red" data-action="card:diamond">♦<small>Ruder</small></button><button class="suit" data-action="card:club">♣<small>Klør</small></button><button class="suit" data-action="card:spade">♠<small>Spar</small></button></div>`}
    else if(['dark','cardheal','heal','sparkheal','protect'].includes(S.screen)){const titles={dark:'Noget i mørket',cardheal:'Det blå lys',heal:'Helende lys',sparkheal:'Lysgnisten',protect:'Skjoldmur'};const el=S.screen==='dark'||S.screen==='protect'?alive():S.selected.filter(x=>S.hp[x]<4);
      pane=`<h2>${titles[S.screen]}</h2><p class="cap">${esc(S.screen==='dark'?'Et monster kravler ned ad væggen! Vælg en helt, der mister 1 liv.':S.story||'Vælg en helt.')}</p>`+heroCards('target',el)+(S.screen!=='dark'&&S.screen!=='cardheal'?cards([op('Fortryd','cancel_target')]):'')}
    else if(S.screen==='combat'){pane=`<h2>Kamp mod askevagten</h2>`;
      if(S.phase==='choose')pane+=`<p class="cap">Runde ${S.flags.round}. Hvem handler nu?</p>`+heroCards('fighter',alive().filter(id=>!S.acted.includes(id)))+(S.flags.round>1?cards([op('Stop kampen og tal','peace')]):'');
      else if(S.phase==='action'){const id=S.pending.hero;pane+=`<p class="cap">Hvad gør ${heroes[id].name}?</p>`+cards([op('Angrib','attack','Slå terningen'),...(!S.used[id]&&id==='mage'?[op('Ildstorm','mage','2 skade, ingen terning')]:[]),...(!S.used[id]&&id==='priest'&&S.selected.some(x=>S.hp[x]<4)?[op('Helende lys','priest','2 liv til én helt')]:[]),...(S.selected.some(x=>S.hp[x]===0)?[op('Hjælp en falden helt op','revive')]:[]),op('Vælg en anden helt','fight_back')])}
      else if(S.phase==='attackhelper'){const id=S.pending.hero;pane+=`<p class="cap">${heroes[id].name} angriber! Vil en anden helt hjælpe med en ekstra terning?</p>`+heroCards('fighthelp',alive().filter(x=>x!==id&&!S.acted.includes(x)))+cards([op('Angrib uden hjælp','fighthelp:none')])}
      else if(S.phase==='attackroll')pane+=`<p class="cap">Slå ${S.pending.helper==='none'?'terningen':'2 terninger og brug den højeste'}!</p>`+diceRow('attackroll','<span>1–2 forbi</span><span>3–4 rammer, men …</span><span>5–6 fuld træffer!</span>');
      else if(S.phase==='revive')pane+=`<p class="cap">Hvem skal hjælpes op?</p>`+heroCards('revive',S.selected.filter(x=>S.hp[x]===0))+cards([op('Tilbage','fight_action')]);
      else if(S.phase==='enemy'){pane+=`<p class="cap">Vagten slår igen! Hvem bliver ramt?</p>`+heroCards('enemy',alive());if(S.selected.includes('warrior')&&S.hp.warrior>0&&!S.used.warrior)pane+=cards([op('Warrior bruger Skjoldmur','shield','Ingen bliver ramt')])}}
    else if(S.screen==='ending'){const f=S.flags;pane=`<h2>${esc(S.title)}</h2><p class="cap">${esc(shortOf(S.story))}</p><ul class="sumlist"><li>${f.rav?'Sir Rav er fri og skylder jer en tjeneste.':'Sir Rav blev ved porten.'}</li><li>${f.sealed?'Revnen er forseglet.':'Revnen står stadig åben.'}</li><li>En glød er stjålet fra borgens flamme.</li></ul><p class="cap" style="font-size:16px;margin-top:12px">Vælg en ny evne til hver helt:</p>${S.selected.map(id=>`<div style="display:flex;align-items:center;gap:8px;margin-top:8px">${heroIcon(id,36,46)}<div style="flex:1">${cards(upgrades[id].map((label,i)=>op((S.upgrades?.[id]===i?'✓ ':'')+label,`upgrade:${id},${i}`)))}</div></div>`).join('')}<p class="muted">Næste eventyr er endnu ikke bygget.</p>${cards([op('Spil eventyret igen','again')])}`}
    else if(S.screen==='lost'){pane=`<h2>${esc(S.title)}</h2><p class="cap">${esc(shortOf(S.story))}</p>`+cards([op('Prøv igen','retry'),op('Vælg nye helte','setup')])}
    if(S.flags.spark&&['story','combat'].includes(S.screen))pane+=cards([op('Brug lysgnisten (1 liv)','spark')]);
    html=`<main class="game"><section class="stage">${stage}<div class="vig" style="--d:${S.screen==='ending'?0:S.dark}"></div><div class="tag">${S.screen==='map'?'Eventyrkortet':`Kapitel ${Math.min(Math.max(S.chapter,1),5)} · Den tavse klokke`}</div><div class="dots">${[1,2,3,4,5].map(i=>`<i class="${i<=S.chapter?'on':''}"></i>`).join('')}</div></section><section class="panel">${pane}</section></main>`}
  app.innerHTML=html;save();
  const st=document.querySelector('.stage');if(st){const r=st.getBoundingClientRect(),nw={w:r.width,h:r.height};if(!ST||Math.abs(ST.w-nw.w)>2||Math.abs(ST.h-nw.h)>2){ST=nw;if(stageW()!==W){const svg=st.querySelector('svg');if(svg)svg.outerHTML=S.screen==='map'?mapSvg():stageSvg()}}}
  if(S.screen==='map')setTimeout(()=>{const t=document.getElementById('tok');if(t){const [x,y]=t.dataset.to.split(',');t.style.transform=`translate(${x}px,${y}px)`}},120);
  playFx()}
let rsz=0;addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(!['intro','setup'].includes(S.screen)){ST=null;render()}},200)});
function goTo(id){const i=nodeIdx(id);if(i!==undefined&&i>(S.mapAt||0)){stopVoice();S.screen='map';S.mapNext=id;save();render();return}scene(id)}

app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let [a,v]=b.dataset.action.split(':');sound('click');switch(a){
case'upgrade':{let [id,i]=v.split(',');S.upgrades=S.upgrades||{};S.upgrades[id]=+i;try{let c=JSON.parse(localStorage.getItem(campaignKey));c.upgrades=S.upgrades;localStorage.setItem(campaignKey,JSON.stringify(c))}catch(e){}render();break}case'setup':S=initial();S.screen='setup';render();break;case'select':if(S.selected.includes(v))S.selected=S.selected.filter(x=>x!==v);else if(S.selected.length<4)S.selected.push(v);render();break;case'start':if(S.selected.length<2)return;S.selected.forEach(id=>{S.hp[id]=4;S.used[id]=false});S.mapAt=0;scene('mira');break;
case'mira_klokke':result('Et navn i mørket','“Den gamle klokkemand hed Elias,” siger Mira. “Han passede klokken, dengang borgen stadig havde lys.”');break;case'mira_nogle':result('Den rustne nøgle','Der er en lille klokke ridset ind i metallet. “Far sagde, at nøglen nok tilhører borgen,” siger Mira.');break;case'mira_lov':S.flags.promise=true;result('Et løfte','Mira smiler et øjeblik. Så høres et dybt KLANG fra borgen. “Den plejer ikke at ringe, når jeg er vågen.”');break;
case'rav_roll':beginRoll('rav');break;case'rav_ord':S.flags.ravWords=true;result('Ridderens ord','“Borgens egne vagter lænkede mig fast,” siger Rav. “Hvis I møder deres anfører, så sig: Flammen er ikke jeres fjende.”','vej');break;case'rav_ga':result('Gennem porten','Bag jer rasler lænkerne. “Hvis I finder klokkemanden,” kalder ridderen, “så sig, at jeg forsøgte.”','vej');break;
case'vej':case'port':case'taarn':case'kapel':case'vagt':case'elias':case'slut':goTo(a);break;case'go':S.mapAt=nodeIdx(v);scene(v);break;case'more':showFull=!showFull;render();break;case'card':if(v)cardResult(v);else{S.screen='card';render()}break;
case'rollhero':S.pending.hero=v;render();break;case'helper':S.pending.helper=v;render();break;case'roll':resolveRoll(+v);break;
case'vagt_fred':S.flags.guard='skånet';result('Vagten husker','Vagten står helt stille. Så synker hans sværd langsomt mod gulvet. “Jeg husker en ed,” siger han.','elias');break;case'talk_roll':beginRoll('talk');break;case'seal_roll':beginRoll('seal');break;
case'elias_baal':S.flags.elias='bålet';S.flags.sealed=false;result('Elias følger med','I hjælper Elias på benene. Bag jer lyder et knæk fra stenen. “Revnen er der stadig. Hvis I finder gløden, kan vi måske lukke den sammen.”','slut');break;case'elias_bliv':S.flags.elias='døren';S.flags.sealed=false;result('Et løfte i mørket','“Jeg kan holde den lidt endnu,” siger Elias. “Gå. Find den, der tog gløden.” I lukker døren forsigtigt bag jer.','slut');break;
case'vision':S.used.hunter=true;S.flags.visionText=S.title==='Ridderen ved porten'?'Kæden kan larme og såre den, der bryder den.':S.title==='Vagten under klokken'?'Samtalen kan ende i kamp; et kendt tegn eller løfte kan berolige vagten.':'Et sort kort vækker mørket. De andre kulører giver hjælp eller spor.';render();break;case'fight':combat();break;case'fighter':S.pending={hero:v};S.phase='action';render();break;case'fight_back':S.pending=null;S.phase='choose';render();break;case'fight_action':S.phase='action';render();break;case'attack':S.phase='attackhelper';render();break;case'fighthelp':S.pending.helper=v;if(v!=='none')S.acted.push(v);S.phase='attackroll';render();break;case'attackroll':{let n=+v,id=S.pending.hero;S.acted.push(id);FX={list:n>=3?[{t:'slash',who:'foe'},{t:'txt',who:'foe',txt:'−1'},...(n<=4?[{t:'hurt',who:id,d:.5},{t:'txt',who:id,txt:'−1 ♥',d:.5}]:[])]:[{t:'txt',who:'foe',txt:'Forbi!',c:'#d6dde8'}]};if(n>=3){S.enemy--;sound('hit')}if(n===3||n===4)damage(id);S.pending=null;afterAction();break}case'mage':FX={list:[{t:'fire'},{t:'txt',who:'foe',txt:'−2',d:.6}]};S.used.mage=true;S.acted.push('mage');S.enemy=Math.max(0,S.enemy-2);sound('hit');S.pending=null;afterAction();break;case'priest':S.screen='heal';S.story='Priest kalder på lyset. Vælg en helt, der får 2 liv tilbage.';render();break;case'revive':if(v){heal(v);FX={list:[{t:'heal',who:v},{t:'txt',who:v,txt:'+1 ♥',c:'#8fffb0'}]};S.acted.push(S.pending.hero);S.pending=null;afterAction()}else{S.phase='revive';render()}break;
case'enemy':FX={list:[{t:'lunge'},{t:'hurt',who:v,d:.25},{t:'txt',who:v,txt:'−1 ♥',d:.25}]};damage(v);if(defeated())return;S.flags.round++;S.acted=[];S.phase='choose';render();break;case'shield':FX={list:[{t:'lunge'},{t:'shield'},{t:'txt',who:'warrior',txt:'Blokeret!',c:'#bfe6ff',d:.2}]};S.used.warrior=true;S.flags.round++;S.acted=[];S.phase='choose';render();break;case'peace':S.flags.guard='skånet';result('Vagten husker','Vagten sænker sit sværd. “Jeg gav et løfte,” hvisker han. Han lader jer tale med stemmen bag døren.','elias');break;
case'target':if(S.screen==='dark'){if(alive().length===1&&S.hp[v]===1){}else{damage(v);FX={list:[{t:'hurt',who:v},{t:'txt',who:v,txt:'−1 ♥'}]}}if(!defeated())vagt()}else if(S.screen==='cardheal'){heal(v);FX={list:[{t:'heal',who:v},{t:'txt',who:v,txt:'+1 ♥',c:'#8fffb0'}]};result('Et fund i mørket','Det blå lys giver helten 1 liv tilbage.','vagt')}else if(S.screen==='heal'){heal(v,2);FX={list:[{t:'heal',who:v},{t:'txt',who:v,txt:'+2 ♥',c:'#8fffb0'}]};S.used.priest=true;S.acted.push(S.pending.hero);S.pending=null;S.screen='combat';afterAction()}else if(S.screen==='sparkheal'){heal(v);FX={list:[{t:'heal',who:v},{t:'txt',who:v,txt:'+1 ♥',c:'#8fffb0'}]};S.flags.spark=false;S.screen=S.returnScreen;render()}break;
case'spark':if(!S.selected.some(x=>S.hp[x]<4))break;S.returnScreen=S.screen;S.screen='sparkheal';S.story='Vælg en helt, der får 1 liv tilbage.';render();break;case'cancel_target':S.screen=S.returnScreen||'combat';if(S.screen==='combat')S.phase='action';render();break;case'retry':{let chosen=S.selected.slice();S=initial();S.selected=chosen;chosen.forEach(id=>{S.hp[id]=4;S.used[id]=false});S.mapAt=0;scene('mira');break}case'again':S=initial();S.screen='setup';render();break;
}});
document.getElementById('sound').onclick=()=>{audioOn=!audioOn;document.getElementById('sound').textContent=`♫ Lyd: ${audioOn?'til':'fra'}`;if(audioOn){sound('ambient');sound('bell')}else if(hum){hum.o.stop();hum=null}};
document.getElementById('restart').onclick=()=>{if(confirm('Start et nyt eventyr? Det nuværende forsøg bliver slettet.')){stopVoice();S=initial();render()}};
document.getElementById('narrate').onclick=()=>{stopVoice();let text=S.story||'Skyggeborgen. Den tavse klokke.';const parts=text.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!CLIPS||!parts.every(p=>CLIPS[p])){speak(text);return}
  const id=playId;let i=0;const next=()=>{if(id!==playId)return;if(i>=parts.length){voiceAudio=null;return}const a=new Audio(clipUrl(parts[i++]));voiceAudio=a;a.onended=next;a.play().catch(()=>{if(id===playId){voiceAudio=null;speak(parts.slice(i-1).join('\n'))}})};next()};
function speak(text){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(text);u.lang='da-DK';u.rate=.88;speechSynthesis.speak(u)}else alert('Din browser understøtter ikke oplæsning. Du kan tilføje indtalte lydfiler i voices-mappen.')}
render();
