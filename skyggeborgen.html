<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>Skyggeborgen · Den tavse klokke</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap');
:root{color-scheme:dark;--gold:#dfc08b;--muted:#a8adba;--line:#ffffff20;--ink:#f6efe1;--red:#db7667}*{box-sizing:border-box}body{margin:0;background:#10131b;color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #edc47e;outline-offset:3px}.backdrop{position:fixed;inset:0;background:linear-gradient(90deg,rgba(10,13,20,.96) 0%,rgba(10,13,20,.82) 45%,rgba(10,13,20,.43)),linear-gradient(0deg,#10131b 0%,transparent 65%),url('assets/skyggeborgen.jpg') center/cover no-repeat;z-index:-2}.backdrop:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 72% 45%,transparent,#0a0c13aa)}header{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;gap:10px;background:#0c1018a8}.brand{font:700 14px Cinzel,serif;letter-spacing:.22em;color:var(--gold);text-decoration:none}.head-actions{display:flex;gap:8px;align-items:center}.quiet{border:1px solid var(--line);background:#101722a8;color:#e6e0d6;border-radius:7px;padding:9px 12px;font-size:13px}.shell{max-width:1360px;margin:auto;padding:42px 5% 60px}.eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:40px}.main{min-width:0}.chapter{display:flex;align-items:center;gap:12px;color:#c8b794;font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px}.chapter:before{content:'';width:35px;height:1px;background:#b4915e}h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:600}h1{font-size:clamp(38px,6vw,72px);line-height:1.08;margin:0 0 14px;letter-spacing:.01em}h2{font-size:clamp(26px,3vw,39px);margin:0 0 14px}h3{font-size:16px;margin:0}.lead{font-size:17px;line-height:1.75;color:#d5d3d1;max-width:690px}.intro{min-height:calc(100vh - 170px);display:flex;align-items:center}.intro-inner{max-width:720px}.intro h1{font-size:clamp(52px,8vw,102px)}.intro .lead{max-width:540px}.rule{width:72px;height:2px;background:var(--gold);margin:28px 0}.btn{border:1px solid #c5a978;background:#d0b17e;color:#17171a;border-radius:5px;padding:14px 21px;font-weight:800;min-height:48px}.btn:hover{background:#ebd0a2}.btn.alt{background:#151a24c9;color:#f3e9d8;border-color:#8b7758}.btn.alt:hover,.option:hover{background:#262935}.btn:disabled,.option:disabled{opacity:.4;cursor:not-allowed}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.story-card{background:linear-gradient(130deg,#171c26ed,#11151def);border:1px solid #ffffff1f;border-radius:12px;box-shadow:0 18px 60px #0005;overflow:hidden}.story-head{padding:24px 28px 0;display:flex;gap:10px;align-items:center}.sigil{width:38px;height:38px;border:1px solid #b89d70;border-radius:50%;display:grid;place-items:center;color:#e8d2a8}.voice-label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#c2ab83}.story{padding:12px 28px 24px;font-family:Georgia,serif;font-size:clamp(18px,2vw,21px);line-height:1.72;color:#f0e8d9;white-space:pre-line}.story p{margin:0 0 12px}.story p:last-child{margin:0}.choices-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c6b18e;margin:28px 0 12px}.choices{display:grid;gap:9px}.option{display:flex;align-items:center;gap:14px;text-align:left;background:#121822e8;border:1px solid #ffffff25;border-radius:8px;color:#f5ecdf;padding:16px 17px;min-height:56px;font-weight:700;transition:.2s}.option .arrow{margin-left:auto;color:var(--gold)}.option small{display:block;color:#aaaeb8;font-weight:400;margin-top:4px}.side{display:grid;gap:14px;align-content:start}.panel{background:#111720df;border:1px solid var(--line);border-radius:10px;padding:19px}.panel-title{color:#c8ae80;font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:15px}.hero-row{padding:10px 0;border-bottom:1px solid #ffffff13}.hero-row:last-child{border:0}.hero-top{display:flex;justify-content:space-between;font-weight:800}.hearts{color:#e28a7a;letter-spacing:2px;font-size:15px}.hero-meta{font-size:12px;color:var(--muted);margin-top:4px}.darkbar{display:flex;gap:7px;margin:10px 0}.pip{width:27px;height:5px;background:#3b3e47;border-radius:6px}.pip.on{background:#d8a169;box-shadow:0 0 10px #d88f54}.muted{color:var(--muted);font-size:13px;line-height:1.5}.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:25px 0}.hero-choice{border:1px solid var(--line);background:#151a24da;border-radius:9px;text-align:left;color:var(--ink);padding:18px;min-height:130px}.hero-choice.selected{border-color:#e6c58a;background:#352c25e8;box-shadow:inset 0 0 0 1px #e6c58a55}.hero-icon{font-size:25px}.hero-choice h3{margin:8px 0 5px}.hero-choice p{margin:0;color:#b8bbc1;font-size:13px;line-height:1.45}.rolls,.suits{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.die,.suit{width:57px;height:57px;border:1px solid #827052;background:#252731;color:#f5e6cc;border-radius:8px;font-size:25px;font-weight:800}.suit{width:auto;padding:0 18px;font-size:19px}.suit.red{color:#f08f83}.combat-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.enemy{font:600 18px Cinzel,serif;color:#edc995}.notice{border-left:2px solid #d2a86e;padding:10px 14px;margin:15px 0;background:#d7ad6e12;color:#e4d8c5}.dots{display:flex;gap:8px;margin:20px 0 30px}.dots i{width:35px;height:3px;background:#ffffff30}.dots i.on{background:#d5b47c}.pill{display:inline-block;color:#d2bb92;border:1px solid #a58c60;border-radius:20px;padding:4px 9px;font-size:11px;letter-spacing:.08em}.settings{margin-top:20px}.settings summary{cursor:pointer;color:#d5bd91}.settings p{font-size:13px;line-height:1.5;color:#bbb}.fade{animation:enter .45s ease both}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:800px){header{height:auto;min-height:64px;padding:12px 5%}.brand{font-size:11px}.shell{padding-top:28px}.layout{grid-template-columns:1fr;gap:22px}.side{grid-template-columns:1fr 1fr}.intro{min-height:calc(100svh - 150px)}.backdrop{background-position:65% center}}@media(max-width:500px){.side{grid-template-columns:1fr}.roster{grid-template-columns:1fr 1fr}.hero-choice{padding:13px}.story{padding:12px 20px 22px}.story-head{padding:20px 20px 0}.quiet{padding:8px;font-size:12px}.shell{padding-left:16px;padding-right:16px}.suit{padding:0 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="backdrop"></div><header><a class="brand" href="index.html">✦ &nbsp; LDA SPIL</a><div class="head-actions"><button class="quiet" id="sound">♫ Lyd: fra</button><button class="quiet" id="narrate">▶ Fortæl</button><button class="quiet" id="restart">Nyt eventyr</button></div></header><div id="app"></div><script>
'use strict';
const KEY='skyggeborgen-v1', campaignKey='skyggeborgen-kampagne';
const heroes={warrior:{name:'Warrior',icon:'⚔',title:'Vogteren',desc:'Beskyt en helt mod ét angreb.',ability:'Skjoldmur'},mage:{name:'Mage',icon:'✦',title:'Flammens mester',desc:'Giv fjenden 2 skade.',ability:'Ildstorm'},priest:{name:'Priest',icon:'✧',title:'Lysets vogter',desc:'Giv en helt 2 liv tilbage.',ability:'Helende lys'},hunter:{name:'Demon Hunter',icon:'◈',title:'Skyggenes jæger',desc:'Afslør faren før et valg.',ability:'Dæmonblik'}};
const initial=()=>({screen:'intro',selected:[],hp:{},used:{},dark:0,flags:{},chapter:0,story:'',title:'',options:[],phase:'',pending:null,enemy:0,acted:[],log:[],card:null});
let S=initial();try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.screen)S=x}catch(e){}
if(S.screen==='combat'&&!S.pending&&['action','attackhelper','attackroll','revive'].includes(S.phase)){S.phase=alive().every(x=>(S.acted||[]).includes(x))?'enemy':'choose'}let audioOn=false,ctx=null,hum=null,voiceAudio=null;
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function clamp(n){return Math.max(0,Math.min(4,n))}function changeDark(n=1){S.dark=clamp(S.dark+n)}function damage(id,n=1){S.hp[id]=clamp(S.hp[id]-n)}function heal(id,n=1){S.hp[id]=clamp(S.hp[id]+n)}function alive(){return S.selected.filter(id=>S.hp[id]>0)}function defeated(){if(!alive().length){scene('tabt');return true}return false}
function sound(kind){if(!audioOn)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();let now=ctx.currentTime;if(kind==='ambient'){if(hum)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=55;g.gain.value=.018;o.connect(g).connect(ctx.destination);o.start();hum={o,g};return}let o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='bell'?'sine':'triangle';o.frequency.setValueAtTime(kind==='bell'?220:kind==='hit'?95:340,now);o.frequency.exponentialRampToValueAtTime(kind==='bell'?210:65,now+.7);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.09,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+(kind==='bell'?2:.45));o.connect(g).connect(ctx.destination);o.start();o.stop(now+(kind==='bell'?2:.5))}catch(e){}}
/* Fortællerstemme: klip indtalt med ElevenLabs ligger i voices/skyggeborgen.json (voices/lav_stemmer.py), ét klip pr. afsnit. Mangler et afsnit, bruges browserens stemme. */
let CLIPS=null,playId=0;const clipUrls={};try{fetch('voices/skyggeborgen.json').then(r=>r.ok?r.json():null).then(j=>{if(j&&j.klip)CLIPS=j.klip}).catch(()=>{})}catch(e){}
function clipUrl(t){if(!CLIPS||!CLIPS[t])return null;if(!clipUrls[t]){const bin=atob(CLIPS[t].mp3),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);clipUrls[t]=URL.createObjectURL(new Blob([arr],{type:'audio/mpeg'}))}return clipUrls[t]}
function stopVoice(){playId++;if(voiceAudio){voiceAudio.pause();voiceAudio=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function story(title,text,choices,chapter){stopVoice();S.flags.visionText='';S.screen='story';S.title=title;S.story=text;S.options=choices;S.chapter=chapter;S.phase='story';save();render();if(title.includes('klokke')||title.includes('porten'))sound('bell')}
const op=(label,action,detail='')=>({label,action,detail});
function scene(id){S.pending=null;S.card=null;switch(id){
case 'mira':story('Pigen i regnen',`Regnen trommer mod jeres kapper, da I når frem til landsbyen. Alle vinduer er mørke. Alle undtagen ét.\nI døråbningen står en pige med en alt for stor frakke. Hun holder en rusten nøgle så hårdt, at hendes knoer er blevet hvide.\n“Klokken ringede igen i nat,” hvisker hun. “Den sidste gang … kaldte den mit navn.”\nHun rækker jer nøglen. “Vil I finde ud af, hvem der ringer?”`,[op('Spørg, hvad hun ved om klokken','mira_klokke'),op('Spørg til nøglen','mira_nogle'),op('Lov hende, at I vil hjælpe','mira_lov')],1);break;
case 'port':story('Ridderen ved porten',`Borgens port er lukket. Ved siden af den hænger en mindre dør skævt i sine hængsler.\nEn ridder sidder lænket til muren. Hans rustning er revnet, og hans hjelm er tom. Da I nærmer jer, løfter han langsomt hovedet.\n“Mit navn er Sir Rav. Jeg forsøgte at nå frem til klokken. Borgens egne vagter lænkede mig fast.”`,[op('Befri Sir Rav','rav_roll','Et lavt slag larmer og kan koste liv.'),op('Spørg, hvem der lænkede ham fast','rav_ord'),op('Gå ind i borgen','rav_ga')],2);break;
case 'vej':story('To veje gennem mørket',`I står i en rund sal. Vand drypper fra loftet, og jeres lys får skyggerne til at strække sig hen over gulvet.\nTil venstre fører en trappe op til klokken. Til højre skinner et svagt, blåt lys fra et glemt kapel.\nKLANG.\nFra dybet under jer svarer en anden lyd. Bank. Bank. Bank.`,[op('Gå op i klokketårnet','taarn'),op('Undersøg det glemte kapel','kapel')],3);break;
case 'taarn':S.flags.route='Klokketårnet';story('Klokketårnet',`Trappen snor sig opad. Øverst hænger en enorm klokke. Den står fuldstændig stille.\nAlligevel ryster væggene, da den ringer.\nPå gulvet ligger en lille hammer. Ved siden af den er der ridset en flamme over en lukket dør. Flammen beskytter noget bag døren.`,[op('Undersøg hammeren','card'),op('Følg rebet nedad','vagt')],3);break;
case 'kapel':S.flags.route='Det glemte kapel';story('Det glemte kapel',`Kapellet er fyldt med væltede bænke. Foran alteret brænder ét enkelt blåt lys.\nI væggen bag alteret er der hugget en flamme over en lukket dør. Under billedet står: “Så længe ilden lever, holder døren.”\nLyset blafrer. En lille skygge bevæger sig under alteret.`,[op('Undersøg skyggen','card'),op('Følg trappen bag alteret','vagt')],3);break;
case 'vagt':if(S.dark>=2&&!S.flags.darkEncounter){S.flags.darkEncounter=true;S.screen='dark';S.title='Noget i mørket';S.story='Noget kravler ned ad væggen. I ser det kun et øjeblik — for mange ben, for lange skygger.\nAskevagten vender sig og jager det væk. “Selv nu beskytter jeg jer,” siger han.\nVælg en helt, der mister 1 liv. Den sidste stående helt kan ikke slås ud her.';save();render();return}vagt();break;
case 'elias':story('Stemmen bag døren',`Den rustne nøgle passer i låsen. Døren åbner med en lang, dyb lyd.\nPå den anden side sidder en gammel mand ved en revne i gulvet. Et blåt lys strømmer fra hans hænder ned i stenen.\n“Jeg hedder Elias. Jeg ringede med klokken for at få hjælp. En skygge er fanget under borgen, men nogen har taget en glød fra flammen.”\nHans hænder ryster. “Jeg ved ikke, hvor længe jeg kan holde revnen lukket.”`,[op('Hjælp Elias med at forsegle revnen','seal_roll','Det lykkes, men et lavt slag koster liv.'),op('Tag Elias med til bålet','elias_baal','Revnen står åben.'),op('Lad Elias blive og find gløden','elias_bliv','Revnen står åben.' )],5);break;
case 'slut':finish();break;
case 'tabt':stopVoice();S.screen='lost';S.title='Tilbage ved bålet';S.story='I åbner øjnene ved Det Sidste Bål. Jeres kapper er våde, og ilden er næsten gået ud. Men under asken findes stadig en lille glød.\nBorgen står der endnu. Og klokken er ikke blevet stille.';save();render();break;
}}
function vagt(){let opts=[op('Tal med vagten','talk_roll','Et lavt slag kan starte en kamp.')];if(S.flags.segl)opts.push(op('Vis Flammeseglet','vagt_fred'));if(S.flags.ravWords||S.flags.ed)opts.push(op('Fortæl ham om hans ed','vagt_fred'));opts.push(op('Gå til angreb','fight'));story('Vagten under klokken',`Trappen fører jer ned under borgen. Foran en stendør står en vagt i rustning. Aske siver ud mellem pladerne, hver gang han bevæger sig.\nHan løfter sit sværd. “Ingen må åbne døren.”\nFra den anden side lyder en svag stemme: “Vent … der er nogen herude!”`,opts,4)}
function result(title,text,next='port'){story(title,text,[op('Fortsæt',next)],S.chapter)}
function beginRoll(type){S.screen='roll';S.pending={type,hero:null,helper:null};S.phase='choose';save();render()}
function resolveRoll(n){let p=S.pending,hero=p.hero;let title='',text='',next='';if(p.type==='rav'){S.flags.rav=true;if(n<=4)changeDark();if(n<=2)damage(hero);title='Kæden brister';text=n<=2?'Kæden brister med et øredøvende brag. Larmen vækker mørket, og slaget sårer helten.':n<=4?'Kæden brister, men støjen vækker mørket.':'Kæden løsnes stille.';text+='\nRidderen rejser sig. “Jeg skylder jer en tjeneste. Hvis mørket finder jer, så kald mit navn.”';next='vej'}else if(p.type==='talk'){if(n<=2){changeDark();S.pending=null;if(defeated())return;result('Vagten hæver sværdet','Vagten tror, I vil bryde ind. Mørket vokser.','fight');return}if(n<=4&&!S.flags.segl&&!S.flags.ravWords&&!S.flags.ed){S.pending=null;result('Vagten tøver','Han tøver, men I har intet tegn eller ord, der kan overbevise ham. Han hæver sværdet.','fight');return}title='Vagten lytter';text=n<=4?'Vagten tøver. I viser ham det, I har lært, og langsomt sænker han sværdet.':'Vagten sænker sværdet. “Tal da med stemmen,” siger han.';S.flags.guard='skånet';next='elias'}else if(p.type==='seal'){S.flags.sealed=true;S.flags.elias='døren';if(n<=2)damage(hero);if(n>=5)S.flags.tegn=true;title='Det blå lys';text=n<=2?'Forseglingen holder, men en kold kraft rammer helten for 1 liv.':n<=4?'Det blå lys breder sig gennem sprækkerne. Bankelyden bliver svagere.':'Forseglingen lyser klart. Elias giver jer Vogterens tegn som tak.';text+='\n“Jeg bliver her og holder øje. Find den stjålne glød.”';next='slut'}S.pending=null;if(defeated())return;result(title,text,next)}
function cardResult(suit){S.card=suit;let txt='';if(suit==='heart'){let hurt=S.selected.filter(x=>S.hp[x]<4);if(hurt.length){S.screen='cardheal';S.story='Et varmt, blåt lys samler sig om jeres hænder. Vælg en helt, som får 1 liv tilbage.';save();render();return}S.flags.spark=true;txt='Et varmt, blåt lys samler sig til en lysgnist. I kan bruge den til at give en helt 1 liv.'}if(suit==='diamond'){S.flags.segl=true;txt='I finder et lille sølvsegl med en flamme. Måske genkender nogen det.'}if(suit==='club'){S.flags.ed=true;txt='En hviskende stemme siger: “Vagten glemte sin ed, men ikke sit hjerte.”'}if(suit==='spade'){changeDark();txt='Noget sort glider ud af synsfeltet. Alle lys blafrer. Mørket vokser.'}result('Et fund i mørket',txt,'vagt')}
function combat(){S.screen='combat';S.enemy=S.selected.length;S.acted=[];S.flags.round=1;S.flags.guard='kamp';S.phase='choose';S.pending=null;save();render()}
function afterAction(){if(S.enemy<=0){S.flags.guard='besejret';result('Vagten falder','Vagten falder på knæ. Gløden i hans bryst slukkes langsomt. “Jeg skulle … bare holde den lukket,” hvisker han.','elias');return}if(defeated())return;if(alive().every(x=>S.acted.includes(x))){S.phase='enemy';S.pending=null}else{S.phase='choose';S.pending=null}save();render()}
const upgrades={warrior:['Skjoldmur: Beskyt én helt','Modstød: Beskyt en anden og gør skade'],mage:['Ildstorm: 2 skade','Værneild: Beskyt én helt'],priest:['Helende lys: 2 liv til én','Fælles lys: 1 liv til to'],hunter:['Dæmonblik: Afslør en fare','Jægerens mærke: 2 skade']};
function finish(){S.upgrades={};let campaign={rav:!!S.flags.rav,ravWords:!!S.flags.ravWords,guard:S.flags.guard||'skånet',sealed:!!S.flags.sealed,elias:S.flags.elias||'døren',tegn:!!S.flags.tegn,route:S.flags.route,heroes:S.selected,items:[S.flags.spark?'Lysgnist':null,S.flags.segl?'Flammeseglet':null].filter(Boolean),completed:true};try{localStorage.setItem(campaignKey,JSON.stringify(campaign))}catch(e){}S.screen='ending';S.title='Klokken er stille';S.story='Da I kommer ud af borgen, er regnen holdt op. Langt væk i landsbyen står Mira og venter.\nSå ser I et lille, rødt lys bevæge sig mellem træerne. Det ligner en lanterne.\nMira stivner. “Åh nej,” hvisker hun. “Den fandt han.”';save();render();sound('bell')}
function sidebar(){return `<aside class="side"><div class="panel"><div class="panel-title">✦ &nbsp; Jeres følge</div>${S.selected.map(id=>`<div class="hero-row"><div class="hero-top"><span>${heroes[id].icon} ${heroes[id].name}</span><span class="hearts" aria-label="${S.hp[id]} af 4 liv">${'♥'.repeat(S.hp[id])}${'♡'.repeat(4-S.hp[id])}</span></div><div class="hero-meta">${S.hp[id]===0?'Slået ud · kan hjælpes op':heroes[id].ability+' · '+(S.used[id]?'brugt':'klar')}</div></div>`).join('')}</div><div class="panel"><div class="panel-title">☾ &nbsp; Mørket</div><div class="darkbar">${[1,2,3,4].map(i=>`<i class="pip ${i<=S.dark?'on':''}"></i>`).join('')}</div><div class="muted">${S.dark}/4 · ${S.dark>=2?'Noget følger jer.':'Borgen holder vejret.'}</div>${S.flags.spark?'<button class="quiet" data-action="spark" style="margin-top:14px">✦ Brug lysgnist</button>':''}</div><div class="panel"><div class="panel-title">✧ &nbsp; Eventyret</div><div class="muted">${S.flags.rav?'Sir Rav er fri.<br>':''}${S.flags.segl?'Flammeseglet er fundet.<br>':''}${S.flags.ed?'I kender vagtens ed.<br>':''}${S.flags.route?esc(S.flags.route)+'<br>':''}Nøglen fra Mira er i jeres taske.</div></div></aside>`}
function wrap(inner,side=true){return `<main class="shell"><div class="layout"><div class="main fade">${inner}</div>${side?sidebar():''}</div></main>`}
function heading(title){return `<div class="chapter">Kapitel ${Math.min(S.chapter,5)} &nbsp; · &nbsp; Den tavse klokke</div><h2>${esc(title)}</h2><div class="dots">${[1,2,3,4,5].map(i=>`<i class="${i<=S.chapter?'on':''}"></i>`).join('')}</div>`}
function card(text){return `<div class="story-card"><div class="story-head"><div class="sigil">✧</div><div class="voice-label">Fortælleren</div></div><div class="story">${esc(text)}</div></div>`}
function buttons(opts){return `<div class="choices">${opts.map(o=>`<button class="option" data-action="${esc(o.action)}"><span>${esc(o.label)}${o.detail?`<small>${esc(o.detail)}</small>`:''}</span><span class="arrow">→</span></button>`).join('')}</div>`}
function listHeroes(action,filter=S.selected){return buttons(filter.map(id=>op(`${heroes[id].icon}  ${heroes[id].name} · ${S.hp[id]}/4 liv`,`${action}:${id}`)))}
function render(){let html='';if(S.screen==='intro'){html=`<main class="shell intro"><div class="intro-inner fade"><div class="eyebrow">Et samarbejdseventyr for 2–4 helte</div><h1>Skygge<br>borgen<span style="color:#d5b783">.</span></h1><div class="chapter">I &nbsp; · &nbsp; Den tavse klokke</div><p class="lead">En gammel klokke ringer i mørket. En flamme er ved at dø. Og nogen venter på jer bag borgens mure.</p><div class="rule"></div><div class="toolbar"><button class="btn" data-action="setup">Begynd eventyret &nbsp; →</button><a class="btn alt" href="index.html" style="text-decoration:none">Tilbage til spillene</a></div><p class="muted" style="margin-top:25px">10–20 minutter &nbsp; · &nbsp; D6-terninger og et spil kort</p></div></main>`}else if(S.screen==='setup'){html=wrap(`<div class="eyebrow">Før eventyret begynder</div><h1>Vælg jeres helte</h1><p class="lead">Vælg 2–4 forskellige helte. Hver spiller styrer én helt, og I vinder eller taber sammen.</p><div class="roster">${Object.entries(heroes).map(([id,h])=>`<button class="hero-choice ${S.selected.includes(id)?'selected':''}" data-action="select:${id}" aria-pressed="${S.selected.includes(id)}"><span class="hero-icon">${h.icon}</span><h3>${h.name}</h3><p>${h.desc}</p></button>`).join('')}</div><div class="notice">I skal bruge et blandet spil kort uden jokere og mindst én D6-terning. Vælg mindst to helte.</div><button class="btn" data-action="start" ${S.selected.length<2?'disabled':''}>Træd ind i historien &nbsp; →</button>`,false)}else if(S.screen==='story'){const risky=['Ridderen ved porten','Vagten under klokken','Klokketårnet','Det glemte kapel'].includes(S.title),canSee=risky&&S.selected.includes('hunter')&&S.hp.hunter>0&&!S.used.hunter&&!S.flags.visionText;html=wrap(`${heading(S.title)}${card(S.story)}${S.flags.visionText?`<div class="notice">◈ Dæmonblik: ${esc(S.flags.visionText)}</div>`:''}<div class="choices-label">Hvad gør I?</div>${canSee?buttons([op('◈ Demon Hunter bruger Dæmonblik','vision','Afslør faren, før I vælger.')]):''}${buttons(S.options)}`)}else if(S.screen==='roll'){let p=S.pending;let prompts={rav:'Hvem forsøger at bryde kæden?',talk:'Hvem taler med askevagten?',seal:'Hvem hjælper Elias med at forsegle revnen?'};let content=heading('Terningeslag');if(p.phase==='x'){}if(!p.hero){content+=card(prompts[p.type])+`<div class="choices-label">Vælg en helt</div>`+listHeroes('rollhero',alive())}else if(p.helper===null){content+=card(`${heroes[p.hero].name} gør forsøget. Vil en anden helt hjælpe? Hjælp giver én ekstra terning. I beholder det højeste tal.`)+`<div class="choices-label">Vælg hjælp</div>`+listHeroes('helper',alive().filter(x=>x!==p.hero))+buttons([op('Ingen hjælper','helper:none')])}else{content+=card(`${heroes[p.hero].name}${p.helper!=='none'?' og '+heroes[p.helper].name:''}: Slå ${p.helper!=='none'?'2 terninger og vælg den højeste':'1 terning'}. Tryk på resultatet.\n1–2: en pris · 3–4: lykkes med en mindre pris · 5–6: lykkes godt.`)+`<div class="choices-label">Hvad viser ${p.helper!=='none'?'den højeste terning':'terningen'}?</div><div class="rolls">${[1,2,3,4,5,6].map(n=>`<button class="die" data-action="roll:${n}" aria-label="Slaget blev ${n}">${n}</button>`).join('')}</div>`}html=wrap(content)}else if(S.screen==='card'){html=wrap(`${heading('Vend et kort')}${card('Vend det øverste kort fra den rigtige kortbunke. Hvilken kulør har det? Læg derefter kortet i afkastbunken.')}<div class="choices-label">Vælg kortets kulør</div><div class="suits"><button class="suit red" data-action="card:heart">♥ Hjerter</button><button class="suit red" data-action="card:diamond">♦ Ruder</button><button class="suit" data-action="card:club">♣ Klør</button><button class="suit" data-action="card:spade">♠ Spar</button></div>`)}else if(S.screen==='dark'||S.screen==='cardheal'||S.screen==='heal'||S.screen==='sparkheal'||S.screen==='protect'){let titles={dark:'Noget i mørket',cardheal:'Det blå lys',heal:'Helende lys',sparkheal:'Lysgnisten',protect:'Skjoldmur'};let eligible=S.screen==='dark'?alive():S.screen==='protect'?alive():S.selected.filter(x=>S.hp[x]<4);html=wrap(`${heading(titles[S.screen])}${card(S.story||'Vælg en helt.') }<div class="choices-label">Vælg en helt</div>${listHeroes('target',eligible)}${S.screen!=='dark'&&S.screen!=='cardheal'?buttons([op('Fortryd','cancel_target')]):''}`)}else if(S.screen==='combat'){let content=heading('Kampen mod askevagten')+`<div class="story-card"><div class="story-head"><div class="sigil">⚔</div><div class="voice-label">Runde ${S.flags.round}</div></div><div class="story"><div class="combat-head"><span class="enemy">Askevagten</span><span class="hearts">${'◆'.repeat(S.enemy)}</span></div><p style="font:15px/1.6 'Nunito Sans',sans-serif;color:#b7b9be;margin-top:15px">Hver helt handler én gang. Angreb: 1–2 misser, 3–4 rammer og koster 1 liv, 5–6 rammer uden skade.</p></div></div>`;if(S.phase==='choose'){content+=`<div class="choices-label">Hvem handler?</div>`+listHeroes('fighter',alive().filter(id=>!S.acted.includes(id)));if(S.flags.round>1)content+=buttons([op('Stop kampen og tal','peace')]);}else if(S.phase==='action'){let id=S.pending.hero;content+=`<div class="choices-label">${heroes[id].name} · vælg handling</div>`+buttons([op('Angrib','attack'),...(!S.used[id]&&id==='mage'?[op('Brug Ildstorm · 2 skade','mage')]:[]),...(!S.used[id]&&id==='priest'&&S.selected.some(x=>S.hp[x]<4)?[op('Brug Helende lys','priest')]:[]),...(S.selected.some(x=>S.hp[x]===0)?[op('Hjælp en falden helt op','revive')]:[]),op('Vælg en anden helt','fight_back')])}else if(S.phase==='attackhelper'){let id=S.pending.hero;content+=card(`${heroes[id].name} angriber. En anden helt kan bruge sin handling på at hjælpe og give en ekstra terning.`)+`<div class="choices-label">Hvem hjælper?</div>`+listHeroes('fighthelp',alive().filter(x=>x!==id&&!S.acted.includes(x)))+buttons([op('Angrib uden hjælp','fighthelp:none')])}else if(S.phase==='attackroll'){content+=card(`Slå ${S.pending.helper==='none'?'1 terning':'2 terninger og behold den højeste'}. Tryk på resultatet.`)+`<div class="rolls">${[1,2,3,4,5,6].map(n=>`<button class="die" data-action="attackroll:${n}">${n}</button>`).join('')}</div>`}else if(S.phase==='revive'){content+=`<div class="choices-label">Hvem hjælpes op?</div>`+listHeroes('revive',S.selected.filter(x=>S.hp[x]===0))+buttons([op('Tilbage','fight_action')])}else if(S.phase==='enemy'){content+=card('Vagten angriber! Vælg en stående helt, som mister 1 liv. Warrior kan beskytte mod angrebet, hvis Skjoldmur er klar.')+`<div class="choices-label">Hvem rammes?</div>`+listHeroes('enemy',alive());if(S.selected.includes('warrior')&&S.hp.warrior>0&&!S.used.warrior)content+=buttons([op('Warrior bruger Skjoldmur','shield')])}html=wrap(content)}else if(S.screen==='ending'){let f=S.flags;html=wrap(`<div class="eyebrow">Eventyret er klaret</div><h1>${esc(S.title)}</h1>${card(S.story)}<div class="choices-label">Det følger jer videre</div><div class="panel"><p>${f.rav?'✦ I befriede Sir Rav. Han skylder jer en tjeneste.':'✦ Sir Rav blev ved porten.'}</p><p>✦ ${f.sealed?'Revnen er forseglet.':'Revnen står stadig åben.'}</p><p>✦ Elias ${f.elias==='bålet'?'venter ved Det Sidste Bål':'er ved døren'}.</p><p>✦ En glød er taget fra borgens flamme.</p></div><div class="choices-label">Heltenes udvikling</div>${S.selected.map(id=>`<div class="panel" style="margin-bottom:8px"><strong>${heroes[id].name}</strong><p class="muted">Vælg en evne til næste eventyr:</p>${buttons(upgrades[id].map((label,i)=>op((S.upgrades?.[id]===i?'✓ ':'')+label,`upgrade:${id},${i}`)))}</div>`).join('')}<p class="muted">Valg og udvikling gemmes på denne enhed. Næste eventyr er endnu ikke bygget.</p><div class="toolbar"><button class="btn" data-action="again">Spil eventyret igen</button><a class="btn alt" href="index.html" style="text-decoration:none">Til spilmenuen</a></div>`)}else if(S.screen==='lost'){html=wrap(`<div class="eyebrow">Eventyret er ikke slut</div><h1>${esc(S.title)}</h1>${card(S.story)}<div class="toolbar"><button class="btn" data-action="retry">Prøv igen</button><button class="btn alt" data-action="setup">Vælg nye helte</button></div>`)}app.innerHTML=html;save()}
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let [a,v]=b.dataset.action.split(':');sound('click');switch(a){
case'upgrade':{let [id,i]=v.split(',');S.upgrades=S.upgrades||{};S.upgrades[id]=+i;try{let c=JSON.parse(localStorage.getItem(campaignKey));c.upgrades=S.upgrades;localStorage.setItem(campaignKey,JSON.stringify(c))}catch(e){}render();break}case'setup':S=initial();S.screen='setup';render();break;case'select':if(S.selected.includes(v))S.selected=S.selected.filter(x=>x!==v);else if(S.selected.length<4)S.selected.push(v);render();break;case'start':if(S.selected.length<2)return;S.selected.forEach(id=>{S.hp[id]=4;S.used[id]=false});scene('mira');break;
case'mira_klokke':result('Et navn i mørket','“Den gamle klokkemand hed Elias,” siger Mira. “Han passede klokken, dengang borgen stadig havde lys.”');break;case'mira_nogle':result('Den rustne nøgle','Der er en lille klokke ridset ind i metallet. “Far sagde, at nøglen nok tilhører borgen,” siger Mira.');break;case'mira_lov':S.flags.promise=true;result('Et løfte','Mira smiler et øjeblik. Så høres et dybt KLANG fra borgen. “Den plejer ikke at ringe, når jeg er vågen.”');break;
case'rav_roll':beginRoll('rav');break;case'rav_ord':S.flags.ravWords=true;result('Ridderens ord','“Borgens egne vagter lænkede mig fast,” siger Rav. “Hvis I møder deres anfører, så sig: Flammen er ikke jeres fjende.”','vej');break;case'rav_ga':result('Gennem porten','Bag jer rasler lænkerne. “Hvis I finder klokkemanden,” kalder ridderen, “så sig, at jeg forsøgte.”','vej');break;
case'vej':case'port':case'taarn':case'kapel':case'vagt':case'elias':case'slut':scene(a);break;case'card':if(v)cardResult(v);else{S.screen='card';render()}break;
case'rollhero':S.pending.hero=v;render();break;case'helper':S.pending.helper=v;render();break;case'roll':resolveRoll(+v);break;
case'vagt_fred':S.flags.guard='skånet';result('Vagten husker','Vagten står helt stille. Så synker hans sværd langsomt mod gulvet. “Jeg husker en ed,” siger han.','elias');break;case'talk_roll':beginRoll('talk');break;case'seal_roll':beginRoll('seal');break;
case'elias_baal':S.flags.elias='bålet';S.flags.sealed=false;result('Elias følger med','I hjælper Elias på benene. Bag jer lyder et knæk fra stenen. “Revnen er der stadig. Hvis I finder gløden, kan vi måske lukke den sammen.”','slut');break;case'elias_bliv':S.flags.elias='døren';S.flags.sealed=false;result('Et løfte i mørket','“Jeg kan holde den lidt endnu,” siger Elias. “Gå. Find den, der tog gløden.” I lukker døren forsigtigt bag jer.','slut');break;
case'vision':S.used.hunter=true;S.flags.visionText=S.title==='Ridderen ved porten'?'Kæden kan larme og såre den, der bryder den.':S.title==='Vagten under klokken'?'Samtalen kan ende i kamp; et kendt tegn eller løfte kan berolige vagten.':'Et sort kort vækker mørket. De andre kulører giver hjælp eller spor.';render();break;case'fight':combat();break;case'fighter':S.pending={hero:v};S.phase='action';render();break;case'fight_back':S.pending=null;S.phase='choose';render();break;case'fight_action':S.phase='action';render();break;case'attack':S.phase='attackhelper';render();break;case'fighthelp':S.pending.helper=v;if(v!=='none')S.acted.push(v);S.phase='attackroll';render();break;case'attackroll':{let n=+v,id=S.pending.hero;S.acted.push(id);if(n>=3){S.enemy--;sound('hit')}if(n===3||n===4)damage(id);S.pending=null;afterAction();break}case'mage':S.used.mage=true;S.acted.push('mage');S.enemy=Math.max(0,S.enemy-2);sound('hit');S.pending=null;afterAction();break;case'priest':S.screen='heal';S.story='Priest kalder på lyset. Vælg en helt, der får 2 liv tilbage.';render();break;case'revive':if(v){heal(v);S.acted.push(S.pending.hero);S.pending=null;afterAction()}else{S.phase='revive';render()}break;
case'enemy':damage(v);if(defeated())return;S.flags.round++;S.acted=[];S.phase='choose';render();break;case'shield':S.used.warrior=true;S.flags.round++;S.acted=[];S.phase='choose';render();break;case'peace':S.flags.guard='skånet';result('Vagten husker','Vagten sænker sit sværd. “Jeg gav et løfte,” hvisker han. Han lader jer tale med stemmen bag døren.','elias');break;
case'target':if(S.screen==='dark'){if(alive().length===1&&S.hp[v]===1){}else damage(v);if(!defeated())vagt()}else if(S.screen==='cardheal'){heal(v);result('Et fund i mørket','Det blå lys giver helten 1 liv tilbage.','vagt')}else if(S.screen==='heal'){heal(v,2);S.used.priest=true;S.acted.push(S.pending.hero);S.pending=null;S.screen='combat';afterAction()}else if(S.screen==='sparkheal'){heal(v);S.flags.spark=false;S.screen=S.returnScreen;render()}break;
case'spark':if(!S.selected.some(x=>S.hp[x]<4))break;S.returnScreen=S.screen;S.screen='sparkheal';S.story='Vælg en helt, der får 1 liv tilbage.';render();break;case'cancel_target':S.screen=S.returnScreen||'combat';if(S.screen==='combat')S.phase='action';render();break;case'retry':{let chosen=S.selected.slice();S=initial();S.selected=chosen;chosen.forEach(id=>{S.hp[id]=4;S.used[id]=false});scene('mira');break}case'again':S=initial();S.screen='setup';render();break;
}});
document.getElementById('sound').onclick=()=>{audioOn=!audioOn;document.getElementById('sound').textContent=`♫ Lyd: ${audioOn?'til':'fra'}`;if(audioOn){sound('ambient');sound('bell')}else if(hum){hum.o.stop();hum=null}};
document.getElementById('restart').onclick=()=>{if(confirm('Start et nyt eventyr? Det nuværende forsøg bliver slettet.')){stopVoice();S=initial();render()}};
document.getElementById('narrate').onclick=()=>{stopVoice();let text=S.story||'Skyggeborgen. Den tavse klokke.';const parts=text.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!CLIPS||!parts.every(p=>CLIPS[p])){speak(text);return}
  const id=playId;let i=0;const next=()=>{if(id!==playId)return;if(i>=parts.length){voiceAudio=null;return}const a=new Audio(clipUrl(parts[i++]));voiceAudio=a;a.onended=next;a.play().catch(()=>{if(id===playId){voiceAudio=null;speak(parts.slice(i-1).join('\n'))}})};next()};
function speak(text){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(text);u.lang='da-DK';u.rate=.88;speechSynthesis.speak(u)}else alert('Din browser understøtter ikke oplæsning. Du kan tilføje indtalte lydfiler i voices-mappen.')}
render();
</script></body></html>
